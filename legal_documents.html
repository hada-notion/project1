<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>법정 서류 출력</title>
<style>
  :root {
    --text-primary: #2C2C2B;
    --text-secondary: #7D7A75;
    --canvas: #FFFFFF;
    --surface: #F9F8F7;
    --surface-2: #F0EFED;
    --border: #E6E5E3;
    --blue: #2783DE;
    --blue-soft: #E5F2FC;
    --red: #E56458;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--surface);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text-primary);
    font-size: 14px;
  }
  #login-screen {
    display: none; min-height: 100vh; align-items: center; justify-content: center; flex-direction: column;
  }
  #login-screen .box {
    background: var(--canvas); border: 1px solid var(--border); border-radius: 12px; padding: 32px;
    width: min(90vw, 320px); display: flex; flex-direction: column; gap: 10px;
  }
  #login-screen h1 { font-size: 16px; margin: 0 0 8px; text-align: center; }
  #login-input, #login-btn { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 14px; }
  #login-btn { background: var(--blue); color: #fff; border: none; cursor: pointer; }
  .login-error { color: var(--red); font-size: 12px; min-height: 14px; text-align: center; }

  #app-screen { display: none; flex-direction: column; min-height: 100vh; }
  header.app-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; background: var(--canvas); border-bottom: 1px solid var(--border);
  }
  header.app-header h1 { font-size: 16px; margin: 0; }
  header.app-header button { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 13px; }

  main { padding: 20px; display: flex; flex-direction: column; gap: 16px; max-width: 1200px; width: 100%; margin: 0 auto; }

  .panel { background: var(--canvas); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }

  .doc-type-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .doc-type-tabs button {
    padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2);
    cursor: pointer; font-size: 13px; color: var(--text-primary);
  }
  .doc-type-tabs button.active { background: var(--blue); color: #fff; border-color: var(--blue); }

  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-top: 14px; }
  .filters .field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-secondary); }
  .filters input, .filters select {
    padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); font-size: 13px; min-width: 140px;
  }
  .filters button {
    padding: 9px 18px; border-radius: 6px; border: none; background: var(--blue); color: #fff; cursor: pointer; font-size: 13px;
  }

  .toolbar { display: flex; gap: 8px; justify-content: flex-end; }
  .toolbar button {
    padding: 8px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-2); cursor: pointer; font-size: 13px;
  }

  #doc-status { font-size: 13px; color: var(--text-secondary); }

  #print-area { background: #fff; padding: 24px; }
  #print-area h2 { text-align: center; font-size: 18px; margin: 0 0 4px; }
  #print-area .doc-sub { text-align: center; font-size: 12px; color: var(--text-secondary); margin-bottom: 16px; }
  table.doc-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.doc-table th, table.doc-table td { border: 1px solid #999; padding: 4px 6px; text-align: center; }
  table.doc-table th { background: #f2f2f2; }
  table.doc-table td.name-cell, table.doc-table th.name-cell { text-align: left; white-space: nowrap; }
  .legend { margin-top: 10px; font-size: 12px; color: var(--text-secondary); }
  .sign-line { margin-top: 40px; text-align: right; font-size: 13px; }

  @media print {
    header.app-header, .panel:not(#print-panel), .toolbar { display: none !important; }
    body { background: #fff; }
    main { padding: 0; max-width: none; }
    #print-panel { border: none; padding: 0; }
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="box">
    <h1>🔒 법정 서류 출력 (관리자용)</h1>
    <input type="password" id="login-input" placeholder="관리자 비밀번호" autocomplete="current-password">
    <button id="login-btn" onclick="submitLogin()">로그인</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div id="app-screen">
  <header class="app-header">
    <h1>📑 법정 서류 출력</h1>
    <button id="logout-btn">로그아웃</button>
  </header>
  <main>
    <div class="panel">
      <div class="doc-type-tabs" id="doc-type-tabs">
        <button data-type="attendance" class="active">수강생 출석부</button>
        <button data-type="student-register">수강생 대장</button>
        <button data-type="receipt-ledger">교습비등 영수증 원부</button>
        <button data-type="cash-journal">현금출납부</button>
      </div>
      <div class="filters">
        <div class="field"><label>시작일</label><input type="date" id="f-start"></div>
        <div class="field"><label>종료일</label><input type="date" id="f-end"></div>
        <div class="field"><label>클래스</label><select id="f-class"><option value="">전체 클래스</option></select></div>
        <div class="field"><label>학생</label><select id="f-student" disabled><option value="">클래스를 먼저 선택하세요</option></select></div>
        <div class="field"><label>검색(이름)</label><input type="text" id="f-search" placeholder="학생 이름"></div>
        <button id="btn-query">조회</button>
      </div>
      <div style="margin-top:6px;font-size:12px;color:var(--text-secondary)"><span id="meta-status" role="status" aria-live="polite"></span> <button id="btn-meta-retry" type="button" hidden>재시도</button></div>
      <div id="doc-status" style="margin-top:8px"></div>
    </div>

    <div class="toolbar">
      <button id="btn-print">🖨️ 인쇄(PDF)</button>
      <button id="btn-excel" disabled>⬇️ Excel 다운로드</button>
    </div>

    <div class="panel" id="print-panel">
      <div id="print-area">
        <p style="text-align:center;color:#999">위에서 서류 종류와 기간을 선택한 뒤 [조회]를 눌러주세요.</p>
      </div>
    </div>
  </main>
</div>

<script>
  const SUPABASE_URL = "https://twczhsxybkcvjkdfdxvs.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3Y3poc3h5YmtjdmprZGZkeHZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyOTcwMDQsImV4cCI6MjEwMzg3MzAwNH0.t7Ltb_iSYqE4gHSoGSm-OlpiLjGqIcgrhzGJ-t56EDc";
  const ADMIN_KEY_STORAGE = "admin_key";
  function getAdminKey() { return localStorage.getItem(ADMIN_KEY_STORAGE) || ""; }

  function showLoginScreen(errorMsg) {
    metaRequestId++;
    docRequestId++;
    loadedDocument = null;
    document.getElementById("btn-excel").disabled = true;
    document.getElementById("login-screen").style.display = "flex";
    document.getElementById("app-screen").style.display = "none";
    document.getElementById("login-error").textContent = errorMsg || "";
    document.getElementById("login-input").value = "";
    setTimeout(() => document.getElementById("login-input").focus(), 50);
  }
  async function showAppScreen(initialClasses) {
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("app-screen").style.display = "flex";
    setDefaultDates();
    await loadClasses(initialClasses);
  }
  document.getElementById("logout-btn").addEventListener("click", () => {
    if (!confirm("로그아웃 하시겠습니까?")) return;
    localStorage.removeItem(ADMIN_KEY_STORAGE);
    showLoginScreen();
  });

  async function callFn(body) {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/get-legal-document-data`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-admin-key": getAdminKey(),
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        "apikey": SUPABASE_ANON_KEY,
      },
      body: JSON.stringify(body),
    });
    if (res.status === 401) { showLoginScreen("비밀번호가 올바르지 않습니다."); throw new Error("인증 실패"); }
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(json.error || `서버 오류: ${res.status}`);
    return json;
  }

  async function submitLogin() {
    const input = document.getElementById("login-input");
    const key = input.value.trim();
    const btn = document.getElementById("login-btn");
    const errEl = document.getElementById("login-error");
    if (!key) { errEl.textContent = "비밀번호를 입력하세요."; return; }
    btn.disabled = true; btn.textContent = "확인 중..."; errEl.textContent = "";
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/get-legal-document-data`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-admin-key": key, "Authorization": `Bearer ${SUPABASE_ANON_KEY}`, "apikey": SUPABASE_ANON_KEY },
        body: JSON.stringify({ action: "classes" }),
      });
      if (res.status === 401) { errEl.textContent = "비밀번호가 올바르지 않습니다."; return; }
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `서버 오류: ${res.status}`);
      if (!Array.isArray(data.classes)) throw new Error("클래스 목록을 확인할 수 없습니다.");
      localStorage.setItem(ADMIN_KEY_STORAGE, key);
      await showAppScreen(data.classes);
    } catch (err) {
      errEl.textContent = "로그인에 실패했습니다: " + err.message;
    } finally {
      btn.disabled = false; btn.textContent = "로그인";
    }
  }
  document.getElementById("login-input").addEventListener("keydown", (e) => { if (e.key === "Enter") submitLogin(); });

  let currentDocType = "attendance";
  let loadedDocument = null;
  let docRequestId = 0;
  document.getElementById("doc-type-tabs").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-type]");
    if (!btn) return;
    document.querySelectorAll("#doc-type-tabs button").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    currentDocType = btn.dataset.type;
  });

  function setDefaultDates() {
    const now = new Date(Date.now() + 9 * 60 * 60 * 1000);
    const y = now.getUTCFullYear(), m = now.getUTCMonth();
    const first = new Date(Date.UTC(y, m, 1)).toISOString().slice(0, 10);
    const last = new Date(Date.UTC(y, m + 1, 0)).toISOString().slice(0, 10);
    document.getElementById("f-start").value = first;
    document.getElementById("f-end").value = last;
  }

  // 초기에는 클래스만 조회하고, 반 선택 시 그 반의 학생만 조회한다.
  let metaRequestId = 0;
  let retryMeta = null;
  const classSel = document.getElementById("f-class");
  const studentSel = document.getElementById("f-student");
  const queryBtn = document.getElementById("btn-query");
  const retryBtn = document.getElementById("btn-meta-retry");

  function setMetaStatus(message, retry = null) {
    document.getElementById("meta-status").textContent = message;
    retryMeta = retry;
    retryBtn.hidden = !retry;
  }
  function resetStudents(label) {
    studentSel.replaceChildren(new Option(label, ""));
    studentSel.disabled = true;
  }
  function appendOptions(select, rows) {
    rows.forEach((row) => select.add(new Option(row.name, row.id)));
  }
  async function loadClasses(initialClasses) {
    const requestId = ++metaRequestId;
    classSel.disabled = true;
    classSel.replaceChildren(new Option("클래스 불러오는 중…", ""));
    resetStudents("클래스를 먼저 선택하세요");
    queryBtn.disabled = true;
    setMetaStatus("클래스 불러오는 중…");
    try {
      const classes = initialClasses || (await callFn({ action: "classes" })).classes;
      if (requestId !== metaRequestId) return;
      if (!Array.isArray(classes)) throw new Error("클래스 목록을 확인할 수 없습니다.");
      classSel.replaceChildren(new Option("전체 클래스", ""));
      appendOptions(classSel, classes);
      classSel.disabled = false;
      queryBtn.disabled = false;
      setMetaStatus(`클래스 ${classes.length}개 · 반을 선택하면 해당 반 학생을 불러옵니다.`);
    } catch (err) {
      if (requestId !== metaRequestId) return;
      classSel.replaceChildren(new Option("클래스 로딩 실패", ""));
      setMetaStatus("클래스 로딩 실패: " + err.message, () => loadClasses());
    }
  }
  async function loadClassStudents() {
    const requestId = ++metaRequestId;
    const classId = classSel.value;
    resetStudents(classId ? "학생 불러오는 중…" : "클래스를 먼저 선택하세요");
    if (!classId) {
      queryBtn.disabled = false;
      setMetaStatus("전체 클래스 조회가 가능합니다. 반을 선택하면 해당 반 학생을 불러옵니다.");
      return;
    }
    queryBtn.disabled = true;
    setMetaStatus("해당 반 학생 불러오는 중…");
    try {
      const data = await callFn({ action: "students", classId });
      if (requestId !== metaRequestId || classSel.value !== classId) return;
      if (!Array.isArray(data.students)) throw new Error("학생 목록을 확인할 수 없습니다.");
      studentSel.replaceChildren(new Option("전체 학생", ""));
      appendOptions(studentSel, data.students);
      studentSel.disabled = data.students.length === 0;
      queryBtn.disabled = false;
      setMetaStatus(data.students.length ? `해당 반 학생 ${data.students.length}명` : "해당 반에 등록된 학생이 없습니다.");
    } catch (err) {
      if (requestId !== metaRequestId || classSel.value !== classId) return;
      resetStudents("학생 로딩 실패");
      setMetaStatus("학생 로딩 실패: " + err.message, loadClassStudents);
    }
  }
  classSel.addEventListener("change", loadClassStudents);
  retryBtn.addEventListener("click", () => { if (retryMeta) retryMeta(); });

  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function won(n) { return (n || 0).toLocaleString("ko-KR") + "원"; }

  function renderAttendance(data) {
    const days = data.dateList.map((d) => d.slice(8, 10));
    let html = `<h2>수강생 출석부</h2><div class="doc-sub">${esc(data.periodStart)} ~ ${esc(data.periodEnd)}</div>`;
    html += `<table class="doc-table"><thead><tr><th class="name-cell">클래스</th><th class="name-cell">성명</th>`;
    days.forEach((d) => (html += `<th>${d}</th>`));
    html += `</tr></thead><tbody>`;
    data.students.forEach((s) => {
      html += `<tr><td class="name-cell">${esc(s.className)}</td><td class="name-cell">${esc(s.studentName)}</td>`;
      data.dateList.forEach((d) => (html += `<td>${esc(s.days[d] || "")}</td>`));
      html += `</tr>`;
    });
    html += `</tbody></table><div class="legend">○ 출석 · × 결석 · △ 보강 (교습기간 3개월 이상 수강생 대상, 학원법 시행규칙 별표2 — 3년간 보관)</div>`;
    return html;
  }

  function renderStudentRegister(data) {
    let html = `<h2>수강생 대장</h2><div class="doc-sub">별지 제25호서식 준용 (3년간 보관)</div>`;
    html += `<table class="doc-table"><thead><tr><th>클래스</th><th>성명</th><th>생년월일</th><th>성별</th><th>학생 연락처</th><th>보호자 연락처</th><th>등록일</th><th>종료일</th></tr></thead><tbody>`;
    data.rows.forEach((r) => {
      html += `<tr><td>${esc(r.className)}</td><td class="name-cell">${esc(r.studentName)}</td><td>${esc(r.birthDate)}</td><td>${esc(r.gender)}</td><td>${esc(r.studentPhone)}</td><td>${esc(r.parentPhone)}</td><td>${esc(r.enrollDate)}</td><td>${esc(r.endDate)}</td></tr>`;
    });
    html += `</tbody></table>`;
    return html;
  }

  function renderReceiptLedger(data) {
    let html = `<h2>교습비등 영수증 원부</h2><div class="doc-sub">별지 제24호서식 준용 (5년간 보관)</div>`;
    html += `<table class="doc-table"><thead><tr><th>일련번호</th><th>납부일자</th><th>납부자(성명)</th><th>등록번호</th><th>생년월일</th><th>교습과목</th><th>교습비</th><th>기타경비</th><th>비고</th></tr></thead><tbody>`;
    let total = 0;
    data.rows.forEach((r) => {
      total += r.amount;
      html += `<tr><td>${r.serialNo}</td><td>${esc(r.paymentDate)}</td><td class="name-cell">${esc(r.payerName)}</td><td>${esc(r.registrationNo)}</td><td>${esc(r.birthDate)}</td><td>${esc(r.subject)}</td><td>${won(r.amount)}</td><td>${won(r.etcExpense)}</td><td>${esc(r.note)}</td></tr>`;
    });
    html += `</tbody></table><div class="legend">합계: ${won(total)}</div><div class="sign-line">위와 같이 교습비등을 받았음을 확인함. &nbsp;&nbsp;&nbsp; 원장 (서명 또는 인)</div>`;
    return html;
  }

  function renderCashJournal(data) {
    let html = `<h2>현금출납부</h2><div class="doc-sub">현금 입·출금 기록 (5년간 보관)</div>`;
    html += `<table class="doc-table"><thead><tr><th>날짜</th><th>구분</th><th>내용</th><th>비고</th><th>금액</th><th>잔액</th></tr></thead><tbody>`;
    data.rows.forEach((r) => {
      html += `<tr><td>${esc(r.date)}</td><td>${esc(r.type)}</td><td class="name-cell">${esc(r.title)}</td><td>${esc(r.note)}</td><td>${won(r.amount)}</td><td>${won(r.balance)}</td></tr>`;
    });
    html += `</tbody></table>`;
    return html;
  }

  document.getElementById("btn-query").addEventListener("click", async () => {
    const statusEl = document.getElementById("doc-status");
    const printArea = document.getElementById("print-area");
    const requestId = ++docRequestId;
    document.getElementById("btn-excel").disabled = true;
    loadedDocument = null;
    statusEl.textContent = "조회 중...";
    const body = {
      docType: currentDocType,
      periodStart: document.getElementById("f-start").value,
      periodEnd: document.getElementById("f-end").value,
      classId: document.getElementById("f-class").value || undefined,
      studentId: document.getElementById("f-student").value || undefined,
      search: document.getElementById("f-search").value.trim() || undefined,
    };
    const targetLabel = body.studentId
      ? studentSel.selectedOptions[0]?.textContent || "학생"
      : body.classId ? classSel.selectedOptions[0]?.textContent || "클래스" : "전체";
    const filterLabel = `클래스: ${classSel.selectedOptions[0]?.textContent || "전체"} · 학생: ${studentSel.value ? studentSel.selectedOptions[0]?.textContent : "전체 학생"}${body.search ? " · 검색: " + body.search : ""}`;
    try {
      const data = await callFn(body);
      if (requestId !== docRequestId) return;
      let html = "";
      if (body.docType === "attendance") html = renderAttendance(data);
      else if (body.docType === "student-register") html = renderStudentRegister(data);
      else if (body.docType === "receipt-ledger") html = renderReceiptLedger(data);
      else if (body.docType === "cash-journal") html = renderCashJournal(data);
      printArea.innerHTML = html;
      loadedDocument = { data, query: { ...body }, filterLabel, targetLabel };
      document.getElementById("btn-excel").disabled = false;
      statusEl.textContent = "조회 완료";
    } catch (err) {
      if (requestId !== docRequestId) return;
      statusEl.textContent = "조회 실패: " + err.message;
    }
  });

  document.getElementById("btn-print").addEventListener("click", () => window.print());

  // 라이브러리를 같은 저장소에서 필요할 때만 읽는다. 조회 데이터는 외부로 전송하지 않는다.
  let excelLibraryPromise;
  function loadExcelLibrary() {
    if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
    if (!excelLibraryPromise) {
      excelLibraryPromise = new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = "vendor/exceljs-4.4.0.min.js";
        script.onload = () => window.ExcelJS ? resolve(window.ExcelJS) : reject(new Error("엑셀 라이브러리를 읽지 못했습니다."));
        script.onerror = () => { script.remove(); reject(new Error("엑셀 라이브러리 로딩 실패. 다시 눌러주세요.")); };
        document.head.appendChild(script);
      }).catch((err) => { excelLibraryPromise = null; throw err; });
    }
    return excelLibraryPromise;
  }
  function excelDate(value) {
    if (!value) return "";
    const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value));
    if (!match) return String(value);
    const date = new Date(Date.UTC(+match[1], +match[2] - 1, +match[3]));
    return date.toISOString().slice(0, 10) === value ? date : String(value);
  }
  function excelNumber(value) {
    const number = Number(value ?? 0);
    return Number.isFinite(number) ? number : 0;
  }
  function excelText(value) { return String(value ?? ""); }

  async function buildExcelWorkbook(snapshot) {
    const ExcelJS = await loadExcelLibrary();
    const { data, query, filterLabel } = snapshot;
    const definitions = {
      attendance: { title: "수강생 출석부", headers: ["클래스", "성명", ...data.dateList || []], widths: [18, 16, ...(data.dateList || []).map(() => 6)], dates: [], money: [] },
      "student-register": { title: "수강생 대장", headers: ["클래스", "성명", "생년월일", "성별", "학생 연락처", "보호자 연락처", "등록일", "종료일"], widths: [18, 16, 14, 8, 20, 20, 14, 14], dates: [3, 7, 8], money: [] },
      "receipt-ledger": { title: "교습비등 영수증 원부", headers: ["일련번호", "납부일자", "납부자(성명)", "등록번호", "생년월일", "교습과목", "교습비", "기타경비", "비고"], widths: [12, 14, 18, 16, 14, 18, 16, 16, 28], dates: [2, 5], money: [7, 8] },
      "cash-journal": { title: "현금출납부", headers: ["날짜", "구분", "내용", "비고", "금액", "잔액"], widths: [14, 10, 30, 30, 18, 18], dates: [1], money: [5, 6] },
    };
    const def = definitions[query.docType];
    if (!def) throw new Error("지원하지 않는 서류입니다.");
    const wb = new ExcelJS.Workbook();
    wb.creator = "하다 학원관리";
    wb.created = new Date();
    wb.calcProperties.fullCalcOnLoad = true;
    const ws = wb.addWorksheet(def.title, {
      views: [{ state: "frozen", ySplit: 5, xSplit: query.docType === "attendance" ? 2 : 0, showGridLines: false }],
      pageSetup: { paperSize: 9, orientation: "landscape", fitToPage: true, fitToWidth: 1, fitToHeight: 0, printTitlesRow: "1:5", horizontalCentered: true,
        margins: { left: 0.25, right: 0.25, top: 0.4, bottom: 0.4, header: 0.2, footer: 0.2 } },
    });
    ws.columns = def.widths.map((width) => ({ width }));
    const columnCount = def.headers.length;
    const lastCol = ws.getColumn(columnCount).letter;
    ws.mergeCells(1, 1, 1, columnCount);
    ws.getCell("A1").value = def.title;
    ws.getCell("A1").font = { name: "Malgun Gothic", size: 18, bold: true };
    ws.getCell("A1").alignment = { horizontal: "center", vertical: "middle" };
    ws.getRow(1).height = 32;
    ws.mergeCells(2, 1, 2, columnCount);
    ws.getCell("A2").value = `조회 기간: ${query.periodStart || "미지정"} ~ ${query.periodEnd || "미지정"}`;
    ws.mergeCells(3, 1, 3, columnCount);
    ws.getCell("A3").value = filterLabel;
    ws.getRow(3).height = 30;
    [2, 3].forEach((r) => { ws.getCell(r, 1).font = { name: "Malgun Gothic", size: 10, color: { argb: "FF666666" } }; ws.getCell(r, 1).alignment = { wrapText: true, vertical: "middle" }; });
    ws.getRow(5).values = def.headers;
    ws.getRow(5).height = 30;
    ws.getRow(5).eachCell((cell, col) => {
      if (query.docType === "attendance" && col > 2) { cell.value = excelDate(cell.value); cell.numFmt = "mm-dd"; }
      cell.font = { name: "Malgun Gothic", size: 10, bold: true };
      cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFE5F2FC" } };
      cell.alignment = { horizontal: "center", vertical: "middle", wrapText: true };
      cell.border = { bottom: { style: "thin", color: { argb: "FF999999" } } };
    });
    let rows;
    if (query.docType === "attendance") rows = data.students.map((s) => [excelText(s.className), excelText(s.studentName), ...data.dateList.map((d) => excelText(s.days[d] || ""))]);
    else if (query.docType === "student-register") rows = data.rows.map((r) => [excelText(r.className), excelText(r.studentName), excelDate(r.birthDate), excelText(r.gender), excelText(r.studentPhone), excelText(r.parentPhone), excelDate(r.enrollDate), excelDate(r.endDate)]);
    else if (query.docType === "receipt-ledger") rows = data.rows.map((r) => [excelNumber(r.serialNo), excelDate(r.paymentDate), excelText(r.payerName), excelText(r.registrationNo), excelDate(r.birthDate), excelText(r.subject), excelNumber(r.amount), excelNumber(r.etcExpense), excelText(r.note)]);
    else rows = data.rows.map((r) => [excelDate(r.date), excelText(r.type), excelText(r.title), excelText(r.note), excelNumber(r.amount), null]);
    rows.forEach((values, index) => {
      const rowNumber = index + 6;
      const row = ws.getRow(rowNumber);
      row.values = values;
      row.height = 28;
      row.eachCell({ includeEmpty: true }, (cell, col) => {
        cell.font = { name: "Malgun Gothic", size: 10 };
        cell.alignment = { vertical: "middle", horizontal: def.money.includes(col) ? "right" : "left", wrapText: true };
        if (def.dates.includes(col)) cell.numFmt = "yyyy-mm-dd";
        if (query.docType === "receipt-ledger" && col === 1) cell.numFmt = "0";
        if (def.money.includes(col)) cell.numFmt = '#,##0"원"';
        if (typeof cell.value === "string") cell.numFmt = "@";
        if (query.docType === "attendance" && col > 2) { cell.alignment.horizontal = "center"; cell.border = { bottom: { style: "hair", color: { argb: "FFDDDDDD" } } }; }
      });
      if (query.docType === "cash-journal") {
        // 조회기간 내 잔액은 기존 화면과 동일하게 0에서 시작하며 편집 시 재계산된다.
        row.getCell(6).value = { formula: `${index ? "F" + (rowNumber - 1) : "0"}+IF(B${rowNumber}="지출",-E${rowNumber},E${rowNumber})`, result: excelNumber(data.rows[index].balance) };
        row.getCell(6).numFmt = '#,##0"원"';
      }
    });
    const lastDataRow = 5 + rows.length;
    if (rows.length) ws.autoFilter = `A5:${lastCol}${lastDataRow}`;
    let lastRow = lastDataRow;
    if (query.docType === "receipt-ledger") {
      lastRow += 2;
      ws.getCell(lastRow, 6).value = "합계";
      [7, 8].forEach((col) => {
        const letter = ws.getColumn(col).letter;
        ws.getCell(lastRow, col).value = rows.length ? { formula: `SUM(${letter}6:${letter}${lastDataRow})`, result: rows.reduce((sum, r) => sum + r[col - 1], 0) } : 0;
        ws.getCell(lastRow, col).numFmt = '#,##0"원"';
        ws.getCell(lastRow, col).font = { name: "Malgun Gothic", size: 11, bold: true };
      });
    }
    const notes = {
      attendance: "○ 출석 · × 결석 · △ 보강",
      "student-register": "현재 조회된 수강생 정보를 기준으로 작성한 대장입니다.",
      "receipt-ledger": "위와 같이 교습비등을 받았음을 확인함.    원장 (서명 또는 인)",
      "cash-journal": "잔액은 조회기간 내 입·출금 기준이며, 기간 이전 이월 잔액은 포함하지 않습니다.",
    };
    lastRow += 2;
    ws.mergeCells(lastRow, 1, lastRow, columnCount);
    ws.getCell(lastRow, 1).value = notes[query.docType];
    ws.getCell(lastRow, 1).font = { name: "Malgun Gothic", size: 10, color: { argb: "FF666666" } };
    ws.getCell(lastRow, 1).alignment = { wrapText: true, vertical: "middle" };
    ws.getRow(lastRow).height = 32;
    ws.pageSetup.printArea = `A1:${lastCol}${lastRow}`;
    return { workbook: wb, title: def.title };
  }

  document.getElementById("btn-excel").addEventListener("click", async () => {
    const snapshot = loadedDocument;
    if (!snapshot) return;
    const btn = document.getElementById("btn-excel");
    btn.disabled = true;
    btn.textContent = "엑셀 생성 중…";
    try {
      const { workbook, title } = await buildExcelWorkbook(snapshot);
      const buffer = await workbook.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      const target = String(snapshot.targetLabel || "전체")
        .replace(/[<>:"/\\|?*\x00-\x1f]/g, "_").trim().replace(/[. ]+$/g, "").slice(0, 80) || "전체";
      a.download = `${target}_${title}_${snapshot.query.periodStart || "전체"}_${snapshot.query.periodEnd || "전체"}.xlsx`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch (err) {
      document.getElementById("doc-status").textContent = "엑셀 다운로드 실패: " + err.message;
    } finally {
      btn.textContent = "⬇️ Excel 다운로드";
      btn.disabled = !loadedDocument;
    }
  });

  if (getAdminKey()) { showAppScreen(); } else { showLoginScreen(); }
</script>
