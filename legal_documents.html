<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>법정 서류 출력</title>
<style>
  :root {
    --text-primary: #2C2C2B;
    --text-secondary: #7D7A75;
    --canvas: #FFFFFF;
    --surface: #F9F8F7;
    --surface-2: #F0EFED;
    --border: #E6E5E3;
    --blue: #2783DE;
    --blue-soft: #E5F2FC;
    --red: #E56458;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--surface);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text-primary);
    font-size: 14px;
  }
  #login-screen {
    display: none; min-height: 100vh; align-items: center; justify-content: center; flex-direction: column;
  }
  #login-screen .box {
    background: var(--canvas); border: 1px solid var(--border); border-radius: 12px; padding: 32px;
    width: min(90vw, 320px); display: flex; flex-direction: column; gap: 10px;
  }
  #login-screen h1 { font-size: 16px; margin: 0 0 8px; text-align: center; }
  #login-input, #login-btn { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 14px; }
  #login-btn { background: var(--blue); color: #fff; border: none; cursor: pointer; }
  .login-error { color: var(--red); font-size: 12px; min-height: 14px; text-align: center; }

  #app-screen { display: none; flex-direction: column; min-height: 100vh; }
  header.app-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; background: var(--canvas); border-bottom: 1px solid var(--border);
  }
  header.app-header h1 { font-size: 16px; margin: 0; }
  header.app-header button { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 13px; }

  main { padding: 20px; display: flex; flex-direction: column; gap: 16px; max-width: none; width: 100%; min-width: 0; margin: 0 auto; }

  .panel { min-width: 0; background: var(--canvas); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }

  .doc-type-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .doc-type-tabs button {
    padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2);
    cursor: pointer; font-size: 13px; color: var(--text-primary);
  }
  .doc-type-tabs button.active { background: var(--blue); color: #fff; border-color: var(--blue); }

  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-top: 14px; }
  .filters .field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-secondary); }
  .filters input, .filters select {
    padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); font-size: 13px; min-width: 140px;
  }
  .filters .fixed-select-field { flex:0 0 180px; width:180px; min-width:180px; }
  .filters .fixed-select-field select { width:100%; min-width:0; max-width:100%; height:36px; }
  .filters button {
    padding: 9px 18px; border-radius: 6px; border: none; background: var(--blue); color: #fff; cursor: pointer; font-size: 13px;
  }

  .toolbar { display: flex; gap: 8px; justify-content: flex-end; }
  .toolbar button {
    padding: 8px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-2); cursor: pointer; font-size: 13px;
  }

  #doc-status { font-size: 13px; color: var(--text-secondary); }

  #print-area { background: #fff; padding: 24px; }
  #print-area h2 { text-align: center; font-size: 18px; margin: 0 0 4px; }
  #print-area .doc-sub { text-align: center; font-size: 12px; color: var(--text-secondary); margin-bottom: 16px; }
  table.doc-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.doc-table th, table.doc-table td { border: 1px solid #999; padding: 4px 6px; text-align: center; }
  table.doc-table th { background: #f2f2f2; }
  table.doc-table td.name-cell, table.doc-table th.name-cell { text-align: left; white-space: nowrap; }
  .legend { margin-top: 10px; font-size: 12px; color: var(--text-secondary); }
  .sign-line { margin-top: 40px; text-align: right; font-size: 13px; }

  .warnings { border:1px solid #e5bd74; background:#fff7e7; padding:10px 12px; margin-bottom:16px; font-size:12px; line-height:1.6; }
  .class-register { break-inside:avoid; margin-bottom:24px; }
  .class-register h3 { font-size:14px; margin:12px 0; }
  table.register-table { table-layout:fixed; }
  table.register-table th, table.register-table td { text-align:center; vertical-align:middle; }
  table.register-table td:nth-child(3) { text-align:left; white-space:normal; word-break:normal; overflow-wrap:anywhere; line-height:1.5; }
  table.register-table td:nth-child(4), table.register-table td:nth-child(5), table.register-table td:nth-child(6) { white-space:nowrap; }
  .receipt-page { break-after:page; margin-top:24px; }
  .receipt-pair { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
  .receipt-copy { border:1px solid #777; padding:20px; }
  .receipt-copy h3 { text-align:center; }
  .receipt-copy p { font-size:12px; line-height:1.8; }
  .receipt-copy .doc-table { margin:20px 0; }
  .attendance-details { margin-top:16px; border:1px solid var(--border); border-radius:8px; padding:12px; background:var(--surface); }
  .attendance-details > summary { cursor:pointer; font-size:14px; font-weight:600; }
  .attendance-details > summary:focus-visible { outline:2px solid var(--blue); outline-offset:4px; }
  .attendance-details-body { margin-top:12px; }
  .table-scroll-hint { margin:6px 0; font-size:12px; color:var(--text-secondary); }
  @media screen {
    #print-panel, #print-area { min-width:0; max-width:100%; }
    .table-scroll { width:100%; max-width:100%; overflow-x:auto; overscroll-behavior-x:contain; -webkit-overflow-scrolling:touch; }
    .table-scroll:focus-visible { outline:2px solid var(--blue); outline-offset:3px; }
    .table-scroll .doc-table { font-size:13px; }
    .table-scroll .doc-table th, .table-scroll .doc-table td { padding:8px 10px; }
    .table-scroll .doc-table th { white-space:nowrap; }
    .table-scroll .doc-table:not(.attendance-table) { min-width:calc(var(--columns, 6) * 120px); }
    .table-scroll .doc-table:not(.attendance-table) td { min-width:96px; max-width:360px; overflow-wrap:anywhere; }
    .table-scroll .register-table { min-width:900px !important; }
    .table-scroll table.doc-table.register-table td { min-width:0; max-width:none; }
    .attendance-table { --subject-width:96px; --course-width:220px; --name-width:104px; table-layout:fixed; border-collapse:separate !important; border-spacing:0;
      min-width:calc(var(--subject-width) + var(--course-width) + var(--name-width) + var(--day-count) * 48px); }
    .attendance-table col:nth-child(1) { width:var(--subject-width); }
    .attendance-table col:nth-child(2) { width:var(--course-width); }
    .attendance-table col:nth-child(3) { width:var(--name-width); }
    .table-scroll .attendance-table th, .table-scroll .attendance-table td { border-width:0 1px 1px 0; padding:8px 6px; }
    .attendance-table tr > :first-child { border-left-width:1px !important; }
    .attendance-table thead tr:first-child > th { border-top-width:1px; }
    .table-scroll .attendance-table tr > :nth-child(-n+3) { position:sticky; z-index:2; background:#fff; white-space:normal; word-break:keep-all; overflow-wrap:anywhere; }
    .table-scroll .attendance-table thead tr > :nth-child(-n+3) { z-index:3; background:#f2f2f2; }
    .attendance-table tr > :nth-child(1) { left:0; }
    .attendance-table tr > :nth-child(2) { left:var(--subject-width); }
    .attendance-table tr > :nth-child(3) { left:calc(var(--subject-width) + var(--course-width)); box-shadow:3px 0 4px -3px #666; }
    .attendance-table tr > :nth-child(n+4) { white-space:nowrap; }
  }
  @media screen and (max-width:650px) {
    main { padding:12px; }
    .panel { padding:12px; }
    #print-area { padding:12px; }
    .receipt-pair { grid-template-columns:1fr; }
    .attendance-table { --subject-width:64px; --course-width:128px; --name-width:72px; }
    .table-scroll .doc-table { font-size:12px; }
    .toolbar { flex-wrap:wrap; }
  }
  @media print {
    .attendance-details { display:none !important; }
    .table-scroll { overflow:visible !important; width:auto; max-width:none; }
    .table-scroll-hint { display:none !important; }
    .receipt-pair {grid-template-columns:1fr 1fr;}
    .receipt-page:last-child {break-after:auto;}
    thead {display:table-header-group;}
    tr {break-inside:avoid;}

    header.app-header, .panel:not(#print-panel), .toolbar { display: none !important; }
    body { background: #fff; }
    main { padding: 0; max-width: none; }
    #print-panel { border: none; padding: 0; }
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="box">
    <h1>🔒 법정 서류 출력 (관리자용)</h1>
    <input type="password" id="login-input" placeholder="관리자 비밀번호" autocomplete="current-password">
    <button id="login-btn" onclick="submitLogin()">로그인</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div id="app-screen">
  <header class="app-header">
    <h1>📑 법정 서류 출력</h1>
    <button id="logout-btn">로그아웃</button>
  </header>
  <main>
    <div class="panel">
      <div class="doc-type-tabs" id="doc-type-tabs">
        <button data-type="attendance" class="active">수강생 출석부</button>
        <button data-type="student-register">수강생 대장</button>
        <button data-type="receipt-ledger">교습비등 영수증 원부</button>
        <button data-type="cash-journal">현금출납부</button>
      </div>
      <div class="filters">
        <div class="field"><label>시작일</label><input type="date" id="f-start"></div>
        <div class="field"><label>종료일</label><input type="date" id="f-end"></div>
        <div class="field fixed-select-field"><label>클래스</label><select id="f-class"><option value="">전체 클래스</option></select></div>
        <div class="field fixed-select-field"><label>학생</label><select id="f-student" disabled><option value="">클래스를 먼저 선택하세요</option></select></div>
        <div class="field"><label>검색(이름)</label><input type="text" id="f-search" placeholder="학생 이름"></div>
        <button id="btn-query">조회</button>
      </div>
      <div style="margin-top:6px;font-size:12px;color:var(--text-secondary)"><span id="meta-status" role="status" aria-live="polite"></span> <button id="btn-meta-retry" type="button" hidden>재시도</button></div>
      <div id="doc-status" style="margin-top:8px"></div>
    </div>

    <div class="toolbar">
      <label id="receipt-layout-field" hidden>영수증 출력 방식 <select id="receipt-layout"><option value="list">관리용 목록</option><option value="form">원부·영수증 서식</option></select></label>
      <button id="btn-print">🖨️ 인쇄(PDF)</button>
      <button id="btn-excel" disabled>⬇️ Excel 다운로드</button>
    </div>

    <div class="panel" id="print-panel">
      <div id="print-area">
        <p style="text-align:center;color:#999">위에서 서류 종류와 기간을 선택한 뒤 [조회]를 눌러주세요.</p>
      </div>
    </div>
  </main>
</div>

<script>
  const SUPABASE_URL = "https://twczhsxybkcvjkdfdxvs.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3Y3poc3h5YmtjdmprZGZkeHZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyOTcwMDQsImV4cCI6MjEwMzg3MzAwNH0.t7Ltb_iSYqE4gHSoGSm-OlpiLjGqIcgrhzGJ-t56EDc";
  const ADMIN_KEY_STORAGE = "admin_key";
  function getAdminKey() { return localStorage.getItem(ADMIN_KEY_STORAGE) || ""; }

  function showLoginScreen(errorMsg) {
    metaRequestId++;
    docRequestId++;
    loadedDocument = null;
    document.getElementById("btn-excel").disabled = true;
    document.getElementById("login-screen").style.display = "flex";
    document.getElementById("app-screen").style.display = "none";
    document.getElementById("login-error").textContent = errorMsg || "";
    document.getElementById("login-input").value = "";
    setTimeout(() => document.getElementById("login-input").focus(), 50);
  }
  async function showAppScreen(initialClasses) {
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("app-screen").style.display = "flex";
    setDefaultDates();
    await loadClasses(initialClasses);
  }
  document.getElementById("logout-btn").addEventListener("click", () => {
    if (!confirm("로그아웃 하시겠습니까?")) return;
    localStorage.removeItem(ADMIN_KEY_STORAGE);
    showLoginScreen();
  });

  async function callFn(body) {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/get-legal-document-data`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-admin-key": getAdminKey(),
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        "apikey": SUPABASE_ANON_KEY,
      },
      body: JSON.stringify(body),
    });
    if (res.status === 401) { showLoginScreen("비밀번호가 올바르지 않습니다."); throw new Error("인증 실패"); }
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(json.error || `서버 오류: ${res.status}`);
    return json;
  }

  async function submitLogin() {
    const input = document.getElementById("login-input");
    const key = input.value.trim();
    const btn = document.getElementById("login-btn");
    const errEl = document.getElementById("login-error");
    if (!key) { errEl.textContent = "비밀번호를 입력하세요."; return; }
    btn.disabled = true; btn.textContent = "확인 중..."; errEl.textContent = "";
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/get-legal-document-data`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-admin-key": key, "Authorization": `Bearer ${SUPABASE_ANON_KEY}`, "apikey": SUPABASE_ANON_KEY },
        body: JSON.stringify({ action: "classes" }),
      });
      if (res.status === 401) { errEl.textContent = "비밀번호가 올바르지 않습니다."; return; }
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `서버 오류: ${res.status}`);
      if (!Array.isArray(data.classes)) throw new Error("클래스 목록을 확인할 수 없습니다.");
      localStorage.setItem(ADMIN_KEY_STORAGE, key);
      await showAppScreen(data.classes);
    } catch (err) {
      errEl.textContent = "로그인에 실패했습니다: " + err.message;
    } finally {
      btn.disabled = false; btn.textContent = "로그인";
    }
  }
  document.getElementById("login-input").addEventListener("keydown", (e) => { if (e.key === "Enter") submitLogin(); });

  let currentDocType = "attendance";
  let loadedDocument = null;
  let docRequestId = 0;
  document.getElementById("doc-type-tabs").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-type]");
    if (!btn) return;
    document.querySelectorAll("#doc-type-tabs button").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    currentDocType = btn.dataset.type;
    document.getElementById("receipt-layout-field").hidden = currentDocType !== "receipt-ledger";
  });

  function setDefaultDates() {
    const now = new Date(Date.now() + 9 * 60 * 60 * 1000);
    const y = now.getUTCFullYear(), m = now.getUTCMonth();
    const first = new Date(Date.UTC(y, m, 1)).toISOString().slice(0, 10);
    const last = new Date(Date.UTC(y, m + 1, 0)).toISOString().slice(0, 10);
    document.getElementById("f-start").value = first;
    document.getElementById("f-end").value = last;
  }

  // 초기에는 클래스만 조회하고, 반 선택 시 그 반의 학생만 조회한다.
  let metaRequestId = 0;
  let retryMeta = null;
  const classSel = document.getElementById("f-class");
  const studentSel = document.getElementById("f-student");
  const queryBtn = document.getElementById("btn-query");
  const retryBtn = document.getElementById("btn-meta-retry");

  function setMetaStatus(message, retry = null) {
    document.getElementById("meta-status").textContent = message;
    retryMeta = retry;
    retryBtn.hidden = !retry;
  }
  function resetStudents(label) {
    studentSel.replaceChildren(new Option(label, ""));
    studentSel.disabled = true;
  }
  function appendOptions(select, rows) {
    rows.forEach((row) => select.add(new Option(row.name, row.id)));
  }
  async function loadClasses(initialClasses) {
    const requestId = ++metaRequestId;
    classSel.disabled = true;
    classSel.replaceChildren(new Option("클래스 불러오는 중…", ""));
    resetStudents("클래스를 먼저 선택하세요");
    queryBtn.disabled = true;
    setMetaStatus("클래스 불러오는 중…");
    try {
      const classes = initialClasses || (await callFn({ action: "classes" })).classes;
      if (requestId !== metaRequestId) return;
      if (!Array.isArray(classes)) throw new Error("클래스 목록을 확인할 수 없습니다.");
      classSel.replaceChildren(new Option("전체 클래스", ""));
      appendOptions(classSel, classes);
      classSel.disabled = false;
      queryBtn.disabled = false;
      setMetaStatus(`클래스 ${classes.length}개 · 반을 선택하면 해당 반 학생을 불러옵니다.`);
    } catch (err) {
      if (requestId !== metaRequestId) return;
      classSel.replaceChildren(new Option("클래스 로딩 실패", ""));
      setMetaStatus("클래스 로딩 실패: " + err.message, () => loadClasses());
    }
  }
  async function loadClassStudents() {
    const requestId = ++metaRequestId;
    const classId = classSel.value;
    resetStudents(classId ? "학생 불러오는 중…" : "클래스를 먼저 선택하세요");
    if (!classId) {
      queryBtn.disabled = false;
      setMetaStatus("전체 클래스 조회가 가능합니다. 반을 선택하면 해당 반 학생을 불러옵니다.");
      return;
    }
    queryBtn.disabled = true;
    setMetaStatus("해당 반 학생 불러오는 중…");
    try {
      const data = await callFn({ action: "students", classId });
      if (requestId !== metaRequestId || classSel.value !== classId) return;
      if (!Array.isArray(data.students)) throw new Error("학생 목록을 확인할 수 없습니다.");
      studentSel.replaceChildren(new Option("전체 학생", ""));
      appendOptions(studentSel, data.students);
      studentSel.disabled = data.students.length === 0;
      queryBtn.disabled = false;
      setMetaStatus(data.students.length ? `해당 반 학생 ${data.students.length}명` : "해당 반에 등록된 학생이 없습니다.");
    } catch (err) {
      if (requestId !== metaRequestId || classSel.value !== classId) return;
      resetStudents("학생 로딩 실패");
      setMetaStatus("학생 로딩 실패: " + err.message, loadClassStudents);
    }
  }
  classSel.addEventListener("change", loadClassStudents);
  retryBtn.addEventListener("click", () => { if (retryMeta) retryMeta(); });

  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function won(n) { return (n || 0).toLocaleString("ko-KR") + "원"; }

  function warningsHtml(data) {
    return data.warnings?.length ? `<div class="warnings"><b>출력 전 확인 — 미완성 자료를 확정 서류로 사용하지 마세요.</b><ul>${data.warnings.map(v=>`<li>${esc(v)}</li>`).join("")}</ul></div>` : "";
  }
  function field(value) { return value === null || value === undefined || value === "" ? "미입력" : esc(value); }
  function money(value) { return value === null || value === undefined ? "미확인" : won(value); }
  function billingText(r) { return r.billingStart ? `${r.billingStart} ~ ${r.billingEnd || r.billingStart}` : "미입력"; }
  function renderAttendance(data) {
    let html = `<h2>수강생 출석부</h2><div class="doc-sub">${esc(data.periodStart)} ~ ${esc(data.periodEnd)}</div>` + warningsHtml(data);
    html += `<table class="doc-table attendance-table" style="--day-count:${data.dateList.length}"><colgroup><col><col><col><col span="${data.dateList.length}"></colgroup><thead><tr><th>교습과목</th><th>신고 반명(교습과정)</th><th>성명</th>`;
    data.dateList.forEach(d=>html+=`<th>${esc(d.slice(5))}</th>`);
    html += `</tr></thead><tbody>`;
    data.students.forEach(r=>{html+=`<tr><td>${field(r.subject)}</td><td>${field(r.className)}</td><td class="name-cell">${field(r.studentName)}</td>`;data.dateList.forEach(d=>html+=`<td>${esc(r.days[d] || "")}</td>`);html+=`</tr>`;});

      const ws=tableSheet("관리용 목록",title,["일련번호","납부일자","납부자(성명)","등록번호","생년월일","교습과목","신고 교습과정","교습기간","교습비","기타경비","결제금액","비고"],[12,14,16,12,14,14,24,30,16,16,16,26],data.rows.map(r=>[optionalNumber(r.serialNo),excelDate(r.paymentDate),excelText(r.payerName),optionalNumber(r.registrationNo),excelDate(r.birthDate),excelText(r.subject),excelText(r.className),excelText(billingText(r)),optionalNumber(r.amount),optionalNumber(r.etcExpense),optionalNumber(r.paidAmount),excelText(r.note)]),{dates:[2,5],money:[9,10,11],note:"목록은 관리용. 원부·영수증 시트는 별지 제24호서식 항목 기반 초안. 미확인 금액은 빈칸이며 0원과 다릅니다. 환불·취소 대조 및 발행자 서명 확인 필요."});

      ws.getCell(sumRow,10).value="결제 합계";ws.getCell(sumRow,11).value=data.rows.length?{formula:`SUM(K6:K${data.rows.length+5})`,result:data.rows.reduce((sum,r)=>sum+(r.paidAmount ?? 0),0)}:0;ws.getCell(sumRow,11).numFmt='#,##0"원"';
      const forms=wb.addWorksheet(uniqueName("원부·영수증"),{views:[{showGridLines:false}],pageSetup:{paperSize:9,orientation:"portrait",fitToPage:true,fitToWidth:1,fitToHeight:0,margins:{left:0.3,right:0.3,top:0.4,bottom:0.4,header:0.2,footer:0.2}}});
      forms.columns=Array.from({length:9},(_,i)=>({width:i===4?3:11}));
      function formCell(row,col,endCol,value,bold=false){forms.mergeCells(row,col,row,endCol);const c=forms.getCell(row,col);c.value=value;c.font={name:"Malgun Gothic",size:10,bold};c.alignment={wrapText:true,vertical:"middle"};c.border={bottom:{style:"hair",color:{argb:"FFBBBBBB"}}};return c;}
      data.rows.forEach((r,index)=>{
        const base=index*26+1;
        for(let j=0;j<26;j++)forms.getRow(base+j).height=25;
        [1,6].forEach((col,half)=>{
          formCell(base,col,col+3,half?"교습비등 영수증":"교습비등 영수증 원부",true).alignment.horizontal="center";
          formCell(base+2,col,col+3,`일련번호: ${r.serialNo}   연월(분기): ${r.billingMonth || "미입력"}`);
          formCell(base+3,col,col+3,`교습기간: ${billingText(r)}`);
          formCell(base+4,col,col+3,`신고 교습과정: ${r.className || "미입력"}`);
          const entries=[["등록(신고)번호",optionalNumber(r.registrationNo)],["성명",excelText(r.payerName)],["생년월일",excelDate(r.birthDate)],["교습과목",excelText(r.subject)],["교습비",optionalNumber(r.amount)],["기타경비",optionalNumber(r.etcExpense)]];
          entries.forEach(([key,value],j)=>{formCell(base+6+j*2,col,col+1,key,true);const c=formCell(base+6+j*2,col+2,col+3,value);if(typeof value==="number")c.numFmt="0";if(j===2)c.numFmt="yyyy-mm-dd";if(j>=4)c.numFmt='#,##0"원"';if(typeof value==="string")c.numFmt="@";});
          formCell(base+18,col,col+3,"위와 같이 영수하였음을 증명합니다.");
          formCell(base+19,col,col+3,excelDate(r.paymentDate)).numFmt='yyyy"년" m"월" d"일"';
          formCell(base+21,col,col+3,"학원설립·운영자, 교습자 또는 개인과외교습자");
          formCell(base+22,col,col+3,"__________________ (서명 또는 인)");
          formCell(base+24,col,col+3,"대조·보완용 초안 — 누락/환불·취소/서명 확인",true);
          forms.getRow(base+24).height=36;
        });
        if(index<data.rows.length-1)forms.getRow(base+25).addPageBreak();
      });
      if(!data.rows.length)forms.getCell("A1").value="조회 결과 없음";
      forms.pageSetup.printArea=`A1:I${Math.max(1,data.rows.length*26)}`;
    }else{
      const ws=tableSheet(title,title,["날짜","구분","내용","비고","금액","잔액"],[14,10,30,30,18,18],data.rows.map(r=>[excelDate(r.date),excelText(r.type),excelText(r.title),excelText(r.note),excelNumber(r.amount),null]),{dates:[1],money:[5,6],note:"잔액은 조회기간 내 입·출금 기준이며 기간 이전 이월 잔액은 포함하지 않습니다."});
      data.rows.forEach((r,i)=>{const n=i+6;ws.getCell(n,6).value={formula:`${i?"F"+(n-1):"0"}+IF(B${n}="지출",-E${n},E${n})`,result:excelNumber(r.balance)};ws.getCell(n,6).numFmt='#,##0"원"';});
    }
    return {workbook:wb,title};
  }

  document.getElementById("btn-excel").addEventListener("click", async () => {
    const snapshot = loadedDocument;
    if (!snapshot) return;
    const btn = document.getElementById("btn-excel");
    btn.disabled = true;
    btn.textContent = "엑셀 생성 중…";
    try {
      const { workbook, title } = await buildExcelWorkbook(snapshot);
      const buffer = await workbook.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      const target = String(snapshot.targetLabel || "전체")
        .replace(/[<>:"/\\|?*\x00-\x1f]/g, "_").trim().replace(/[. ]+$/g, "").slice(0, 80) || "전체";
      a.download = `${target}_${title}_${snapshot.query.periodStart || "전체"}_${snapshot.query.periodEnd || "전체"}.xlsx`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch (err) {
      document.getElementById("doc-status").textContent = "엑셀 다운로드 실패: " + err.message;
    } finally {
      btn.textContent = "⬇️ Excel 다운로드";
      btn.disabled = !loadedDocument;
    }
  });

  if (getAdminKey()) { showAppScreen(); } else { showLoginScreen(); }
</script>
</body>
</html>
