<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>학교 검색 · 하다 학원관리</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--surface:#f9f8f7;--text:#2c2c2b;--muted:#625f5a;--line:#e6e5e3;--blue:#1768b8;--soft:#e5f2fc;--error:#ac332b}*{box-sizing:border-box}body{word-break:keep-all;margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,sans-serif}main{max-width:760px;margin:48px auto;padding:0 24px}header{margin-bottom:32px}.brand{font-size:14px;font-weight:700;color:var(--blue);letter-spacing:.06em}h1{font-size:32px;letter-spacing:-.04em;margin:8px 0}h2{font-size:21px;margin:0 0 16px}p{margin:8px 0;color:var(--muted)}section{border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:24px;background:var(--surface)}label{display:block;font-weight:600;margin-bottom:8px}input,select,button{font:inherit;border-radius:8px;min-height:44px}input,select{padding:10px 12px;border:1px solid var(--line);background:var(--bg);color:var(--text);width:100%}button{padding:10px 18px;border:1px solid var(--blue);background:var(--blue);color:white;cursor:pointer;font-weight:600}button:disabled{opacity:.5;cursor:wait}.secondary{background:transparent;color:var(--blue)}.row{display:flex;gap:12px;align-items:end}.row>div{flex:1}.row button{flex-shrink:0}small{display:block;margin-top:8px;font-size:14px;color:var(--muted)}:focus-visible{outline:3px solid var(--blue);outline-offset:3px}.notice{border-radius:8px;background:var(--soft);padding:16px;margin:16px 0;color:var(--text)}#status{white-space:pre-wrap;overflow-wrap:anywhere}#status.error{color:var(--error)}.result{padding:20px 0;border-top:1px solid var(--line)}.result strong{font-size:19px}.result button{margin-top:12px}.result a{display:inline-block;margin:8px 0;color:var(--blue)}[hidden]{display:none!important}@media(max-width:540px){main{margin:24px auto;padding:0 16px}section{padding:20px}.row{flex-direction:column;align-items:stretch}.row>div{width:100%}h1{font-size:28px}}@media(prefers-color-scheme:dark){:root{--bg:#191919;--surface:#202020;--text:#fff;--muted:#c4c1bc;--line:#555;--blue:#5e9fe8;--soft:#203347;--error:#ff9d93}button{color:#111}.secondary{color:var(--blue)}}
</style></head><body><main>
<header><div class="brand">HaDa · 학원관리</div><h1>학교 검색·연결</h1><p>주소를 확인하고 정확한 학교를 선택하세요.<br>기존 학생 연결과 학교 페이지 이름은 그대로 유지합니다.</p></header>
<section id="login"><h2>관리자 확인</h2><form id="loginForm"><label for="key">관리자 키</label><div class="row"><div><input id="key" type="password" autocomplete="current-password" required></div><button>확인</button></div><small>기존 학원 웹앱의 관리자 키를 사용합니다. 이 화면은 키를 저장하지 않습니다.</small></form></section>
<section id="workspace" hidden><div class="row"><div><label for="target">연결할 Notion 학교 페이지</label><select id="target"></select></div><button id="logout" class="secondary">로그아웃</button></div><div class="notice">검색 결과 선택 후 교육청·학교 코드, 주소, 홈페이지를 저장합니다. 학사일정 동기화는 별도로 켭니다.</div><form id="searchForm"><div class="row"><div><label for="query">학교명</label><input id="query" placeholder="예: 천왕중학교" required minlength="2" maxlength="80"></div><div><label for="region">지역 · 선택 사항</label><input id="region" placeholder="예: 구로구" maxlength="80"></div><button>검색</button></div></form><div id="results"></div></section>
<p id="status" role="status" aria-live="polite">Notion 학교 페이지의 ‘학교 검색’ 링크에서 열면 해당 페이지가 자동 선택됩니다.</p>
</main><script>
'use strict';
const ENDPOINT='https://twczhsxybkcvjkdfdxvs.supabase.co/functions/v1/school-api';
const $=id=>document.getElementById(id);let adminKey='',pages=[];
function status(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error)}
async function api(body){const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':adminKey},body:JSON.stringify(body)});let data;try{data=await r.json()}catch{throw new Error('서버 응답을 읽지 못했습니다. 배포 상태를 확인하세요.')}if(!r.ok)throw new Error(data.error||'인증 또는 연결 실패');return data}
function busy(form,on){form.querySelectorAll('button').forEach(b=>b.disabled=on)}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();busy(e.target,true);status('관리자 확인 중…');adminKey=$('key').value;try{const data=await api({action:'meta'});pages=data.schools;$('target').replaceChildren();pages.forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.name+(p.address?' · '+p.address:'');$('target').append(o)});if(!pages.length)throw new Error('먼저 Notion 학교 DB에 학교 페이지를 추가하세요.');const requested=new URLSearchParams(location.search).get('pageId');if(requested){const p=pages.find(p=>p.id.replaceAll('-','')===requested.replaceAll('-',''));if(!p)throw new Error('요청한 페이지가 학교 DB에 없습니다.');$('target').value=p.id}chooseTarget();$('login').hidden=true;$('workspace').hidden=false;$('key').value='';status('학교명과 주소를 확인해 연결하세요.')}catch(e){adminKey='';status(e.message,true)}finally{busy(e.target,false)}});
function chooseTarget(){const p=pages.find(p=>p.id===$('target').value);$('query').value=p?.name||'';$('results').replaceChildren()}
$('target').addEventListener('change',chooseTarget);
$('logout').onclick=()=>{adminKey='';pages=[];$('workspace').hidden=true;$('login').hidden=false;$('results').replaceChildren();status('로그아웃했습니다.')};
$('searchForm').addEventListener('submit',async e=>{e.preventDefault();busy(e.target,true);$('results').replaceChildren();status('나이스에서 검색 중…');const targetId=$('target').value;try{const data=await api({action:'search',query:$('query').value,region:$('region').value});status(data.schools.length?data.schools.length+'개 학교를 찾았습니다. 지역과 주소를 확인하세요.':'검색 결과가 없습니다. 학교명 또는 지역을 다시 확인하세요.');for(const s of data.schools){const box=document.createElement('article');box.className='result';const title=document.createElement('strong');title.textContent=s.name+' · '+s.kind;const addr=document.createElement('p');addr.textContent=s.address;box.append(title,addr);if(s.website){const a=document.createElement('a');a.href=s.website;a.target='_blank';a.rel='noopener noreferrer';a.textContent='학교 홈페이지 확인';box.append(a,document.createElement('br'))}const b=document.createElement('button');b.textContent='이 학교로 연결';b.onclick=async()=>{const p=pages.find(p=>p.id===targetId);if(!confirm(`Notion ‘${p?.name}’ 페이지를 아래 학교와 연결할까요?\n${s.name}\n${s.address}\n기존 이름과 학생 관계는 유지됩니다.`))return;const buttons=[...$('results').querySelectorAll('button')];buttons.forEach(x=>x.disabled=true);status('학교 정보 저장 중…');try{const result=await api({action:'link',pageId:targetId,office:s.office,code:s.code});status(result.name+' · '+result.message);const a=document.createElement('a');a.href='https://app.notion.com/p/'+targetId.replaceAll('-','');a.textContent='Notion 학교 페이지 열기';$('results').replaceChildren(a)}catch(e){status(e.message,true);buttons.forEach(x=>x.disabled=false)}};box.append(b);$('results').append(box)}}catch(e){status(e.message,true)}finally{busy(e.target,false)}});
</script></body></html>
