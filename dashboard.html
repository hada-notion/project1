<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%93%8A%3C/text%3E%3C/svg%3E" />
<title>하다 학원관리 대시보드</title>
<style>
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --border: #e5e5e3;
    --text: #37352f;
    --muted: #9b9a97;
    --accent: #2383e2;
    --green: #2e7d32;
    --blue: #1565c0;
    --red: #c62828;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  /* 상단 메뉴 */
  .topbar {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 52px;
    padding: 0 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .topbar .brand {
    font-weight: 700;
    margin-right: 20px;
    color: var(--text);
  }
  .topbar a, .topbar .nav-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 8px;
    text-decoration: none;
    color: var(--muted);
    font-size: 14px;
    font-weight: 500;
    border: none;
    background: none;
    font-family: inherit;
    cursor: pointer;
  }
  .topbar a.active, .topbar .nav-btn.active {
    background: #edf3fc;
    color: var(--accent);
  }
  .topbar a:hover:not(.active), .topbar .nav-btn:hover:not(.active) { background: #f0f0ee; }
  .topbar-actions {
    margin-left: auto;
    display: flex;
    gap: 8px;
  }
  .topbar-actions button {
    background: #333; color: #fff; border: none; padding: 8px 14px;
    border-radius: 8px; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .topbar-actions button.logout { background: #eee; color: #555; }

  /* 전체 레이아웃 */
  .layout {
    display: flex;
    min-height: calc(100vh - 52px);
  }
  /* 사이드 메뉴 */
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 16px 10px;
  }
  .sidebar .item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    border-radius: 8px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    margin-bottom: 2px;
  }
  .sidebar .item.active {
    background: #edf3fc;
    color: var(--accent);
  }
  .sidebar .item.disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .sidebar .item:hover:not(.active):not(.disabled) { background: #f0f0ee; }
  .sidebar .soon {
    margin-left: auto;
    font-size: 10px;
    color: var(--muted);
    background: #f0f0ee;
    padding: 2px 6px;
    border-radius: 999px;
  }

  /* 메인 콘텐츠 */
  .main {
    flex: 1;
    padding: 28px 32px;
    max-width: 1100px;
  }
  .page-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .page-header h1 {
    font-size: 22px;
    margin: 0;
  }
  .page-header .date {
    color: var(--muted);
    font-size: 14px;
  }
  .refresh-btn {
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
    color: var(--text);
  }
  .refresh-btn:hover { background: #f0f0ee; }


  .cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    min-height: 320px;
  }
  .card h2 {
    font-size: 15px;
    margin: 0 0 4px 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card .count {
    font-size: 28px;
    font-weight: 700;
    margin: 6px 0 14px 0;
  }
  .card .count small {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
  }
  .list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 220px;
    overflow-y: auto;
  }
  .list li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    background: #fbfbfa;
    font-size: 13px;
  }
  .list li a {
    color: var(--text);
    text-decoration: none;
    flex: 1;
  }
  a { color: inherit; }
  .list li a:hover { text-decoration: underline; }
  .badge {
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge.green { background: #e6f4ea; color: var(--green); }
  .badge.blue { background: #e8f0fe; color: var(--blue); }
  .badge.red { background: #fdecec; color: var(--red); }
  .badge.gray { background: #f0f0ee; color: var(--muted); }
  .badge.tone-red { background:#fdeaea; color:#e04b4b; }
  .badge.tone-orange { background:#fff1e0; color:#d9822b; }
  .badge.tone-yellow { background:#fff9db; color:#b9971d; }
  .badge.tone-green { background:#e6f7ee; color:#1e9e5c; }
  .badge.tone-blue { background:#eaf1fd; color:#2f6fd9; }
  .badge.tone-perfect { background:#eaf1fd; color:#2f6fd9; }
  .badge.tone-gray { background:#f0f0ee; color:var(--muted); }
  .empty {
    color: var(--muted);
    font-size: 13px;
    padding: 20px 0;
    text-align: center;
  }
  .loading {
    background: #eef4fd;
    color: var(--accent);
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 8px;
    text-align: center;
    margin: 8px 0;
  }
  .summary-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .login-card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 32px 28px;
    width: 100%;
    max-width: 340px;
    text-align: center;
  }
  .login-card h1 { font-size: 18px; margin: 0 0 4px; }
  .login-card p { font-size: 12px; color: #888; margin: 0 0 20px; }
  .login-card input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 10px;
  }
  .login-card button {
    width: 100%;
    padding: 10px 12px;
    background: #6c5ce7;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .login-card button:disabled { background: #ccc; cursor: default; }
  .login-error { color: #e04b4b; font-size: 12px; margin-top: 10px; min-height: 14px; }

.attendance-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.attendance-item .left { display: flex; align-items: center; gap: 8px; }
.send-btn {
  padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border);
  background: #fff; cursor: pointer; font-size: 12px;
}
.send-btn:disabled { color: var(--muted); cursor: default; opacity: 0.5; }
.bulk-send-btn {
  margin-bottom: 8px; padding: 6px 12px; border-radius: 8px; border: none;
  background: var(--accent); color: #fff; font-size: 13px; cursor: pointer;
}
.bulk-send-btn:disabled { background: var(--muted); cursor: default; }
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
  align-items: center; justify-content: center; z-index: 100;
}
.modal-overlay.show { display: flex; }
.modal-box { background: #fff; border-radius: 12px; padding: 20px; width: 320px; max-width: 90vw; }
.modal-box h3 { margin: 0 0 8px; }
.modal-box p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
.modal-actions button { padding: 8px 14px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; }
.modal-actions .cancel { background: var(--bg); color: var(--text); }
.modal-actions .confirm { background: var(--accent); color: #fff; }
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: #37352f; color: #fff; padding: 10px 18px; border-radius: 8px;
  font-size: 13px; opacity: 0; transition: opacity 0.2s, transform 0.2s; z-index: 200; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.domain-tab-row { display:flex; gap:6px; padding:10px 16px; border-bottom:1px solid var(--border); background:var(--panel); }
.domain-tab { border:1px solid var(--border); background:#fff; padding:6px 14px; border-radius:8px; font-size:13px; cursor:pointer; color:var(--muted); font-family:inherit; }
.domain-tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.md-3col { flex:1; display:flex; min-height:0; }
.calendar-toggle-btn { border:1px solid var(--border); background:#fff; width:28px; height:28px; border-radius:6px; cursor:pointer; font-size:13px; flex-shrink:0; }
.calendar-panel { width:0; flex-shrink:0; overflow:hidden; background:var(--bg); border-right:1px solid var(--border); transition: width 0.18s ease; }
.calendar-panel.open { width: 20%; min-width: 240px; }
.calendar-panel-inner { width:100%; height:100%; padding:6%; display:flex; flex-direction:column; gap:10px; }
.calendar-panel-inner.mini-cal { background:#fff; border-radius:14px; box-shadow:0 1px 4px rgba(0,0,0,0.06); width:100%; }
.cal-panel-month-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:2px; }
.cal-panel-nav-btn { background:#f0eefc; border:none; width:30px; height:30px; border-radius:50%; color:#6c5ce7; font-size:15px; font-weight:700; cursor:pointer; flex-shrink:0; }
.cal-panel-nav-btn:hover { background:#ece9ff; }
.cal-panel-month-title { font-size:15px; font-weight:700; color:#333; }
.cal-panel-nav-right { display:flex; align-items:center; gap:6px; }
.cal-panel-today-btn { background:#f0eefc; border:none; color:#6c5ce7; font-size:11px; font-weight:700; padding:5px 10px; border-radius:999px; cursor:pointer; }
.cal-panel-today-btn:hover { background:#ece9ff; }
.cal-panel-hint { font-size:11px; color:#bbb; text-align:center; margin-top:6px; }
.cal-panel-report-toggle { display:flex; gap:6px; margin-top:8px; }
.report-type-btn { flex:1; border:1px solid var(--border); background:#fff; padding:7px 6px; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; color:var(--muted); font-family:inherit; }
.report-type-btn.active { background:#6c5ce7; color:#fff; border-color:#6c5ce7; }
#report-tuition-detail .right-tab-body p { margin:0 0 8px; font-size:13px; color:var(--text); line-height:1.5; }
#report-tuition-detail .right-tab-body strong { font-size:12px; color:var(--muted); }
.cat-dot-row { display:flex; gap:2px; flex-wrap:wrap; justify-content:center; margin-top:2px; }
.cat-dot { width:6px; height:6px; border-radius:50%; display:inline-block; }
.cat-dot.green { background:var(--green); }
.cat-dot.blue { background:var(--blue); }
.cat-dot.red { background:var(--red); }
.cat-dot.gray { background:var(--muted); }
.schedule-item { border:none; border-bottom:1px solid var(--border); border-radius:0; background:transparent; padding:10px 12px; cursor:pointer; display:flex; flex-direction:column; gap:4px; }
.schedule-item:hover { background:#f2f6fc; }
.schedule-item.selected { background:#eef4fd; }
.schedule-item-title-row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.schedule-item-title { font-size:13.5px; font-weight:600; }
.schedule-item-badges { display:flex; gap:6px; flex-wrap:wrap; }
.sched-tag-more { color:var(--muted); }
.class-badge { font-size:11px; padding:2px 7px; border-radius:999px; white-space:nowrap; background:#fff; border:1px solid; }
.class-badge.tb-gray { border-color:#d9d9d6; color:#5a5a57; }
.class-badge.tb-brown { border-color:#d8bfae; color:#8c5b3f; }
.class-badge.tb-orange { border-color:#f0c896; color:#a86227; }
.class-badge.tb-yellow { border-color:#eddd9e; color:#9b7d1f; }
.class-badge.tb-green { border-color:#b7d6cd; color:#3a7566; }
.class-badge.tb-blue { border-color:#b7d2e0; color:#3072a3; }
.class-badge.tb-purple { border-color:#cfc0e0; color:#6b4d99; }
.class-badge.tb-pink { border-color:#e8bfd8; color:#a3467c; }
.class-badge.tb-red { border-color:#f0bcbc; color:#af4141; }
#right-tab-body .student-select-all { margin-bottom:6px; }
#right-tab-body .student-row { border-bottom:1px solid var(--border); padding:6px 0; }
#right-tab-body .student-row:last-child { border-bottom:none; }
.sched-msg-count { font-size:12px; color:var(--muted); margin-bottom:6px; }
.schedule-list-area { display:flex; flex-direction:column; gap:0; }
.sched-date-group { display:flex; flex-direction:column; }
.sched-date-label { font-size:12px; font-weight:700; color:var(--muted); padding:14px 12px 4px; }
.sched-date-group:first-child .sched-date-label { padding-top:4px; }
.schedule-detail-field { margin: 12px 0; }
.schedule-detail-field b { color: var(--muted); font-weight:600; font-size:11px; display:block; margin-bottom:4px; text-transform:uppercase; letter-spacing:.02em; }
.schedule-detail-field .val { font-size:14px; color:var(--text); }
.md-left { width: 26%; flex-shrink:0; background:var(--panel); border-right:1px solid var(--border); padding:16px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
.filter-tab, .view-tab { border:1px solid var(--border); background:#fff; padding:6px 12px; border-radius:8px; font-size:13px; cursor:pointer; color:var(--muted); font-family:inherit; }
.filter-tab.active, .view-tab.active { background:#edf3fc; color:var(--accent); border-color:#c9e0fb; }
.md-filter-row, .md-view-row { display:flex; gap:6px; }
.md-filter-options { display:flex; flex-wrap:wrap; gap:6px; }
.filter-option { border:1px solid var(--border); background:#fbfbfa; padding:4px 10px; border-radius:999px; font-size:12px; cursor:pointer; color:var(--text); font-family:inherit; }
.filter-option.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.md-date-nav { display:flex; align-items:center; justify-content:center; gap:12px; font-size:14px; font-weight:600; }
.md-date-nav-clickable { cursor:pointer; gap:6px; padding:8px 10px; border-radius:8px; background:#fff; border:1px solid var(--border); }
.md-date-nav-clickable:hover { background:#f7f7f5; }
.cal-icon { font-size:14px; }
.date-nav-btn { border:none; background:#f0f0ee; width:28px; height:28px; border-radius:6px; cursor:pointer; font-size:14px; }
.class-list-area { display:flex; flex-direction:column; gap:8px; }
.class-item { border:none; border-bottom:1px solid var(--border); border-radius:0; background:transparent; overflow:hidden; }
.class-item.selected { background:#eef4fd; }
.class-item-head { padding:10px 12px; cursor:pointer; display:flex; flex-direction:column; gap:4px; }
.class-item-head:hover { background:#f2f6fc; }
.class-item-title-row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.class-item-title { font-size:13.5px; font-weight:600; }
.class-item-time { font-size:12px; color:var(--muted); }
.class-item-badges { display:flex; gap:6px; flex-wrap:wrap; }
.class-item-body { display:none; padding:0 12px 12px; border-top:1px dashed var(--border); font-size:12.5px; color:var(--text); }
.class-item-body.show { display:block; }
.class-item-body .row { margin: 8px 0; white-space: pre-wrap; }
.class-item-body .row b { color: var(--muted); font-weight:600; font-size:11px; display:block; margin-bottom:2px; }
.calendar-area { display:flex; flex-direction:column; gap:6px; }
.calendar-grid { display:grid; grid-template-columns: repeat(7, 1fr); gap:4px; }
.calendar-day { border:1px solid var(--border); border-radius:8px; min-height:56px; padding:4px 6px; font-size:11px; cursor:pointer; background:#fff; }
.calendar-day.empty { visibility:hidden; }
.calendar-day.today { border-color: var(--accent); }
.calendar-day .num { font-weight:600; margin-bottom:2px; }
.calendar-day .cnt { color: var(--accent); font-size:11px; }
.calendar-day:hover { background:#f2f6fc; }
.md-right { flex:1; padding:24px 28px; overflow-y:auto; }
.md-right-empty { color:var(--muted); font-size:14px; text-align:center; margin-top:80px; }
.md-right-header { margin-bottom:16px; min-height:78px; }
.md-right-title-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.md-right-title { font-size:18px; font-weight:700; }
.md-right-time { font-size:13px; color:var(--muted); margin-top:4px; }
.md-right-sub { font-size:13px; color:var(--muted); margin-top:2px; }
.md-right-link { font-size:12px; color:var(--accent); text-decoration:none; display:inline-flex; align-items:center; }
.md-right-link svg { display:block; }
.md-right-link:hover { opacity:0.7; }
.report-view-link { font-size:14px; text-decoration:none; margin-left:4px; }
.report-view-link:hover { opacity:0.7; }
.right-tabs { display:flex; gap:6px; }
.right-tab { border:none; background:none; padding:8px 12px; font-size:13px; cursor:pointer; color:var(--muted); font-family:inherit; border-bottom:2px solid transparent; }
.right-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight:600; }
.record-card { border:none; border-bottom:1px solid var(--border); border-radius:0; padding:12px 14px; margin-bottom:0; background:transparent; }
.record-card:last-child { border-bottom:none; }
.retry-btn { margin-top:8px; padding:6px 12px; border:1px solid var(--border); border-radius:6px; background:#fff; color:var(--text); font-size:12.5px; cursor:pointer; font-family:inherit; }
.retry-btn:hover { background:#f0f0ee; }
.record-card a, .activity-row a { color: var(--text); text-decoration:none; }
.record-card a:hover, .activity-row a:hover { text-decoration:underline; }
.record-card .title { font-weight:600; font-size:13.5px; margin-bottom:4px; }
.record-card .meta { font-size:12px; color:var(--muted); white-space: pre-wrap; }
.activity-row { display:flex; align-items:center; justify-content:space-between; padding:8px 10px; border-radius:0; background:transparent; border:none; border-bottom:1px solid var(--border); margin-bottom:0; font-size:13px; }
.student-item { border-bottom:1px solid var(--border); }
.student-row { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-radius:0; background:transparent; border:none; border-bottom:none; margin-bottom:0; font-size:13px; cursor:pointer; }
.student-row .stu-name { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.student-detail { display:none; padding:0 0 10px 24px; font-size:12.5px; color:var(--text); }
.student-detail.show { display:block; }
.student-detail .row { margin:6px 0; }
.student-detail .row b { color:var(--muted); font-weight:600; font-size:11px; display:block; margin-bottom:2px; }
.student-row .stu-view { display:inline-flex; align-items:center; text-decoration:none; margin-left:6px; }
.student-row .stu-view:hover { opacity:0.7; }
.student-row .stu-view svg { display:block; }
.search-row { display:flex; }
.search-box { flex:1; border:1px solid var(--border); border-radius:8px; padding:9px 12px; font-size:13px; font-family:inherit; background:#fff; }
.search-box:focus { outline:none; border-color:var(--accent); }
.student-list-controls { display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
.student-select-all { display:flex; align-items:center; gap:4px; font-size:12px; color:var(--muted); cursor:pointer; white-space:nowrap; }
.student-select-all input { width:14px; height:14px; cursor:pointer; }
.student-sort-btn { border:1px solid var(--border); background:#fff; border-radius:8px; padding:5px 10px; font-size:12px; font-family:inherit; cursor:pointer; color:var(--muted); white-space:nowrap; }
.student-sort-btn.active { color:var(--accent); border-color:var(--accent); }
.student-search-box { flex:1; min-width:100px; border:1px solid var(--border); border-radius:8px; padding:6px 10px; font-size:12px; font-family:inherit; background:#fff; }
.student-search-box:focus { outline:none; border-color:var(--accent); }
.student-status-filter { flex:0 0 auto; border:1px solid var(--border); border-radius:8px; padding:6px 10px; font-size:12px; font-family:inherit; background:#fff; color:var(--text); }
.student-row .stu-meta { font-size:11px; color:var(--muted); }
.stu-checkbox { width:15px; height:15px; cursor:pointer; margin-right:2px; flex-shrink:0; }
.teacher-badge { font-size:11px; padding:2px 7px; border-radius:999px; white-space:nowrap; }
.teacher-badge.tb-gray { background:#f1f1ef; color:#5a5a57; }
.teacher-badge.tb-brown { background:#efe4dd; color:#8c5b3f; }
.teacher-badge.tb-orange { background:#faebdd; color:#a86227; }
.teacher-badge.tb-yellow { background:#fbf3db; color:#9b7d1f; }
.teacher-badge.tb-green { background:#ddedea; color:#3a7566; }
.teacher-badge.tb-blue { background:#ddebf1; color:#3072a3; }
.teacher-badge.tb-purple { background:#eae4f2; color:#6b4d99; }
.teacher-badge.tb-pink { background:#f4dfeb; color:#a3467c; }
.teacher-badge.tb-red { background:#fbe4e4; color:#af4141; }
.rate-badge { font-size:11px; padding:2px 7px; border-radius:999px; white-space:nowrap; font-weight:600; }
.rate-badge.tone-red { background:#fdeaea; color:#e04b4b; }
.rate-badge.tone-orange { background:#fff1e0; color:#d9822b; }
.rate-badge.tone-yellow { background:#fff9db; color:#b9971d; }
.rate-badge.tone-green { background:#e6f7ee; color:#1e9e5c; }
.rate-badge.tone-blue { background:#eaf1fd; color:#2f6fd9; }
#report-tuition-detail { padding:0; }
#report-tuition-detail .detail-meta-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
#report-tuition-detail .info-card { background:#fff; border-radius:14px; padding:14px 16px; margin-bottom:10px; box-shadow:0 1px 4px rgba(0,0,0,0.06); border:1px solid var(--border); }
#report-tuition-detail .info-card:last-of-type { margin-bottom:0; }
#report-tuition-detail .info-card h3 { font-size:13px; margin:0 0 8px; display:flex; align-items:center; gap:6px; color:var(--text); font-weight:700; }
#report-tuition-detail .info-card .info-content { font-size:12.5px; color:#6b6b68; line-height:1.6; white-space:pre-wrap; }
#report-tuition-detail .info-card .info-content.empty { color:#bbb; }
.mini-cal .mc-grid { display:grid; grid-template-columns: repeat(7, 1fr); gap:4px; margin-bottom:2px; }
.mini-cal .mc-dow { text-align:center; font-size:12px; color:#999; font-weight:600; padding-bottom:2px; }
.mini-cal .mc-day { aspect-ratio:1; display:flex; align-items:center; justify-content:center; position:relative; font-size:13px; border-radius:8px; cursor:pointer; background:#f7f7f9; color:#bbb; transition:transform 0.1s; }
.mini-cal .mc-day:active { transform:scale(0.92); }
.mini-cal .mc-day:hover { background:#efeefc; }
.mini-cal .mc-day.empty { visibility:hidden; cursor:default; background:transparent; }
.mini-cal .mc-day.today:not(.selected) { box-shadow: inset 0 0 0 2px #a29bfe; color:#6c5ce7; font-weight:700; }
.mini-cal .mc-day.selected { outline:2px solid #6c5ce7; outline-offset:1px; background:#6c5ce7; color:#fff; font-weight:700; }
.mini-cal .mc-day.selected:hover { background:#6c5ce7; }
.mini-cal .mc-day-dot { position:absolute; bottom:3px; left:50%; transform:translateX(-50%); width:5px; height:5px; border-radius:50%; background:#6c5ce7; }
.mini-cal .mc-day.selected .mc-day-dot { background:#fff; }
.mini-cal .mc-day.week-selected { background:#e4e1fb; color:#4b3fd6; font-weight:700; }
.mini-cal .mc-day.week-selected:hover { background:#d8d4fa; }
.mini-cal .mc-day.week-selected.today { box-shadow: inset 0 0 0 2px #6c5ce7; }
.mini-cal .mc-day.no-select { cursor:default; }
.mini-cal .mc-day.no-select:hover { background:#f7f7f9; }

.mobile-back-btn { display:none; background:#f0f0ee; color:var(--text); border:none; border-radius:8px; padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; margin-bottom:12px; }
.mobile-back-btn:hover { background:#e6e6e3; }

.md-right-sub-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:2px; min-height:22px; }
.right-summary-toggle { background:none; border:none; padding:0; font-size:12px; color:var(--muted); cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; gap:2px; }
.right-summary-toggle:hover { text-decoration:underline; }
.right-summary-chevron { display:inline-block; font-size:10px; transition: transform 0.15s ease; }
.right-summary-toggle.open .right-summary-chevron { transform: rotate(180deg); }
.right-summary-body { display:none; padding:0; font-size:12.5px; color:var(--text); }
.right-summary-body.show { display:block; margin-top:10px; margin-bottom:14px; }
.right-summary-body .info-card { background:#fff; border-radius:14px; padding:14px 16px; margin-bottom:10px; box-shadow:0 1px 4px rgba(0,0,0,0.06); border:1px solid var(--border); }
.right-summary-body .info-card:last-of-type { margin-bottom:0; }
.right-summary-body .info-card h3 { font-size:13px; margin:0 0 8px; display:flex; align-items:center; gap:6px; color:var(--text); font-weight:700; }
.right-summary-body .info-card .info-content { font-size:12.5px; color:#6b6b68; line-height:1.6; white-space:pre-wrap; }
.right-summary-body .info-card .info-content.empty { color:#bbb; }
.schedule-memo-text { font-size:13px; color:var(--text); line-height:1.6; white-space:pre-wrap; }
.right-summary-body .bulk-send-btn { margin-top:4px; }
.student-row.with-sub { flex-direction:column; align-items:stretch; gap:4px; }
.student-row.with-sub .stu-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.student-row .stu-sub { font-size:12px; color:var(--muted); line-height:1.5; }
.student-row .stu-sub.empty { color:#bbb; }
.summary-two-col { display:flex; gap:10px; margin-bottom:10px; }
.summary-two-col .info-card.half { flex:1; margin-bottom:0; }
.stat-row { display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text); padding:3px 0; }
.stat-row b { font-weight:700; }
.stat-text.green { color:var(--green); }
.stat-text.blue { color:var(--blue); }
.stat-text.red { color:var(--red); }
.stat-text.orange { color:#d9822b; }

@media (max-width: 900px) {
  .md-3col { flex-direction: column; }
  .calendar-panel { display: none; border-right: none; border-bottom: 1px solid var(--border); }
  .calendar-panel.open { display: block; width: 100%; min-width: 0; }
  .calendar-panel-inner { width: 100%; padding:4%; }
  .calendar-panel-inner.mini-cal { width: 100%; }
  .md-left {
    width: 100%;
    border-right: none;
    border-bottom: 1px solid var(--border);
    flex: 1;
    overflow-y: auto;
  }
  .md-left.mobile-list-hidden { display: none; }
  .md-right { display: none; padding: 18px 16px; }
  .md-right.mobile-detail-open { display: block; flex: 1; overflow-y: auto; }
  .md-right-header { flex-wrap: wrap; gap: 8px; }
  .right-tabs { overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; }
  .right-tab { white-space: nowrap; flex-shrink: 0; }
  .mobile-back-btn { display: inline-flex; align-items: center; gap: 6px; }
  .summary-two-col { flex-direction: column; gap: 8px; }
}
@media (max-width: 640px) {
  .topbar { flex-wrap: wrap; height: auto; min-height: 52px; padding: 8px 12px; gap: 6px; }
  .topbar .brand { margin-right: 8px; }
  .topbar-actions { margin-left: 0; width: 100%; justify-content: flex-end; }
}
@media (max-width: 480px) {
  .btn-label { display: none; }
  .topbar a, .topbar .nav-btn, .topbar-actions button { padding: 8px 10px; }
}
</style>

<div id="login-screen" style="display:none">

<script>
// ============ 공통 로그인 (admin.html과 같은 localStorage 키를 사용해 한 번만 로그인하면 됩니다) ============
const ADMIN_KEY_STORAGE = "admin_key"
const ADMIN_SESSION_TTL_MS = 24 * 60 * 60 * 1000 // 24시간 후 자동 만료(admin.html과 공유되는 만료 ��각입니다). 문자열 키 형식이라도 만료 시각 비교를 적용해요.
function getAdminKey() {
  const raw = localStorage.getItem(ADMIN_KEY_STORAGE) || ""
  if (!raw) return ""
  try {
    const parsed = JSON.parse(raw)
    if (parsed && typeof parsed === "object" && parsed.key) {
      if (Date.now() - (parsed.ts || 0) > ADMIN_SESSION_TTL_MS) {
        localStorage.removeItem(ADMIN_KEY_STORAGE)
        return ""
      }
      return parsed.key
    }
  } catch (e) {
    // 구형 버전(단순 문자열) 구재걱 랋을 또생 따랑해요: 만료 개니없이 율바로 사용해요.
  }
  return raw
}
function showLoginScreen(errorMsg) {
  document.getElementById("login-screen").style.display = "flex"
  document.getElementById("app-screen").style.display = "none"
  document.getElementById("login-error").textContent = errorMsg || ""
  document.getElementById("login-input").value = ""
  setTimeout(() => document.getElementById("login-input").focus(), 50)
}
function showAppScreen() {
  document.getElementById("login-screen").style.display = "none"
  document.getElementById("app-screen").style.display = "block"
  loadDashboard()
}
async function submitLogin() {
  const input = document.getElementById("login-input")
  const key = input.value.trim()
  const btn = document.getElementById("login-btn")
  const errEl = document.getElementById("login-error")
  if (!key) { errEl.textContent = "비밀번호를 입력하세요."; return }
  btn.disabled = true
  btn.textContent = "확인 중..."
  errEl.textContent = ""
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/list-students`, {
      headers: {
        "x-admin-key": key,
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        "apikey": SUPABASE_ANON_KEY,
      },
    })
    if (res.status === 401) {
      errEl.textContent = "비밀번호가 올바르지 않습니다."
      btn.disabled = false
      btn.textContent = "로그인"
      return
    }
    if (!res.ok) throw new Error(`서버 오류: ${res.status}`)
    localStorage.setItem(ADMIN_KEY_STORAGE, JSON.stringify({ key: key, ts: Date.now() }))
    showAppScreen()
  } catch (err) {
    errEl.textContent = "로그인에 실패했습니다: " + err.message
  } finally {
    btn.disabled = false
    btn.textContent = "로그인"
  }
}
document.getElementById("login-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") submitLogin()
})

let CURRENT_TAB = "dashboard"

function showTab(tab) {
  CURRENT_TAB = tab
  document.querySelectorAll(".nav-btn").forEach(function (btn) {
    btn.classList.toggle("active", btn.dataset.tab === tab)
  })
  const dashboardPage = document.getElementById("page-dashboard")
  const iframePage = document.getElementById("page-iframe")
  const frame = document.getElementById("embed-frame")
  if (tab === "dashboard") {
    dashboardPage.style.display = "flex"
    iframePage.style.display = "none"
    frame.src = "about:blank"
  } else {
    dashboardPage.style.display = "none"
    iframePage.style.display = "block"
    if (frame.getAttribute("src") !== TAB_PAGES[tab]) {
      frame.src = TAB_PAGES[tab]
    }
  }

// ---------------- 상단 공용 새로고침 / 비밀번호 변경 / 로그아웃 ----------------

function topbarRefresh() {
  if (CURRENT_TAB === "dashboard") {
    loadDashboard()
    return
  }
  const frame = document.getElementById("embed-frame")
  const win = frame.contentWindow
  if (win && typeof win.loadStudents === "function") {
    win.loadStudents()
  } else if (win) {
    frame.src = frame.src
  }
}

function topbarChangePassword() {
  const openModal = () => {
    const frame = document.getElementById("embed-frame")
    const win = frame.contentWindow
    if (win && typeof win.openPasswordModal === "function") {
      win.openPasswordModal()
    }
  }
  if (CURRENT_TAB !== "admin") {
    showTab("admin")
    const frame = document.getElementById("embed-frame")
    frame.addEventListener("load", openModal, { once: true })
  } else {
    openModal()
  }
}

function esc(s) {
  if (s === null || s === undefined) return ""
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  })
}

function setDomain(domain) {
  if (DOMAIN === domain) return
  DOMAIN = domain
  SEARCH_TERM = ""
  const searchInput = el("search-input")
  if (searchInput) searchInput.value = ""
  document.querySelectorAll(".domain-tab").forEach(function (b) { b.classList.toggle("active", b.dataset.domain === domain) })
  el("class-list-area").style.display = domain === "class" ? "flex" : "none"
  el("schedule-list-area").style.display = domain === "schedule" ? "flex" : "none"
  el("schedule-category-filter-row").style.display = domain === "schedule" ? "flex" : "none"
  if (domain === "schedule") { SCHEDULE_CATEGORY_FILTER = {}; renderScheduleCategoryFilterRow() }
  el("report-list-area").style.display = domain === "report" ? "flex" : "none"
  el("tuition-list-area").style.display = domain === "tuition" ? "flex" : "none"
  el("bulk-send-tab-btn").style.display = "inline-flex"
  el("right-tab-body").style.display = (domain === "class" || domain === "schedule") ? "block" : "none"
  if (domain !== "class" && domain !== "schedule") el("right-tab-body").innerHTML = ""
  el("right-summary-toggle").style.display = "inline-flex"
  el("report-tuition-detail").style.display = (domain === "report" || domain === "tuition") ? "block" : "none"
  el("cal-panel-report-toggle").style.display = domain === "report" ? "flex" : "none"
  el("bulk-send-tab-btn").disabled = true
  el("right-summary-body").classList.remove("show")
  el("md-right-empty").style.display = "block"
  el("md-right-content").style.display = "none"
  el("md-right-empty").textContent = domain === "class" ? "👈 왼쪽에서 수업을 선택하면 상세정보가 표시돼요"
    : domain === "schedule" ? "👈 왼쪽에서 일정을 선택하면 상세정보가 표시돼요"
    : domain === "report" ? "👈 왼쪽에서 반을 선택하면 학생별 보고서가 표시돼요"
    : "👈 왼쪽에서 반을 선택하면 학생별 수강료가 표시돼요"
  SELECTED_CLASS_ID = null
  SELECTED_SCHEDULE_ID = null
  SELECTED_REPORT_ID = null
  SELECTED_TUITION_ID = null
  SELECTED_REPORT_CLASS = null
  SELECTED_TUITION_CLASS = null

    if (!CALENDAR_OPEN) toggleCalendarPanel()
    CAL_PANEL_MONTH = kstToday().slice(0, 7)
    if (domain === "report") initDefaultWeek()
    loadCalendarPanel()
  }
  loadCenterList()
  if (CALENDAR_OPEN && domain !== "report" && domain !== "tuition") loadCalendarPanel()
}

function shiftCalendarMonth(delta) {
  const parts = CAL_PANEL_MONTH.split("-").map(Number)
  const y = parts[0], m = parts[1]
  const d = new Date(y, m - 1 + delta, 1)
  CAL_PANEL_MONTH = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0")
  if (DOMAIN === "report" && REPORT_TYPE === "weekly") initDefaultWeek()
  loadCalendarPanel()
  if (DOMAIN === "report" || DOMAIN === "tuition") loadCenterList()
}

  if (DOMAIN === "report" && REPORT_TYPE === "weekly") initDefaultWeek()
  loadCalendarPanel()
  if (DOMAIN === "report" || DOMAIN === "tuition") loadCenterList()
}

async function loadCalendarPanel() {
  const parts = CAL_PANEL_MONTH.split("-").map(Number)
  el("cal-panel-month-label").textContent = parts[0] + "년 " + parts[1] + "월"
  renderCalPanel()
  updateDateNavLabel()
  loadCalPanelDots()
}

// 상단 날짜 영역: 수업/일정은 하루 날짜를, 보고서(주간/월간)와 수강료는 해당 기간을 보여줘요.
function formatWeekRangeLabel(startStr, endStr) {
  const days = ["일", "월", "화", "수", "목", "금", "토"]
  const sd = new Date(startStr + "T00:00:00+09:00")
  const ed = new Date(endStr + "T00:00:00+09:00")
  const startText = startStr.replace(/-/g, ".") + " (" + days[sd.getDay()] + ")"
  const endText = endStr.replace(/-/g, ".") + " (" + days[ed.getDay()] + ")"
  return startText + " ~ " + endText
}
function updateDateNavLabel() {
  const labelEl = el("date-nav-label")
  if (!labelEl) return
  if (DOMAIN === "report" && REPORT_TYPE === "weekly") {
    const start = SELECTED_WEEK_START || weekStartOf(CAL_PANEL_MONTH + "-01")
    const end = SELECTED_WEEK_END || weekEndOf(start)
    labelEl.textContent = formatWeekRangeLabel(start, end)
  } else if ((DOMAIN === "report" && REPORT_TYPE === "monthly") || DOMAIN === "tuition") {
    const parts2 = CAL_PANEL_MONTH.split("-").map(Number)
    labelEl.textContent = parts2[0] + "년 " + parts2[1] + "월"
  }
}

// 캘린더에 표시된 달의 날짜별로 수업/일정이 있는지 조회해서 점을 표시해요.
// 단 1번의 요정으로 해당 달의 범위(?month=YYYY-MM)를 조회해요. 이전에는 하맞다 31일을 개네로 조회해서
// Notion API가 ��시에 429(rate limited)를 맞아 지연이 발생했었는데, 이제는 get-classes/get-schedules 각각이 지원하는 월 단위 범위 조회로 1번만 호출해요.
// 만약 월 범위 조회가 실패하면(구버전 백어덹 문제 따랑), 예전의 일자별 조회로 되돌감담 설정해요(동시에 네려 젔렸려가 아니려 5거씩 직닉에 진학해서 Notion 요오을 줄임해요).
async function loadCalPanelDotsViaMonth(url, month) {
  const res = await fetch(url + "?month=" + month, {
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY, "x-admin-key": getAdminKey() || "" },
  })
  if (!res.ok) throw new Error("HTTP " + res.status)
  const data = await res.json()
  const list = data.classes || data.schedules
  if (!Array.isArray(list)) throw new Error("month 응답 형식이 다롼요")
  const items = {}
  list.forEach(function (item) {
    const d = item && item.date ? String(item.date).slice(0, 10) : null
    if (d) items[d] = true
  })
  return items
}

// 구버전 호보서: 동시에 5거씩만 뫖진떁해서 일자별로 조회해요(전에려 31건 다 쓰떄만 이제려 당시에 5건이하뚞도록 해서 Notion 요오을 줄임).
async function loadCalPanelDotsPerDay(url, month) {
  const parts = month.split("-").map(Number)
  const y = parts[0], m = parts[1]
  const daysInMonth = new Date(y, m, 0).getDate()
  const dateStrs = Array.from({ length: daysInMonth }, function (_, i) { return month + "-" + String(i + 1).padStart(2, "0") })
  const items = {}
  const CONCURRENCY = 5
  for (let i = 0; i < dateStrs.length; i += CONCURRENCY) {
    const chunk = dateStrs.slice(i, i + CONCURRENCY)
    await Promise.all(chunk.map(async function (dateStr) {
      try {
        const res = await fetch(url + "?date=" + dateStr, {
          headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY, "x-admin-key": getAdminKey() || "" },
        })
        const data = await res.json()
        const list = data.classes || data.schedules
        if (res.ok && list && list.length) items[dateStr] = true
      } catch (err) {
        console.error("loadCalPanelDots 조회 실패(" + dateStr + "):", err)
      }
    }))
  }
  return items
}

async function loadCalPanelDots() {
  if (DOMAIN === "report" || DOMAIN === "tuition") { CAL_PANEL_ITEMS = {}; renderCalPanel(); return }
  const month = CAL_PANEL_MONTH
  const cacheKey = DOMAIN + ":" + month
  // 이�� �������을 이번 도메인에서 이미 조회한 적 있으면 바로 캐시를 사용해요.
  if (CAL_DOTS_CACHE[cacheKey]) {
    CAL_PANEL_ITEMS = CAL_DOTS_CACHE[cacheKey]
    renderCalPanel()
    return
  }
  const url = DOMAIN === "class" ? GET_CLASSES_URL : GET_SCHEDULES_URL
  let items
  let hadError = false
  try {
    items = await loadCalPanelDotsViaMonth(url, month)
  } catch (err) {
    console.error("월 범위 조회 실패, 일자별 조회로 되돌아감담:", err)
    try {
      items = await loadCalPanelDotsPerDay(url, month)
    } catch (err2) {
      hadError = true
      items = {}
      console.error("loadCalPanelDots 전반 실패:", err2)
    }
  }
  if (month !== CAL_PANEL_MONTH) return
  CAL_PANEL_ITEMS = items
  if (!hadError) CAL_DOTS_CACHE[cacheKey] = items
  renderCalPanel()
}

function weekStartOf(dateStr) {
  const d = new Date(dateStr + "T00:00:00+09:00")
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7)) // 월요일을 주 시작으로 통일
  return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul" }).format(d)
}
function weekEndOf(weekStartStr) {
  const d = new Date(weekStartStr + "T00:00:00+09:00")
  d.setDate(d.getDate() + 6)
  return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul" }).format(d)
}
function initDefaultWeek() {
  const today = kstToday()
  const base = today.slice(0, 7) === CAL_PANEL_MONTH ? today : (CAL_PANEL_MONTH + "-01")
  SELECTED_WEEK_START = weekStartOf(base)
  SELECTED_WEEK_END = weekEndOf(SELECTED_WEEK_START)
}
function selectCalWeek(weekStartStr) {
  SELECTED_WEEK_START = weekStartStr
  SELECTED_WEEK_END = weekEndOf(weekStartStr)
  renderCalPanel()
  updateDateNavLabel()
  renderReportList()
}

function renderCalPanel() {
  const parts = CAL_PANEL_MONTH.split("-").map(Number)
  const y = parts[0], m = parts[1]
  const first = new Date(y, m - 1, 1)
  const startWeekday = (first.getDay() + 6) % 7 // 월요일 시작 기준 오프셋
  const daysInMonth = new Date(y, m, 0).getDate()
  const today = kstToday()
  const dows = ["월", "화", "수", "목", "금", "토", "일"]
  const isWeeklyReport = DOMAIN === "report" && REPORT_TYPE === "weekly"
  const isMonthOnly = DOMAIN === "tuition" || (DOMAIN === "report" && REPORT_TYPE === "monthly")
  let cells = dows.map(function (d) { return '<div class="mc-dow">' + d + '</div>' }).join("")
  for (let i = 0; i < startWeekday; i++) cells += '<div class="mc-day empty"></div>'
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = CAL_PANEL_MONTH + "-" + String(d).padStart(2, "0")
    let cls = "mc-day"
    if (dateStr === today) cls += " today"
    if (isWeeklyReport) {
      if (SELECTED_WEEK_START && dateStr >= SELECTED_WEEK_START && dateStr <= SELECTED_WEEK_END) cls += " week-selected"
      cells += '<div class="' + cls + '" onclick="selectCalWeek(' + attrSafe(weekStartOf(dateStr)) + ')">' + d + '</div>'
    } else if (isMonthOnly) {
      cells += '<div class="' + cls + ' no-select">' + d + '</div>'
    } else {
      if (dateStr === CURRENT_DATE) cls += " selected"
      const dot = CAL_PANEL_ITEMS[dateStr] ? '<span class="mc-day-dot"></span>' : ""
      cells += '<div class="' + cls + '" onclick="goToDateFromCalendarPanel(' + attrSafe(dateStr) + ')">' + d + dot + '</div>'
    }
  }
  el("cal-panel-area").innerHTML = '<div class="mc-grid">' + cells + '</div>'
}

function goToDateFromCalendarPanel(dateStr) {
  CURRENT_DATE = dateStr
  if (isMobileLayout()) {
    CALENDAR_OPEN = false
    el("calendar-panel").classList.remove("open")
  } else if (CALENDAR_OPEN) {
    renderCalPanel()
  }
  loadCenterList()
}

function debounce(fn, wait) {
  let timer = null
  return function (...args) {
    clearTimeout(timer)
    timer = setTimeout(function () { fn.apply(null, args) }, wait)
  }
}

// 보고서 탭 전용: 발송완료/미발송을 하나의 배지로 통합해요(수업 탭 classSendSummaryBadge��� 동일한 패턴).
function reportSendBadge(items) {
  const total = items.length
  const sentCount = items.filter(function (r) { return r.sentBy }).length
  const pct = total ? Math.round((sentCount / total) * 100) : 0
  const tone = pct >= 100 ? "tone-blue" : pct <= 0 ? "tone-gray" : "tone-orange"
  return '<span class="badge ' + tone + '">발송 ' + sentCount + '/' + total + '명</span>'
}

// "N% (n/m)" 형태의 텍스트 필드(attendanceSummary 등)에서 그룹 평균 퍼센트를 계산해요.
function reportGroupAvgRate(items, key) {
  const nums = items.map(function (r) { const p = parseAttendanceRate(r[key]); return p ? p.pct : null }).filter(function (v) { return v != null })
  if (!nums.length) return null
  return Math.round(nums.reduce(function (a, b) { return a + b }, 0) / nums.length)
}

// 숫자형 필드(평가 평균점수 등)의 그룹 평균을 계산해요. 백엔드가 아직 필드를 내려주지 않으면 null을 반환해요.
function reportGroupAvgScore(items, key) {
  const nums = items.map(function (r) { return typeof r[key] === "number" ? r[key] : null }).filter(function (v) { return v != null })
  if (!nums.length) return null
  return Math.round(nums.reduce(function (a, b) { return a + b }, 0) / nums.length)
}

// 여러 반이름/학생보고서 카드에서 공통으로 쓰는 반(클래스)별 그룹화 헬퍼니다.
function groupByClass(list, idKey, nameKey) {
  const map = new Map()
  list.forEach(function (item) {
    const id = item[idKey] || "__unassigned__"
    const name = item[nameKey] || "미배정"
    if (!map.has(id)) map.set(id, { classId: id, className: name, emoji: item.emoji || "", items: [] })
    else if (!map.get(id).emoji && item.emoji) map.get(id).emoji = item.emoji
    map.get(id).items.push(item)
  })
  const groups = Array.from(map.values())
  groups.sort(function (a, b) {
    if (a.classId === "__unassigned__") return 1
    if (b.classId === "__unassigned__") return -1
    return a.className.localeCompare(b.className, "ko")
  })
  return groups
}

function getFilteredReports() {
  const term = SEARCH_TERM
  let list = REPORTS
  if (REPORT_TYPE === "weekly" && SELECTED_WEEK_START) {
    list = list.filter(function (r) {
      const p = r.period
      if (!p || !p.start) return false
      const rEnd = p.end || p.start
      return p.start <= SELECTED_WEEK_END && rEnd >= SELECTED_WEEK_START
    })
  }
  return list.filter(function (r) { return !term || (r.studentName || "").toLowerCase().includes(term) })
}

function renderReportList() {
  // 보고서 목록을 불러오는 중이면(주/유형 전환 등으로 이 함수가 별도로 호출되더라도) 파란 로딩 박스를 그대로 유지하고, "없어요" 등 결과 화면은 데이터가 실제로 도착한 뒤에만 보여줘요.
  if (REPORT_LOADING) return
  const list = getFilteredReports()
  if (!list.length) {
    SELECTED_REPORT_CLASS = null
    el("report-list-area").innerHTML = '<div class="empty">' + (REPORT_TYPE === "weekly" ? "해당 주에 해당하는 보고서가 없어요" : "해당 월에 해당하는 보고서가 없어요") + '</div>'
    renderReportClassDetail()
    return
  }
  const groups = groupByClass(list, "classId", "className")
  if (SELECTED_REPORT_CLASS && !groups.some(function (g) { return g.classId === SELECTED_REPORT_CLASS })) SELECTED_REPORT_CLASS = null
  el("report-list-area").innerHTML = groups.map(function (g) {
    const active = g.classId === SELECTED_REPORT_CLASS ? " selected" : ""
    const sentCount = g.items.filter(function (r) { return r.sentBy }).length
    return '<div class="class-item' + active + '">'
      + '<div class="class-item-head" onclick="selectReportClass(' + attrSafe(g.classId) + ')">'
        + '<div class="class-item-title-row"><span class="class-item-title">' + resolveClassEmoji(g.classId, g.className, g.emoji) + ' ' + esc(g.className) + '</span><span class="class-item-time">' + g.items.length + '명</span></div>'
        + '<div class="class-item-badges"><span class="badge tone-blue">발송 ' + sentCount + '</span><span class="badge tone-gray">미발송 ' + (g.items.length - sentCount) + '</span></div>'
      + '</div>'
      + '</div>'
  }).join("")
  renderReportClassDetail()
}

function reportSearchHaystack(r) {
  return [displayStudentName(r.studentName || r.title), r.className].filter(Boolean).join(" ").toLowerCase()
}

function buildReportRowsHtml(list) {
  const sendFnName = REPORT_TYPE === "monthly" ? "월간" : "주간"
  const term = REPORT_SEARCH_TERM.trim().toLowerCase()
  let rows = term ? list.filter(function (r) { return reportSearchHaystack(r).indexOf(term) >= 0 }) : list.slice()
  if (REPORT_SORT_NAME_ASC) rows = rows.slice().sort(function (a, b) { return String(displayStudentName(a.studentName || a.title)).localeCompare(String(displayStudentName(b.studentName || b.title)), "ko") })
  if (rows.length === 0) return '<div class="empty">검색 결과가 없어요</div>'
  return rows.map(function (r) { return reportRowHtml(r, sendFnName) }).join("")
}

function reportRowHtml(r, sendFnName) {
  const sentBadge = r.sentBy ? '<span class="badge tone-blue">발송완료</span>' : '<span class="badge tone-gray">미발송</span>'
  const rate = parseAttendanceRate(r.attendanceSummary)
  const rateBadge = rate ? ' <span class="rate-badge ' + attendanceRateTone(rate.pct) + '">' + rate.text + '</span>' : ""
  const hwRate = parseAttendanceRate(r.homeworkSummary)
  const hwBadge = hwRate ? ' <span class="rate-badge ' + attendanceRateTone(hwRate.pct) + '">과제 ' + hwRate.pct + '%</span>' : ""
  const evalScoreNum = parseScoreText(r.evalScoreSummary)

function paymentStatusTone(status) {

  if (s.includes("부분")) return "tone-orange"
  return "tone-gray"
}
