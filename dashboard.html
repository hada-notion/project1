<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>하다 어드민 대시보드</title>
<style>
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --border: #e5e5e3;
    --text: #37352f;
    --muted: #9b9a97;
    --accent: #2383e2;
    --green: #2e7d32;
    --blue: #1565c0;
    --red: #c62828;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  /* 상단 메뉴 */
  .topbar {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 52px;
    padding: 0 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .topbar .brand {
    font-weight: 700;
    margin-right: 20px;
    color: var(--text);
  }
  .topbar a, .topbar .nav-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 8px;
    text-decoration: none;
    color: var(--muted);
    font-size: 14px;
    font-weight: 500;
    border: none;
    background: none;
    font-family: inherit;
    cursor: pointer;
  }
  .topbar a.active, .topbar .nav-btn.active {
    background: #edf3fc;
    color: var(--accent);
  }
  .topbar a:hover:not(.active), .topbar .nav-btn:hover:not(.active) { background: #f0f0ee; }
  .topbar-actions {
    margin-left: auto;
    display: flex;
    gap: 8px;
  }
  .topbar-actions button {
    background: #333; color: #fff; border: none; padding: 8px 14px;
    border-radius: 8px; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .topbar-actions button.logout { background: #eee; color: #555; }

  /* 전체 레이아웃 */
  .layout {
    display: flex;
    min-height: calc(100vh - 52px);
  }
  /* 사이드 메뉴 */
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 16px 10px;
  }
  .sidebar .item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    border-radius: 8px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    margin-bottom: 2px;
  }
  .sidebar .item.active {
    background: #edf3fc;
    color: var(--accent);
  }
  .sidebar .item.disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .sidebar .item:hover:not(.active):not(.disabled) { background: #f0f0ee; }
  .sidebar .soon {
    margin-left: auto;
    font-size: 10px;
    color: var(--muted);
    background: #f0f0ee;
    padding: 2px 6px;
    border-radius: 999px;
  }

  /* 메인 콘텐츠 */
  .main {
    flex: 1;
    padding: 28px 32px;
    max-width: 1100px;
  }
  .page-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .page-header h1 {
    font-size: 22px;
    margin: 0;
  }
  .page-header .date {
    color: var(--muted);
    font-size: 14px;
  }
  .refresh-btn {
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
    color: var(--text);
  }
  .refresh-btn:hover { background: #f0f0ee; }

  .status-banner {
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 16px;
  }
  .status-banner.loading { background: #eef4fd; color: var(--accent); }
  .status-banner.error { background: #fdecec; color: var(--red); }

  .cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    min-height: 320px;
  }
  .card h2 {
    font-size: 15px;
    margin: 0 0 4px 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card .count {
    font-size: 28px;
    font-weight: 700;
    margin: 6px 0 14px 0;
  }
  .card .count small {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
  }
  .list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 220px;
    overflow-y: auto;
  }
  .list li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    background: #fbfbfa;
    font-size: 13px;
  }
  .list li a {
    color: var(--text);
    text-decoration: none;
    flex: 1;
  }
  .list li a:hover { text-decoration: underline; }
  .badge {
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge.green { background: #e6f4ea; color: var(--green); }
  .badge.blue { background: #e8f0fe; color: var(--blue); }
  .badge.red { background: #fdecec; color: var(--red); }
  .badge.gray { background: #f0f0ee; color: var(--muted); }
  .empty {
    color: var(--muted);
    font-size: 13px;
    padding: 20px 0;
    text-align: center;
  }
  .summary-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .login-card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 32px 28px;
    width: 100%;
    max-width: 340px;
    text-align: center;
  }
  .login-card h1 { font-size: 18px; margin: 0 0 4px; }
  .login-card p { font-size: 12px; color: #888; margin: 0 0 20px; }
  .login-card input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 10px;
  }
  .login-card button {
    width: 100%;
    padding: 10px 12px;
    background: #6c5ce7;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .login-card button:disabled { background: #ccc; cursor: default; }
  .login-error { color: #e04b4b; font-size: 12px; margin-top: 10px; min-height: 14px; }

.attendance-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.attendance-item .left { display: flex; align-items: center; gap: 8px; }
.send-btn {
  padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border);
  background: #fff; cursor: pointer; font-size: 12px;
}
.send-btn:disabled { color: var(--muted); cursor: default; opacity: 0.5; }
.bulk-send-btn {
  margin-bottom: 8px; padding: 6px 12px; border-radius: 8px; border: none;
  background: var(--accent); color: #fff; font-size: 13px; cursor: pointer;
}
.bulk-send-btn:disabled { background: var(--muted); cursor: default; }
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
  align-items: center; justify-content: center; z-index: 100;
}
.modal-overlay.show { display: flex; }
.modal-box { background: #fff; border-radius: 12px; padding: 20px; width: 320px; max-width: 90vw; }
.modal-box h3 { margin: 0 0 8px; }
.modal-box p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
.modal-actions button { padding: 8px 14px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; }
.modal-actions .cancel { background: var(--bg); color: var(--text); }
.modal-actions .confirm { background: var(--accent); color: #fff; }
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: #37352f; color: #fff; padding: 10px 18px; border-radius: 8px;
  font-size: 13px; opacity: 0; transition: opacity 0.2s, transform 0.2s; z-index: 200; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="login-screen" style="display:none">
  <div class="login-card">
    <h1>🔒 관리자 로그인</h1>
    <p>학원관리 화면에 접근하려면<br>관리자 비밀번호를 입력하세요</p>
    <input type="password" id="login-input" placeholder="관리자 비밀번호" autocomplete="current-password">
    <button id="login-btn" onclick="submitLogin()">로그인</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div id="app-screen" style="display:none">
<div class="topbar">
  <div class="brand">하다 학원관리</div>
  <button class="nav-btn active" data-tab="dashboard" onclick="showTab('dashboard')">📊 대시보드</button>
  <button class="nav-btn" data-tab="admin" onclick="showTab('admin')">🗂️ 리포트 관리</button>
  <button class="nav-btn" data-tab="kiosk" onclick="showTab('kiosk')">🖊️ 키오스크</button>
  <div class="topbar-actions">
    <button onclick="topbarRefresh()">🔄 새로고침</button>
    <button onclick="topbarChangePassword()">🔑 비밀번호 변경</button>
    <button class="logout" onclick="topbarLogout()">로그아웃</button>
  </div>
</div>

<div class="modal-overlay" id="alimtalk-modal">
  <div class="modal-box">
    <h3>알림톡 발송 확인</h3>
    <p id="alimtalk-modal-text">선택된 학생에게 오늘의 학습 리포트 알림톡을 발송하시겠습니까?</p>
    <div class="modal-actions">
      <button class="cancel" onclick="closeAlimtalkModal()">취소</button>
      <button class="confirm" onclick="confirmAlimtalkSend()">발송</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<div class="layout" id="page-dashboard">
  <div class="sidebar">
    <div class="item active" data-view="main">🏠 MAIN</div>
    <div class="item disabled" data-view="calendar">📅 캘린더 <span class="soon">준비중</span></div>
    <div class="item disabled" data-view="class">🏫 클래스 <span class="soon">준비중</span></div>
    <div class="item disabled" data-view="teacher">򄐍닻 강사 <span class="soon">준비중</span></div>
  </div>

  <div class="main">
    <div class="page-header">
      <div>
        <h1>MAIN</h1>
        <div class="date" id="date-label">날짜 불러오는 중...</div>
      </div>
      <button class="refresh-btn" id="refresh-btn">🔄 새로고침</button>
    </div>

    <div id="status-area"></div>

    <div class="cards">
      <div class="card">
        <h2>🗓️ 오늘 일정</h2>
        <div class="count" id="schedule-count">-</div>
        <ul class="list" id="schedule-list"></ul>
      </div>

      <div class="card">
        <h2>📚 오늘 수업</h2>
        <div class="count" id="class-count">-</div>
        <ul class="list" id="class-list"></ul>
      </div>

      <div class="card">
        <h2>👥 오늘 등원학생</h2>
        <div class="count" id="attendance-count">-</div>
        <div class="summary-row" id="attendance-summary"></div>
        <button class="bulk-send-btn" id="bulk-send-btn" onclick="sendAlimtalkBulk()" disabled>📩 전송</button>
        <ul class="list" id="attendance-list"></ul>
      </div>
    </div>
  </div>
</div>

<div id="page-iframe" style="display:none; height: calc(100vh - 52px);">
  <iframe id="embed-frame" style="width:100%; height:100%; border:none;"></iframe>
</div>

</div>

<script>
// ============ 공용 로그인 (admin.html과 같은 localStorage 키를 사용해 한 번만 로그인하면 됩니다) ============
const ADMIN_KEY_STORAGE = "admin_key"
function getAdminKey() { return localStorage.getItem(ADMIN_KEY_STORAGE) || "" }
function showLoginScreen(errorMsg) {
  document.getElementById("login-screen").style.display = "flex"
  document.getElementById("app-screen").style.display = "none"
  document.getElementById("login-error").textContent = errorMsg || ""
  document.getElementById("login-input").value = ""
  setTimeout(() => document.getElementById("login-input").focus(), 50)
}
function showAppScreen() {
  document.getElementById("login-screen").style.display = "none"
  document.getElementById("app-screen").style.display = "block"
  loadDashboard()
}
async function submitLogin() {
  const input = document.getElementById("login-input")
  const key = input.value.trim()
  const btn = document.getElementById("login-btn")
  const errEl = document.getElementById("login-error")
  if (!key) { errEl.textContent = "비밀번호를 입력하세요."; return }
  btn.disabled = true
  btn.textContent = "확인 중..."
  errEl.textContent = ""
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/list-students`, {
      headers: {
        "x-admin-key": key,
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        "apikey": SUPABASE_ANON_KEY,
      },
    })
    if (res.status === 401) {
      errEl.textContent = "비밀번호가 올바르지 않습니다."
      btn.disabled = false
      btn.textContent = "로그인"
      return
    }
    if (!res.ok) throw new Error(`서버 오류: ${res.status}`)
    localStorage.setItem(ADMIN_KEY_STORAGE, key)
    showAppScreen()
  } catch (err) {
    errEl.textContent = "로그인에 실패했습니다: " + err.message
  } finally {
    btn.disabled = false
    btn.textContent = "로그인"
  }
}
document.getElementById("login-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") submitLogin()
})
// ============ 기존 설정 ============
// ============ 설정 (배포 전 채워넣으세요) ============
const SUPABASE_URL = "https://twczhsxybkcvjkdfdxvs.supabase.co"
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3Y3poc3h5YmtjdmprZGZkeHZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyOTcwMDQsImV4cCI6MjEwMzg3MzAwNH0.t7Ltb_iSYqE4gHSoGSm-OlpiLjGqIcgrhzGJ-t56EDc" // admin.html에서 쓰는 anon key와 동일한 값으로 교체
const FUNCTION_URL = SUPABASE_URL + "/functions/v1/get-admin-dashboard"
const SEND_DAILY_REPORT_URL = SUPABASE_URL + "/functions/v1/send-daily-report"
const TAB_PAGES = { admin: "admin.html", kiosk: "attendance_kiosk.html" }
// =============================================================

let CURRENT_TAB = "dashboard"

function showTab(tab) {
  CURRENT_TAB = tab
  document.querySelectorAll(".nav-btn").forEach(function (btn) {
    btn.classList.toggle("active", btn.dataset.tab === tab)
  })
  const dashboardPage = document.getElementById("page-dashboard")
  const iframePage = document.getElementById("page-iframe")
  const frame = document.getElementById("embed-frame")
  if (tab === "dashboard") {
    dashboardPage.style.display = "flex"
    iframePage.style.display = "none"
    frame.src = "about:blank"
  } else {
    dashboardPage.style.display = "none"
    iframePage.style.display = "block"
    if (frame.getAttribute("src") !== TAB_PAGES[tab]) {
      frame.src = TAB_PAGES[tab]
    }
  }
}

// ---------------- 상단 공용 새로고침 / 비밀번호 변경 / 로그아웃 ----------------
// 리포트 관리 화면에만 있던 이 3가지 동작을 상단 메뉴로 옮겨, 어느 탭에 있든 바로 쓸 수 있게 합니다.
function topbarRefresh() {
  if (CURRENT_TAB === "dashboard") {
    loadDashboard()
    return
  }
  const frame = document.getElementById("embed-frame")
  const win = frame.contentWindow
  if (win && typeof win.loadStudents === "function") {
    win.loadStudents()
  } else if (win) {
    frame.src = frame.src
  }
}

function topbarChangePassword() {
  const openModal = () => {
    const frame = document.getElementById("embed-frame")
    const win = frame.contentWindow
    if (win && typeof win.openPasswordModal === "function") {
      win.openPasswordModal()
    }
  }
  if (CURRENT_TAB !== "admin") {
    showTab("admin")
    const frame = document.getElementById("embed-frame")
    frame.addEventListener("load", openModal, { once: true })
  } else {
    openModal()
  }
}

function topbarLogout() {
  localStorage.removeItem(ADMIN_KEY_STORAGE)
  location.reload()
}

let ATTENDANCE_LIST = []
let ALIMTALK_PENDING = null

const statusBadgeClass = {
  "🟢출석": "green",
  "🔵보강": "blue",
  "🔴결석": "red",
}

function el(id) { return document.getElementById(id) }

function esc(s) {
  if (s === null || s === undefined) return ""
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  })
}

function showToast(msg) {
  const t = document.getElementById("toast")
  t.textContent = msg
  t.classList.add("show")
  setTimeout(function () { t.classList.remove("show") }, 1800)
}

function setStatus(type, message) {
  const area = el("status-area")
  if (!type) { area.innerHTML = ""; return }
  area.innerHTML = '<div class="status-banner ' + type + '">' + message + '</div>'
}

function formatDateLabel(dateStr) {
  const d = new Date(dateStr + "T00:00:00+09:00")
  const days = ["일","월","화","수","목","금","토"]
  return dateStr.replace(/-/g, ".") + " (" + days[d.getDay()] + ")"
}

function renderSchedules(schedules) {
  el("schedule-count").textContent = schedules.length + "건"
  const listEl = el("schedule-list")
  if (schedules.length === 0) {
    listEl.innerHTML = '<div class="empty">오늘 등록된 일정이 없어요</div>'
    return
  }
  listEl.innerHTML = schedules.map(function (s) {
    return '<li><a href="' + s.url + '" target="_blank">' + s.name + '</a>' +
      (s.category ? '<span class="badge gray">' + s.category + '</span>' : '') + '</li>'
  }).join("")
}

function renderClasses(classes) {
  el("class-count").textContent = classes.length + "개 반"
  const listEl = el("class-list")
  if (classes.length === 0) {
    listEl.innerHTML = '<div class="empty">오늘 진행된 수업이 없어요</div>'
    return
  }
  listEl.innerHTML = classes.map(function (c) {
    return '<li><a href="' + c.url + '" target="_blank">' + c.name + '</a></li>'
  }).join("")
}

function renderAttendance(attendance) {
  el("attendance-count").innerHTML = attendance.total + '명 <small>기록기준</small>'
  const summaryEl = el("attendance-summary")
  const entries = Object.entries(attendance.summary || {})
  summaryEl.innerHTML = entries.map(function (entry) {
    const key = entry[0], val = entry[1]
    const cls = statusBadgeClass[key] || "gray"
    return '<span class="badge ' + cls + '">' + key + ' ' + val + '</span>'
  }).join("")

  ATTENDANCE_LIST = attendance.list || []
  const bulkBtn = el("bulk-send-btn")
  const hasSendable = ATTENDANCE_LIST.some(function (a) { return a.hasClassToday && a.attendanceId })
  if (bulkBtn) bulkBtn.disabled = !hasSendable

  const listEl = el("attendance-list")
  if (ATTENDANCE_LIST.length === 0) {
    listEl.innerHTML = '<div class="empty">오늘 출석 기록이 없어요</div>'
    return
  }
  listEl.innerHTML = ATTENDANCE_LIST.map(function (a, i) {
    const cls = statusBadgeClass[a.status] || "gray"
    const canSend = a.hasClassToday && a.attendanceId
    return '<li class="attendance-item">' +
      '<span class="left"><a href="' + a.url + '" target="_blank">' + esc(a.name) + '</a>' +
      (a.status ? '<span class="badge ' + cls + '">' + a.status + '</span>' : '') + '</span>' +
      '<span class="right"><button class="send-btn" id="send-' + i + '" onclick="sendAlimtalk(' + i + ')" ' + (canSend ? "" : "disabled") + '>📩 전송</button></span>' +
      '</li>'
  }).join("")
}

async function loadDashboard() {
  setStatus("loading", "데이터를 불러오는 중이에요...")
  try {
    const res = await fetch(FUNCTION_URL, {
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: "Bearer " + SUPABASE_ANON_KEY,
      },
    })
    const data = await res.json()
    if (!res.ok) throw new Error(data.error || ("HTTP " + res.status))

    el("date-label").textContent = formatDateLabel(data.date)
    renderSchedules(data.schedules || [])
    renderClasses(data.classes || [])
    renderAttendance(data.attendance || { total: 0, summary: {}, list: [] })
    setStatus(null)
  } catch (err) {
    setStatus("error", "불러오기 실패: " + err.message)
  }
}

el("refresh-btn").addEventListener("click", loadDashboard)
if (getAdminKey()) {
  showAppScreen()
} else {
  showLoginScreen()
}

function openAlimtalkModal(indices) {
  ALIMTALK_PENDING = indices
  const text = indices.length === 1
    ? (ATTENDANCE_LIST[indices[0]] ? esc(ATTENDANCE_LIST[indices[0]].name) : "") + "에게 오늘의 학습 리포트 알림톡을 발송하시겠습니까?"
    : indices.length + "원에게 오늘의 학습 리포트 알림톡을 일괄 발송하시겠습니까?"
  el("alimtalk-modal-text").textContent = text
  el("alimtalk-modal").classList.add("show")
}

function closeAlimtalkModal() {
  ALIMTALK_PENDING = null
  el("alimtalk-modal").classList.remove("show")
}

function sendAlimtalk(i) {
  const a = ATTENDANCE_LIST[i]
  if (!a || !a.hasClassToday || !a.attendanceId) return
  openAlimtalkModal([i])
}

function sendAlimtalkBulk() {
  const indices = ATTENDANCE_LIST
    .map(function (a, i) { return i })
    .filter(function (i) { const a = ATTENDANCE_LIST[i]; return a.hasClassToday && a.attendanceId })
  if (indices.length === 0) return
  openAlimtalkModal(indices)
}

function confirmAlimtalkSend() {
  const indices = ALIMTALK_PENDING
  el("alimtalk-modal").classList.remove("show")
  if (!indices || indices.length === 0) return
  if (indices.length === 1) {
    sendAlimtalkOne(indices[0])
  } else {
    sendAlimtalkBulkRun(indices)
  }
  ALIMTALK_PENDING = null
}

async function callSendDailyReport(a) {
  const res = await fetch(SEND_DAILY_REPORT_URL, {
    method: "POST",
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: "Bearer " + SUPABASE_ANON_KEY,
      "Content-Type": "application/json",
      "x-admin-key": getAdminKey() || "",
    },
    body: JSON.stringify({ registrationId: a.registrationId, attendanceId: a.attendanceId }),
  })
  const data = await res.json().catch(function () { return {} })
  if (!res.ok) throw new Error(data.error || ("HTTP " + res.status))
  return data
}

async function sendAlimtalkOne(index) {
  const a = ATTENDANCE_LIST[index]
  if (!a) return
  const btn = el("send-" + index)
  if (btn) { btn.disabled = true; btn.textContent = "발송중..." }
  try {
    await callSendDailyReport(a)
    showToast(esc(a.name) + "에게 알림톡을 발송했어요")
  } catch (err) {
    showToast("발송 실패: " + err.message)
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "📩 전송" }
  }
}

async function sendAlimtalkBulkRun(indices) {
  const bulkBtn = el("bulk-send-btn")
  if (bulkBtn) { bulkBtn.disabled = true; bulkBtn.textContent = "발송중..." }
  let success = 0, fail = 0
  for (const i of indices) {
    const a = ATTENDANCE_LIST[i]
    if (!a) continue
    const btn = el("send-" + i)
    if (btn) { btn.disabled = true; btn.textContent = "발송중..." }
    try {
      await callSendDailyReport(a)
      success++
    } catch (_e) {
      fail++
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = "📩 전송" }
    }
  }
  if (bulkBtn) { bulkBtn.disabled = false; bulkBtn.textContent = "📩 전송" }
  showToast(success + "건 발송 완료" + (fail ? ", " + fail + "건 실패" : ""))
}

</script>
