<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>하다 어드민 대시보드</title>
<style>
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --border: #e5e5e3;
    --text: #37352f;
    --muted: #9b9a97;
    --accent: #2383e2;
    --green: #2e7d32;
    --blue: #1565c0;
    --red: #c62828;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  /* 상단 메뉴 */
  .topbar {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 52px;
    padding: 0 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .topbar .brand {
    font-weight: 700;
    margin-right: 20px;
    color: var(--text);
  }
  .topbar a, .topbar .nav-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 8px;
    text-decoration: none;
    color: var(--muted);
    font-size: 14px;
    font-weight: 500;
    border: none;
    background: none;
    font-family: inherit;
    cursor: pointer;
  }
  .topbar a.active, .topbar .nav-btn.active {
    background: #edf3fc;
    color: var(--accent);
  }
  .topbar a:hover:not(.active), .topbar .nav-btn:hover:not(.active) { background: #f0f0ee; }
  .topbar-actions {
    margin-left: auto;
    display: flex;
    gap: 8px;
  }
  .topbar-actions button {
    background: #333; color: #fff; border: none; padding: 8px 14px;
    border-radius: 8px; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .topbar-actions button.logout { background: #eee; color: #555; }

  /* 전체 레이아웃 */
  .layout {
    display: flex;
    min-height: calc(100vh - 52px);
  }
  /* 사이드 메뉴 */
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 16px 10px;
  }
  .sidebar .item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    border-radius: 8px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    margin-bottom: 2px;
  }
  .sidebar .item.active {
    background: #edf3fc;
    color: var(--accent);
  }
  .sidebar .item.disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .sidebar .item:hover:not(.active):not(.disabled) { background: #f0f0ee; }
  .sidebar .soon {
    margin-left: auto;
    font-size: 10px;
    color: var(--muted);
    background: #f0f0ee;
    padding: 2px 6px;
    border-radius: 999px;
  }

  /* 메인 콘텐츠 */
  .main {
    flex: 1;
    padding: 28px 32px;
    max-width: 1100px;
  }
  .page-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .page-header h1 {
    font-size: 22px;
    margin: 0;
  }
  .page-header .date {
    color: var(--muted);
    font-size: 14px;
  }
  .refresh-btn {
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
    color: var(--text);
  }
  .refresh-btn:hover { background: #f0f0ee; }

  .status-banner {
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 16px;
  }
  .status-banner.loading { background: #eef4fd; color: var(--accent); }
  .status-banner.error { background: #fdecec; color: var(--red); }

  .cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    min-height: 320px;
  }
  .card h2 {
    font-size: 15px;
    margin: 0 0 4px 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card .count {
    font-size: 28px;
    font-weight: 700;
    margin: 6px 0 14px 0;
  }
  .card .count small {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
  }
  .list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 220px;
    overflow-y: auto;
  }
  .list li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    background: #fbfbfa;
    font-size: 13px;
  }
  .list li a {
    color: var(--text);
    text-decoration: none;
    flex: 1;
  }
  .list li a:hover { text-decoration: underline; }
  .badge {
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge.green { background: #e6f4ea; color: var(--green); }
  .badge.blue { background: #e8f0fe; color: var(--blue); }
  .badge.red { background: #fdecec; color: var(--red); }
  .badge.gray { background: #f0f0ee; color: var(--muted); }
  .empty {
    color: var(--muted);
    font-size: 13px;
    padding: 20px 0;
    text-align: center;
  }
  .summary-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .login-card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 32px 28px;
    width: 100%;
    max-width: 340px;
    text-align: center;
  }
  .login-card h1 { font-size: 18px; margin: 0 0 4px; }
  .login-card p { font-size: 12px; color: #888; margin: 0 0 20px; }
  .login-card input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 10px;
  }
  .login-card button {
    width: 100%;
    padding: 10px 12px;
    background: #6c5ce7;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .login-card button:disabled { background: #ccc; cursor: default; }
  .login-error { color: #e04b4b; font-size: 12px; margin-top: 10px; min-height: 14px; }

.attendance-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.attendance-item .left { display: flex; align-items: center; gap: 8px; }
.send-btn {
  padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border);
  background: #fff; cursor: pointer; font-size: 12px;
}
.send-btn:disabled { color: var(--muted); cursor: default; opacity: 0.5; }
.bulk-send-btn {
  margin-bottom: 8px; padding: 6px 12px; border-radius: 8px; border: none;
  background: var(--accent); color: #fff; font-size: 13px; cursor: pointer;
}
.bulk-send-btn:disabled { background: var(--muted); cursor: default; }
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
  align-items: center; justify-content: center; z-index: 100;
}
.modal-overlay.show { display: flex; }
.modal-box { background: #fff; border-radius: 12px; padding: 20px; width: 320px; max-width: 90vw; }
.modal-box h3 { margin: 0 0 8px; }
.modal-box p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
.modal-actions button { padding: 8px 14px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; }
.modal-actions .cancel { background: var(--bg); color: var(--text); }
.modal-actions .confirm { background: var(--accent); color: #fff; }
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: #37352f; color: #fff; padding: 10px 18px; border-radius: 8px;
  font-size: 13px; opacity: 0; transition: opacity 0.2s, transform 0.2s; z-index: 200; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.md-left { width: 340px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--border); padding:16px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
.filter-tab, .view-tab { border:1px solid var(--border); background:#fff; padding:6px 12px; border-radius:8px; font-size:13px; cursor:pointer; color:var(--muted); font-family:inherit; }
.filter-tab.active, .view-tab.active { background:#edf3fc; color:var(--accent); border-color:#c9e0fb; }
.md-filter-row, .md-view-row { display:flex; gap:6px; }
.md-filter-options { display:flex; flex-wrap:wrap; gap:6px; }
.filter-option { border:1px solid var(--border); background:#fbfbfa; padding:4px 10px; border-radius:999px; font-size:12px; cursor:pointer; color:var(--text); font-family:inherit; }
.filter-option.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.md-date-nav { display:flex; align-items:center; justify-content:center; gap:12px; font-size:14px; font-weight:600; }
.date-nav-btn { border:none; background:#f0f0ee; width:28px; height:28px; border-radius:6px; cursor:pointer; font-size:14px; }
.class-list-area { display:flex; flex-direction:column; gap:8px; }
.class-item { border:1px solid var(--border); border-radius:10px; background:#fbfbfa; overflow:hidden; }
.class-item.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.class-item-head { padding:10px 12px; cursor:pointer; display:flex; flex-direction:column; gap:4px; }
.class-item-head:hover { background:#f2f6fc; }
.class-item-title-row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.class-item-title { font-size:13.5px; font-weight:600; }
.class-item-time { font-size:12px; color:var(--muted); }
.class-item-badges { display:flex; gap:6px; flex-wrap:wrap; }
.class-item-body { display:none; padding:0 12px 12px; border-top:1px dashed var(--border); font-size:12.5px; color:var(--text); }
.class-item-body.show { display:block; }
.class-item-body .row { margin: 8px 0; }
.class-item-body .row b { color: var(--muted); font-weight:600; font-size:11px; display:block; margin-bottom:2px; }
.calendar-area { display:flex; flex-direction:column; gap:6px; }
.calendar-grid { display:grid; grid-template-columns: repeat(7, 1fr); gap:4px; }
.calendar-day { border:1px solid var(--border); border-radius:8px; min-height:56px; padding:4px 6px; font-size:11px; cursor:pointer; background:#fff; }
.calendar-day.empty { visibility:hidden; }
.calendar-day.today { border-color: var(--accent); }
.calendar-day .num { font-weight:600; margin-bottom:2px; }
.calendar-day .cnt { color: var(--accent); font-size:11px; }
.calendar-day:hover { background:#f2f6fc; }
.md-right { flex:1; padding:24px 28px; overflow-y:auto; }
.md-right-empty { color:var(--muted); font-size:14px; text-align:center; margin-top:80px; }
.md-right-header { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:16px; }
.md-right-title { font-size:18px; font-weight:700; }
.md-right-sub { font-size:13px; color:var(--muted); margin-top:2px; }
.md-right-link { font-size:12px; color:var(--accent); text-decoration:none; }
.right-tabs { display:flex; gap:6px; border-bottom:1px solid var(--border); margin-bottom:16px; }
.right-tab { border:none; background:none; padding:8px 12px; font-size:13px; cursor:pointer; color:var(--muted); font-family:inherit; border-bottom:2px solid transparent; }
.right-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight:600; }
.record-card { border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:10px; background:#fbfbfa; }
.record-card .title { font-weight:600; font-size:13.5px; margin-bottom:4px; }
.record-card .meta { font-size:12px; color:var(--muted); }
.activity-row { display:flex; align-items:center; justify-content:space-between; padding:8px 10px; border-radius:8px; background:#fff; border:1px solid var(--border); margin-bottom:6px; font-size:13px; }
.student-row { display:flex; align-items:center; justify-content:space-between; padding:8px 10px; border-radius:8px; background:#fff; border:1px solid var(--border); margin-bottom:6px; font-size:13px; }
</style>
</head>
<body>

<div id="login-screen" style="display:none">
  <div class="login-card">
    <h1>🔒 관리자 로그인</h1>
    <p>학원관리 화면에 접근하려면<br>관리자 비밀번호를 입력하세요</p>
    <input type="password" id="login-input" placeholder="관리자 비밀번호" autocomplete="current-password">
    <button id="login-btn" onclick="submitLogin()">로그인</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div id="app-screen" style="display:none">
<div class="topbar">
  <div class="brand">하다 학원관리</div>
  <button class="nav-btn active" data-tab="dashboard" onclick="showTab('dashboard')">📊 대시보드</button>
  <button class="nav-btn" data-tab="admin" onclick="showTab('admin')">🗂️ 리포트 관리</button>
  <button class="nav-btn" data-tab="kiosk" onclick="showTab('kiosk')">🖊️ 키오스크</button>
  <div class="topbar-actions">
    <button onclick="topbarRefresh()">🔄 새로고침</button>
    <button onclick="topbarChangePassword()">🔑 비밀번호 변경</button>
    <button class="logout" onclick="topbarLogout()">로그아웃</button>
  </div>
</div>

<div class="modal-overlay" id="alimtalk-modal">
  <div class="modal-box">
    <h3>알림톡 발송 확인</h3>
    <p id="alimtalk-modal-text">선택된 학생에게 오늘의 학습 리포트 알림톡을 발송하시겠습니까?</p>
    <div class="modal-actions">
      <button class="cancel" onclick="closeAlimtalkModal()">취소</button>
      <button class="confirm" onclick="confirmAlimtalkSend()">발송</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<div class="layout" id="page-dashboard">
  <div class="md-left">
    <div class="md-filter-row">
      <button class="filter-tab active" data-filter="all" onclick="setFilterMode('all')">전체</button>
      <button class="filter-tab" data-filter="teacher" onclick="setFilterMode('teacher')">강사</button>
      <button class="filter-tab" data-filter="class" onclick="setFilterMode('class')">클래스</button>
    </div>
    <div class="md-filter-options" id="filter-options"></div>
    <div class="md-view-row">
      <button class="view-tab active" data-view="list" onclick="setViewMode('list')">📋 리스트 보기</button>
      <button class="view-tab" data-view="calendar" onclick="setViewMode('calendar')">📅 캘린더 보기</button>
    </div>
    <div class="md-date-nav">
      <button class="date-nav-btn" onclick="shiftDate(-1)">‹</button>
      <span class="date-nav-label" id="date-nav-label">-</span>
      <button class="date-nav-btn" onclick="shiftDate(1)">›</button>
    </div>
    <div id="status-area"></div>
    <div id="class-list-area" class="class-list-area"></div>
    <div id="calendar-area" class="calendar-area" style="display:none"></div>
  </div>
  <div class="md-right">
    <div class="md-right-empty" id="md-right-empty">👈 왼쪽에서 수업을 선택하면 상세정보가 표시돼요</div>
    <div class="md-right-content" id="md-right-content" style="display:none">
      <div class="md-right-header">
        <div>
          <div class="md-right-title" id="right-title"></div>
          <div class="md-right-sub" id="right-sub"></div>
        </div>
        <a class="md-right-link" id="right-page-link" target="_blank" href="#">노션에서 보기 ↗</a>
      </div>
      <div class="right-tabs">
        <button class="right-tab active" data-tab="students" onclick="setRightTab('students')">👥 학생</button>
        <button class="right-tab" data-tab="record" onclick="setRightTab('record')">📖 학습기록</button>
        <button class="right-tab" data-tab="assignment" onclick="setRightTab('assignment')">📝 과제</button>
        <button class="right-tab" data-tab="evaluation" onclick="setRightTab('evaluation')">✅ 평가</button>
      </div>
      <div class="right-tab-body" id="right-tab-body"></div>
    </div>
  </div>
</div>

<div id="page-iframe" style="display:none; height: calc(100vh - 52px);">
  <iframe id="embed-frame" style="width:100%; height:100%; border:none;"></iframe>
</div>

</div>

<script>
// ============ 공용 로그인 (admin.html과 같은 localStorage 키를 사용해 한 번만 로그인하면 됩니다) ============
const ADMIN_KEY_STORAGE = "admin_key"
function getAdminKey() { return localStorage.getItem(ADMIN_KEY_STORAGE) || "" }
function showLoginScreen(errorMsg) {
  document.getElementById("login-screen").style.display = "flex"
  document.getElementById("app-screen").style.display = "none"
  document.getElementById("login-error").textContent = errorMsg || ""
  document.getElementById("login-input").value = ""
  setTimeout(() => document.getElementById("login-input").focus(), 50)
}
function showAppScreen() {
  document.getElementById("login-screen").style.display = "none"
  document.getElementById("app-screen").style.display = "block"
  loadDashboard()
}
async function submitLogin() {
  const input = document.getElementById("login-input")
  const key = input.value.trim()
  const btn = document.getElementById("login-btn")
  const errEl = document.getElementById("login-error")
  if (!key) { errEl.textContent = "비밀번호를 입력하세요."; return }
  btn.disabled = true
  btn.textContent = "확인 중..."
  errEl.textContent = ""
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/list-students`, {
      headers: {
        "x-admin-key": key,
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        "apikey": SUPABASE_ANON_KEY,
      },
    })
    if (res.status === 401) {
      errEl.textContent = "비밀번호가 올바르지 않습니다."
      btn.disabled = false
      btn.textContent = "로그인"
      return
    }
    if (!res.ok) throw new Error(`서버 오류: ${res.status}`)
    localStorage.setItem(ADMIN_KEY_STORAGE, key)
    showAppScreen()
  } catch (err) {
    errEl.textContent = "로그인에 실패했습니다: " + err.message
  } finally {
    btn.disabled = false
    btn.textContent = "로그인"
  }
}
document.getElementById("login-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") submitLogin()
})
// ============ 기존 설정 ============
// ============ 설정 (배포 전 채워넣으세요) ============
const SUPABASE_URL = "https://twczhsxybkcvjkdfdxvs.supabase.co"
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3Y3poc3h5YmtjdmprZGZkeHZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyOTcwMDQsImV4cCI6MjEwMzg3MzAwNH0.t7Ltb_iSYqE4gHSoGSm-OlpiLjGqIcgrhzGJ-t56EDc" // admin.html에서 쓰는 anon key와 동일한 값으로 교체
const FUNCTION_URL = SUPABASE_URL + "/functions/v1/get-admin-dashboard"
const SEND_DAILY_REPORT_URL = SUPABASE_URL + "/functions/v1/send-daily-report"
const TAB_PAGES = { admin: "admin.html", kiosk: "attendance_kiosk.html" }
// =============================================================

let CURRENT_TAB = "dashboard"

function showTab(tab) {
  CURRENT_TAB = tab
  document.querySelectorAll(".nav-btn").forEach(function (btn) {
    btn.classList.toggle("active", btn.dataset.tab === tab)
  })
  const dashboardPage = document.getElementById("page-dashboard")
  const iframePage = document.getElementById("page-iframe")
  const frame = document.getElementById("embed-frame")
  if (tab === "dashboard") {
    dashboardPage.style.display = "flex"
    iframePage.style.display = "none"
    frame.src = "about:blank"
  } else {
    dashboardPage.style.display = "none"
    iframePage.style.display = "block"
    if (frame.getAttribute("src") !== TAB_PAGES[tab]) {
      frame.src = TAB_PAGES[tab]
    }
  }
}

// ---------------- 상단 공용 새로고침 / 비밀번호 변경 / 로그아웃 ----------------
// 리포트 관리 화면에만 있던 이 3가지 동작을 상단 메뉴로 옮겨, 어느 탭에 있든 바로 쓸 수 있게 합니다.
function topbarRefresh() {
  if (CURRENT_TAB === "dashboard") {
    loadDashboard()
    return
  }
  const frame = document.getElementById("embed-frame")
  const win = frame.contentWindow
  if (win && typeof win.loadStudents === "function") {
    win.loadStudents()
  } else if (win) {
    frame.src = frame.src
  }
}

function topbarChangePassword() {
  const openModal = () => {
    const frame = document.getElementById("embed-frame")
    const win = frame.contentWindow
    if (win && typeof win.openPasswordModal === "function") {
      win.openPasswordModal()
    }
  }
  if (CURRENT_TAB !== "admin") {
    showTab("admin")
    const frame = document.getElementById("embed-frame")
    frame.addEventListener("load", openModal, { once: true })
  } else {
    openModal()
  }
}

function topbarLogout() {
  localStorage.removeItem(ADMIN_KEY_STORAGE)
  location.reload()
}

// ============ 마스터-디테일 (좌: 수업 리스트/캘린더, 우: 수업 상세) ============
const GET_CLASSES_URL = SUPABASE_URL + "/functions/v1/get-classes"
const GET_CLASS_DETAIL_URL = SUPABASE_URL + "/functions/v1/get-class-detail"

const statusBadgeClass = {
  "🟢출석": "green",
  "🔵보강": "blue",
  "🔴결석": "red",
}

function el(id) { return document.getElementById(id) }

function esc(s) {
  if (s === null || s === undefined) return ""
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  })
}

function showToast(msg) {
  const t = document.getElementById("toast")
  t.textContent = msg
  t.classList.add("show")
  setTimeout(function () { t.classList.remove("show") }, 1800)
}

function setStatus(type, message) {
  const area = el("status-area")
  if (!type) { area.innerHTML = ""; return }
  area.innerHTML = '<div class="status-banner ' + type + '">' + message + '</div>'
}

function kstToday() {
  return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul" }).format(new Date())
}

let VIEW_MODE = "list"
let FILTER_MODE = "all"
let FILTER_VALUE = null
let CURRENT_DATE = kstToday()
let CURRENT_MONTH = CURRENT_DATE.slice(0, 7)
let CLASSES = []
let SELECTED_CLASS_ID = null
let EXPANDED_CLASS_ID = null
let RIGHT_TAB = "students"
let CLASS_DETAIL_CACHE = {}

function formatDateLabel(dateStr) {
  const d = new Date(dateStr + "T00:00:00+09:00")
  const days = ["일","월","화","수","목","금","토"]
  return dateStr.replace(/-/g, ".") + " (" + days[d.getDay()] + ")"
}

function setFilterMode(mode) {
  FILTER_MODE = mode
  FILTER_VALUE = null
  document.querySelectorAll(".filter-tab").forEach(function (b) { b.classList.toggle("active", b.dataset.filter === mode) })
  renderFilterOptions()
  renderClassList()
}

function renderFilterOptions() {
  const optArea = el("filter-options")
  if (FILTER_MODE === "all") { optArea.innerHTML = ""; return }
  const key = FILTER_MODE === "teacher" ? "teacherName" : "className"
  const names = Array.from(new Set(CLASSES.map(function (c) { return c[key] }).filter(Boolean)))
  if (names.length === 0) { optArea.innerHTML = '<span class="empty">해당 항목이 없어요</span>'; return }
  optArea.innerHTML = names.map(function (name) {
    return '<button class="filter-option' + (FILTER_VALUE === name ? " active" : "") + '" onclick="selectFilterValue(' + JSON.stringify(name) + ')">' + esc(name) + '</button>'
  }).join("")
}

function selectFilterValue(name) {
  FILTER_VALUE = (FILTER_VALUE === name) ? null : name
  renderFilterOptions()
  renderClassList()
}

function setViewMode(mode) {
  VIEW_MODE = mode
  document.querySelectorAll(".view-tab").forEach(function (b) { b.classList.toggle("active", b.dataset.view === mode) })
  el("class-list-area").style.display = mode === "list" ? "flex" : "none"
  el("calendar-area").style.display = mode === "calendar" ? "flex" : "none"
  if (mode === "list") {
    loadClassList(CURRENT_DATE)
  } else {
    loadClassCalendar(CURRENT_MONTH)
  }
}

function shiftDate(delta) {
  if (VIEW_MODE === "list") {
    const d = new Date(CURRENT_DATE + "T00:00:00+09:00")
    d.setDate(d.getDate() + delta)
    CURRENT_DATE = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul" }).format(d)
    loadClassList(CURRENT_DATE)
  } else {
    const parts = CURRENT_MONTH.split("-").map(Number)
    const y = parts[0], m = parts[1]
    const d = new Date(y, m - 1 + delta, 1)
    CURRENT_MONTH = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0")
    loadClassCalendar(CURRENT_MONTH)
  }
}

async function loadClassList(dateStr) {
  setStatus("loading", "수업 목록을 불러오는 중이에요...")
  el("date-nav-label").textContent = formatDateLabel(dateStr)
  try {
    const res = await fetch(GET_CLASSES_URL + "?date=" + dateStr, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY, "x-admin-key": getAdminKey() || "" },
    })
    const data = await res.json()
    if (!res.ok) throw new Error(data.error || ("HTTP " + res.status))
    CLASSES = data.classes || []
    renderFilterOptions()
    renderClassList()
    setStatus(null)
  } catch (err) {
    setStatus("error", "불러오기 실패: " + err.message)
  }
}

function filteredClasses() {
  if (FILTER_MODE === "all" || !FILTER_VALUE) return CLASSES
  const key = FILTER_MODE === "teacher" ? "teacherName" : "className"
  return CLASSES.filter(function (c) { return c[key] === FILTER_VALUE })
}

function renderClassList() {
  const listEl = el("class-list-area")
  const list = filteredClasses()
  if (list.length === 0) {
    listEl.innerHTML = '<div class="empty">해당 날짜에 수업이 없어요</div>'
    return
  }
  listEl.innerHTML = list.map(function (c) {
    const expanded = EXPANDED_CLASS_ID === c.id
    const selected = SELECTED_CLASS_ID === c.id
    return '<div class="class-item' + (selected ? " selected" : "") + '" data-id="' + c.id + '">' +
      '<div class="class-item-head" onclick="onClassClick(' + JSON.stringify(c.id) + ')">' +
        '<div class="class-item-title-row"><span class="class-item-title">' + esc(c.className) + '</span><span class="class-item-time">' + esc(c.timeRange || "") + '</span></div>' +
        '<div class="class-item-badges">' +
          (c.teacherName ? '<span class="badge gray">' + esc(c.teacherName) + '</span>' : "") +
          (c.method ? '<span class="badge blue">' + esc(c.method) + '</span>' : "") +
          (c.attendanceRate ? '<span class="badge green">출석 ' + esc(c.attendanceRate) + '</span>' : "") +
        '</div>' +
      '</div>' +
      '<div class="class-item-body' + (expanded ? " show" : "") + '">' +
        '<div class="row"><b>출석현황</b>' + esc(c.attendanceStatus || "-") + '</div>' +
        '<div class="row"><b>학습 내용</b>' + esc(c.studySummary || "-") + '</div>' +
        '<div class="row"><b>과제 안내</b>' + esc(c.assignmentSummary || "-") + '</div>' +
        '<div class="row"><b>평가 결과</b>' + esc(c.evaluationSummary || "-") + '</div>' +
        '<button class="bulk-send-btn" onclick="sendBulkForClass(' + JSON.stringify(c.id) + ')">📩 보고서 일괄 전송</button>' +
      '</div>' +
    '</div>'
  }).join("")
}

function onClassClick(id) {
  EXPANDED_CLASS_ID = (EXPANDED_CLASS_ID === id) ? null : id
  selectClass(id)
  renderClassList()
}

function findClass(id) { return CLASSES.find(function (c) { return c.id === id }) }

function selectClass(id) {
  SELECTED_CLASS_ID = id
  const c = findClass(id)
  if (!c) return
  el("md-right-empty").style.display = "none"
  el("md-right-content").style.display = "block"
  el("right-title").textContent = c.className
  el("right-sub").textContent = [c.teacherName, c.method, c.timeRange].filter(Boolean).join(" · ")
  el("right-page-link").href = c.url
  setRightTab(RIGHT_TAB, true)
}

function setRightTab(tab, force) {
  if (RIGHT_TAB === tab && !force) return
  RIGHT_TAB = tab
  document.querySelectorAll(".right-tab").forEach(function (b) { b.classList.toggle("active", b.dataset.tab === tab) })
  renderRightTabBody()
}

function renderRightTabBody() {
  const c = findClass(SELECTED_CLASS_ID)
  const body = el("right-tab-body")
  if (!c) { body.innerHTML = ""; return }
  if (RIGHT_TAB === "students") {
    renderStudentsTab(c, body)
  } else if (RIGHT_TAB === "record") {
    body.innerHTML = '<div class="record-card"><div class="title">📖 학습 내용</div><div class="meta">' + esc(c.studySummary || "등록된 내용이 없어요") + '</div></div>'
  } else if (RIGHT_TAB === "assignment" || RIGHT_TAB === "evaluation") {
    renderTaskTab(c, body, RIGHT_TAB)
  }
}

function renderStudentsTab(c, body) {
  const students = c.students || []
  if (students.length === 0) { body.innerHTML = '<div class="empty">출석 기록이 없어요</div>'; return }
  body.innerHTML = students.map(function (s, i) {
    const cls = statusBadgeClass[s.status] || "gray"
    const canSend = !!s.attendanceId
    return '<div class="student-row"><span><a href="' + s.url + '" target="_blank">' + esc(s.name) + '</a> ' +
      (s.status ? '<span class="badge ' + cls + '">' + s.status + '</span>' : "") + '</span>' +
      '<button class="send-btn" id="stu-send-' + i + '" onclick="sendStudentReport(' + i + ')" ' + (canSend ? "" : "disabled") + '>📩 전송</button></div>'
  }).join("")
}

async function fetchClassDetail(classId) {
  if (CLASS_DETAIL_CACHE[classId]) return CLASS_DETAIL_CACHE[classId]
  const res = await fetch(GET_CLASS_DETAIL_URL, {
    method: "POST",
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY, "Content-Type": "application/json", "x-admin-key": getAdminKey() || "" },
    body: JSON.stringify({ classSessionId: classId }),
  })
  const data = await res.json()
  if (!res.ok) throw new Error(data.error || ("HTTP " + res.status))
  CLASS_DETAIL_CACHE[classId] = data
  return data
}

async function renderTaskTab(c, body, kind) {
  body.innerHTML = '<div class="empty">불러오는 중...</div>'
  try {
    const data = await fetchClassDetail(c.id)
    const group = kind === "assignment" ? data.assignments : data.evaluations
    const records = (group && group.records) || []
    const activities = (group && group.activities) || []
    let html = ""
    if (records.length === 0) {
      html += '<div class="empty">등록된 ' + (kind === "assignment" ? "과제" : "평가") + ' 설명이 없어요</div>'
    } else {
      html += records.map(function (r) {
        return '<div class="record-card"><div class="title"><a href="' + r.url + '" target="_blank">' + esc(r.title) + '</a></div>' +
          '<div class="meta">교재: ' + esc(r.book) + (r.range ? " · 범위: " + esc(r.range) : "") + '</div>' +
          (r.content ? '<div class="meta" style="margin-top:4px">' + esc(r.content) + '</div>' : "") +
          '</div>'
      }).join("")
    }
    if (activities.length === 0) {
      html += '<div class="empty">학생별 학습 활동이 없어요</div>'
    } else {
      html += activities.map(function (a) {
        const scoreText = kind === "evaluation" && a.score != null ? (a.score + "점 (" + a.correctCount + "/" + a.totalCount + ")") : ""
        const statusText = kind === "assignment" ? (a.assignmentStatus || "") : ""
        const cls = statusText.indexOf("제출") >= 0 ? "green" : statusText ? "red" : "gray"
        return '<div class="activity-row"><span><a href="' + a.url + '" target="_blank">' + esc(a.studentName) + '</a></span>' +
          '<span>' + (statusText ? '<span class="badge ' + cls + '">' + esc(statusText) + '</span>' : "") + (scoreText ? '<span class="badge blue">' + esc(scoreText) + '</span>' : "") + '</span></div>'
      }).join("")
    }
    body.innerHTML = html
  } catch (err) {
    body.innerHTML = '<div class="empty">불러오기 실패: ' + esc(err.message) + '</div>'
  }
}

// ---------------- 캘린더(월간) 보기 ----------------
async function loadClassCalendar(monthStr) {
  setStatus("loading", "캘린더를 불러오는 중이에요...")
  el("date-nav-label").textContent = monthStr.replace("-", ".")
  try {
    const res = await fetch(GET_CLASSES_URL + "?month=" + monthStr, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY, "x-admin-key": getAdminKey() || "" },
    })
    const data = await res.json()
    if (!res.ok) throw new Error(data.error || ("HTTP " + res.status))
    CLASSES = data.classes || []
    renderFilterOptions()
    renderCalendar(monthStr)
    setStatus(null)
  } catch (err) {
    setStatus("error", "불러오기 실패: " + err.message)
  }
}

function renderCalendar(monthStr) {
  const list = filteredClasses()
  const countByDay = {}
  list.forEach(function (c) {
    if (!c.date) return
    const day = c.date.slice(0, 10)
    countByDay[day] = (countByDay[day] || 0) + 1
  })
  const parts = monthStr.split("-").map(Number)
  const y = parts[0], m = parts[1]
  const first = new Date(y, m - 1, 1)
  const startWeekday = first.getDay()
  const daysInMonth = new Date(y, m, 0).getDate()
  const today = kstToday()
  let cells = ""
  for (let i = 0; i < startWeekday; i++) cells += '<div class="calendar-day empty"></div>'
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = monthStr + "-" + String(d).padStart(2, "0")
    const cnt = countByDay[dateStr] || 0
    cells += '<div class="calendar-day' + (dateStr === today ? " today" : "") + '" onclick="goToDateFromCalendar(' + JSON.stringify(dateStr) + ')">' +
      '<div class="num">' + d + '</div>' + (cnt ? '<div class="cnt">' + cnt + '건</div>' : "") + '</div>'
  }
  el("calendar-area").innerHTML = '<div class="calendar-grid">' + cells + '</div>'
}

function goToDateFromCalendar(dateStr) {
  CURRENT_DATE = dateStr
  setViewMode("list")
  document.querySelector('.view-tab[data-view="list"]').classList.add("active")
  document.querySelector('.view-tab[data-view="calendar"]').classList.remove("active")
}

// ---------------- 알림톡 발송 ----------------
async function callSendDailyReport(payload) {
  const res = await fetch(SEND_DAILY_REPORT_URL, {
    method: "POST",
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY, "Content-Type": "application/json", "x-admin-key": getAdminKey() || "" },
    body: JSON.stringify(payload),
  })
  const data = await res.json().catch(function () { return {} })
  if (!res.ok) throw new Error(data.error || ("HTTP " + res.status))
  return data
}

async function sendStudentReport(i) {
  const c = findClass(SELECTED_CLASS_ID)
  if (!c) return
  const s = (c.students || [])[i]
  if (!s || !s.attendanceId) return
  const btn = el("stu-send-" + i)
  if (btn) { btn.disabled = true; btn.textContent = "발송중..." }
  try {
    await callSendDailyReport({ registrationId: s.registrationId, attendanceId: s.attendanceId })
    showToast(esc(s.name) + "에게 알림톡을 발송했어요")
  } catch (err) {
    showToast("발송 실패: " + err.message)
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "📩 전송" }
  }
}

async function sendBulkForClass(classId) {
  const c = findClass(classId)
  if (!c) return
  const targets = (c.students || []).filter(function (s) { return s.attendanceId })
  if (targets.length === 0) { showToast("전송할 학생이 없어요"); return }
  let success = 0, fail = 0
  for (const s of targets) {
    try {
      await callSendDailyReport({ registrationId: s.registrationId, attendanceId: s.attendanceId })
      success++
    } catch (_e) {
      fail++
    }
  }
  showToast(success + "건 발송 완료" + (fail ? ", " + fail + "건 실패" : ""))
}

// ---------------- 초기 로딩 ----------------
function loadDashboard() {
  if (VIEW_MODE === "list") loadClassList(CURRENT_DATE)
  else loadClassCalendar(CURRENT_MONTH)
}

if (getAdminKey()) {
  showAppScreen()
} else {
  showLoginScreen()
}
</script>
