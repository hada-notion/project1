async function loadClassList(dateStr) {
  el("date-nav-label").textContent = formatDateLabel(dateStr)
  const cached = CLASS_LIST_CACHE[dateStr]
  if (cached) {
    // 이미 본 날짜는 캐시된 내용을 바로 보여주고, 뒤에서 최신 데이터로 조용히 갱신해요.
    // 이전 날짜에 선택된 수업 상세가 그대로 남아있지 않도록 오른쪽 패널을 함께 비워요.
    CLASSES = cached
    renderClassList()
    clearRightPanel()
    refreshClassList(dateStr, true)
    return
  }
  CLASSES = []
  el("class-list-area").innerHTML = '<div class="loading">불러오는 중...</div>'
  clearRightPanel()
  await refreshClassList(dateStr, false)
}

async function refreshClassList(dateStr, silent) {
  // 수업 카드는 fast=1로 학생 정보 없이 빠르게만 받아오고, 학생 정보는 사용자가 수업을 클릭할 때마다 개별적으로 불러와요(prioritizeSelectedClassStudents).
  // 이렇게 하면 하나의 날짜 요청이 그날 전체 수업의 학생을 한꺼번에 불러오지 않아서, 선택하지 않은 수업은 계속 "불러오는 중"으로 남아있어요.
  try {
    const fastRes = await fetch(GET_CLASSES_URL + "?date=" + dateStr + "&fast=1", {
      cache: "no-store",
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY, "x-admin-key": getAdminKey() || "" },
    })
    const fastData = await fastRes.json()
    if (!fastRes.ok) throw new Error(fastData.error || ("HTTP " + fastRes.status))
    const fastClasses = fastData.classes || []
    fastClasses.forEach(function (c) {
      rememberClassEmoji(c.id, c)
      // 이미 개별적으로 불러온 수업이면(SESSION_STUDENTS_CACHE) 학생 정보를 그대로 이어붙여서 다시 "불러오는 중"으로 되돌아가지 않게 해요.
      if (SESSION_STUDENTS_CACHE[c.id]) Object.assign(c, SESSION_STUDENTS_CACHE[c.id])
    })
    CLASS_LIST_CACHE[dateStr] = fastClasses
    if (dateStr !== CURRENT_DATE || DOMAIN !== "class") return
    CLASSES = fastClasses
    renderClassList()
    // 이미 선택된 수업이 있고 아직 학생 정보가 없으면(students === null) 우선적으로 이어서 불러와요.
    if (SELECTED_CLASS_ID && findClass(SELECTED_CLASS_ID)) {
      selectClass(SELECTED_CLASS_ID)
      prioritizeSelectedClassStudents(SELECTED_CLASS_ID)
    } else {
      // 선택된 수업이 없으면, 뒤에서 조용히 그날 전체 수업의 학생 정보를 미리 불러와요.
      backgroundPrefetchAllStudents(dateStr)
    }
  } catch (err) {
    if (!silent && dateStr === CURRENT_DATE && DOMAIN === "class" && !CLASSES.length) {
      el("class-list-area").innerHTML = '<div class="empty">불러오기 실패: ' + esc(err.message) + '<br><button class="retry-btn" onclick="refreshClassList(CURRENT_DATE, false)">다시 시도</button></div>'
    }
  }
}

function filteredClasses() {
  if (!SEARCH_TERM) return CLASSES
  return CLASSES.filter(function (c) {
    const hay = [c.className, c.teacherName, c.method, c.studySummary, c.assignmentSummary, c.evaluationSummary]
      .concat((c.students || []).map(function (s) { return s.name }))
      .filter(Boolean).join(" ").toLowerCase()
    return hay.indexOf(SEARCH_TERM) >= 0
  })
}

function classEmoji(c) {
  // 노션 클래스(학원) DB의 "이모지" 속성 값을 그대로 사용해요. 백엔드가 emoji 필드를 안 내려주는 동안만 학년별 기본값으로 대체해요.
  if (c && c.emoji) return c.emoji
  const n = String((c && c.className) || "")
  if (n.indexOf("고") >= 0) return "🎓"
  if (n.indexOf("중") >= 0) return "📘"
  if (n.indexOf("초") >= 0) return "🐣"
  return "📚"
}

// 수업 탭에서 조회한 클래스의 실제 이모지를 classId 기준으로 기억해둠다가,
// 보고서/수강료 탭처럼 클래스 목록을 직접 내려주지 않는 화면에서도 같은 이모지를 재사용해요.
const CLASS_EMOJI_MAP = {}
function rememberClassEmoji(classId, c) {
  if (!classId) return
  const emoji = classEmoji(c)
  if (emoji) CLASS_EMOJI_MAP[classId] = emoji
}
function resolveClassEmoji(classId, className, directEmoji) {
  if (directEmoji) {
    if (classId) CLASS_EMOJI_MAP[classId] = directEmoji
    return directEmoji
  }
  if (classId && CLASS_EMOJI_MAP[classId]) return CLASS_EMOJI_MAP[classId]
  return classEmoji({ className: className })
}

function teacherColorClass(name) {
  const palette = ["tb-gray", "tb-brown", "tb-orange", "tb-yellow", "tb-green", "tb-blue", "tb-purple", "tb-pink", "tb-red"]
  const s = String(name || "")
  let hash = 0
  for (let i = 0; i < s.length; i++) hash = (hash * 31 + s.charCodeAt(i)) >>> 0
  return palette[hash % palette.length]
}

function parseAttendanceRate(raw) {
  if (!raw) return null
  const m = String(raw).match(/(\d+)\s*%\s*(\([^)]*\))?/)
  if (!m) return null
  return { pct: Number(m[1]), text: "출석률 " + m[1] + "%" + (m[2] ? " " + m[2] : "") }
}

// parses "82점" text into 82. returns null for "평가 없음".
function parseScoreText(raw) {
  if (!raw) return null
  const m = String(raw).match(/(\d+(?:\.\d+)?)\s*점/)
  if (!m) return null
  return Number(m[1])
}

function attendanceRateTone(pct) {
  if (pct >= 100) return "tone-blue"
  if (pct >= 90) return "tone-green"
  if (pct >= 70) return "tone-yellow"
  if (pct >= 50) return "tone-orange"
  return "tone-red"
}

// 가운데 목록은 여러 수업을 한눈에 봐서 선택만 하는 용도다. 상세 내용은 오른쪽 패널에서 다룹니다.
function renderClassList() {
  const listEl = el("class-list-area")
  const list = filteredClasses()
  if (list.length === 0) {
    listEl.innerHTML = '<div class="empty">해당 날짜에 수업이 없어요</div>'
    return
  }
  listEl.innerHTML = list.map(function (c) {
    const selected = SELECTED_CLASS_ID === c.id
    const rate = parseAttendanceRate(c.attendanceRate)
    return '<div class="class-item' + (selected ? " selected" : "") + '" data-id="' + c.id + '">' +
      '<div class="class-item-head" onclick="onClassClick(' + attrSafe(c.id) + ')">' +
        '<div class="class-item-title-row"><span class="class-item-title">' + classEmoji(c) + ' ' + esc(c.className) + '</span><span class="class-item-time">' + esc(c.timeRange || "") + '</span></div>' +
        '<div class="class-item-badges">' +
          (c.teacherName ? '<span class="teacher-badge ' + teacherColorClass(c.teacherName) + '">' + esc(c.teacherName) + '</span>' : "") +
          (c.method ? '<span class="badge blue">' + esc(c.method) + '</span>' : "") +
          (rate ? '<span class="rate-badge ' + attendanceRateTone(rate.pct) + '">' + esc(rate.text) + '</span>' : "") +
        '</div>' +
      '</div>' +
    '</div>'
  }).join("")
}

function onClassClick(id) {
  const prevId = SELECTED_CLASS_ID
  selectClass(id)
  const listEl = el("class-list-area")
  if (listEl && prevId !== id) {
    if (prevId) { const prevEl = listEl.querySelector('.class-item[data-id="' + prevId + '"]'); if (prevEl) prevEl.classList.remove("selected") }
    const nextEl = listEl.querySelector('.class-item[data-id="' + id + '"]')
    if (nextEl) nextEl.classList.add("selected")
  }
  // 선택한 수업의 학생 정보가 아직 없으면(students === null, fast 단계에서만 온 카드), 그날 전체 수업 목록을 다 기다리지 않고
  // 이 수업 하나만 우선적으로 불러와서 오른쪽 패널에 반영해요.
  prioritizeSelectedClassStudents(id)
}

// 여러 곳(우선 로딩, 백그라운드 프리페치)에서 같은 수업을 동시에 요청해도 네트워크 요청이 하나만 나가도록 공유해요.
function fetchSessionStudentsOnce(id) {
  if (SESSION_STUDENTS_CACHE[id]) return Promise.resolve(SESSION_STUDENTS_CACHE[id])
  if (STUDENTS_FETCH_PROMISES[id]) return STUDENTS_FETCH_PROMISES[id]
  const p = fetch(GET_CLASSES_URL + "?date=" + CURRENT_DATE + "&sessionId=" + encodeURIComponent(id), {
    cache: "no-store",
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY, "x-admin-key": getAdminKey() || "" },
  }).then(function (res) {
    return res.json().then(function (data) {
      if (!res.ok) throw new Error(data.error || ("HTTP " + res.status))
      return data
    })
  }).then(function (data) {
    const fresh = (data.classes || [])[0]
    if (!fresh) return null
    // 백엔드가 노션 출석 페이지의 "전송 완료" 속성을 읽어서 내려준 sentBy 값으로
    // sentByMe를 초기화해서, 새로고침해도(이 함수를 다시 호출해도) 전송완료 배지가 유지되게 해요.
    if (fresh.students) {
      fresh.students.forEach(function (s) { s.sentByMe = !!s.sentBy })
    }
    // 이 수업은 이제 개별적으로 다 불러왔으니, 같은 날짜로 다시 돌아와도(fast 카드 재조회) "불러오는 중"으로 되돌아가지 않게 보관해놓아요.
    SESSION_STUDENTS_CACHE[id] = fresh
    const idx = CLASSES.findIndex(function (x) { return x.id === id })
    if (idx !== -1) CLASSES[idx] = Object.assign({}, CLASSES[idx], fresh)
    const cached = CLASS_LIST_CACHE[CURRENT_DATE]
    if (cached) {
      const cIdx = cached.findIndex(function (x) { return x.id === id })
      if (cIdx !== -1) cached[cIdx] = Object.assign({}, cached[cIdx], fresh)
    }
    return fresh
  }).finally(function () {
    delete STUDENTS_FETCH_PROMISES[id]
  })
  STUDENTS_FETCH_PROMISES[id] = p
  return p
}

// 선택한 수업 하나의 학생 정보만 골라 미리 불러와요(그날 전체 수업 목록을 기다릴 필요 없이 바로 학생 목록이 채워짐).
async function prioritizeSelectedClassStudents(id) {
  const c = findClass(id)
  if (!c || c.students != null) return // 이미 학생 정보가 있으면(개별 로딩 완료 또는 빈 배열) 따로 요청하지 않아요.
  try {
    const fresh = await fetchSessionStudentsOnce(id)
    if (!fresh) return
    if (SELECTED_CLASS_ID === id) selectClass(id)
  } catch (err) {
    console.error("선택 수업 개별 로딩 실패:", err)
    if (SELECTED_CLASS_ID === id) showToast("학생 정보를 불러오지 못했어요. 다시 선택해 보세요.")
  }
}

// 선택된 수업이 없을 때, 뒤에서 조용히 그날 전체 수업의 학생 정보를 하나씩 미리 불러와요.
// 사용자가 나중에 아무 수업이나 클릭해도 이미 캐시된 학생 정보가 바로 나오도록 하기 위함이에요.
// 도중에 사용자가 수업을 선택해도 fetchSessionStudentsOnce가 요청을 공유하므로 중복 요청 없이 그대로 이어받아요.
async function backgroundPrefetchAllStudents(dateStr) {
  const token = ++BACKGROUND_PREFETCH_TOKEN
  const ids = CLASSES.map(function (c) { return c.id })
  for (let i = 0; i < ids.length; i++) {
    // 다른 날짜로 이동했거나, 새 프리페치가 시작되었거나, 화면이 수업 탭을 벗어난 경우 중단해요.
    if (token !== BACKGROUND_PREFETCH_TOKEN || dateStr !== CURRENT_DATE || DOMAIN !== "class") return
    const id = ids[i]
    const c = findClass(id)
    if (!c || c.students != null) continue // 이미 불러온 수업(선택으로 먼저 불러온 경우 포함)은 건너뛰어요.
    try {
      const fresh = await fetchSessionStudentsOnce(id)
      if (fresh && SELECTED_CLASS_ID === id) selectClass(id) // 프리페치 도중에 마침 이 수업을 선택했으면 화면을 채워줘요.
    } catch (err) {
      console.error("백그라운드 학생 정보 미리 불러오기 실패:", id, err)
      // 한 수업이 실패해도 전체 프리페치가 멈추지 않고 다음 수업으로 계속 진행해요.
    }
  }
}

function findClass(id) { return CLASSES.find(function (c) { return c.id === id }) }

function classSendSummaryBadge(c) {
  const students = c.students || []
  const eligible = students.filter(function (s) { return s.attendanceId })
  if (!eligible.length) return ""
  const sentCount = eligible.filter(function (s) { return s.sentByMe }).length
  const pct = Math.round((sentCount / eligible.length) * 100)
  const tone = pct >= 100 ? "tone-blue" : pct <= 0 ? "tone-gray" : "tone-orange"
  return ' <span class="badge ' + tone + '">발송 ' + sentCount + '/' + eligible.length + '명</span>'
}

function renderClassRightSub(c) {
  el("right-sub").innerHTML =
    (c.teacherName ? '<span class="teacher-badge ' + teacherColorClass(c.teacherName) + '">' + esc(c.teacherName) + '</span>' : "") +
    (c.method ? '<span class="badge blue">' + esc(c.method) + '</span>' : "") +
    (function () { const r = parseAttendanceRate(c.attendanceRate); return r ? '<span class="rate-badge ' + attendanceRateTone(r.pct) + '">' + esc(r.text) + '</span>' : "" })() +
    classSendSummaryBadge(c)
}

function selectClass(id) {
  if (SELECTED_CLASS_ID !== id) { STUDENT_SEARCH_TERM = ""; STUDENT_SORT_NAME_ASC = false; SELECTED_STUDENT_IDS = {} }
  SELECTED_CLASS_ID = id
  const c = findClass(id)
  if (!c) return
  el("md-right-empty").style.display = "none"
  el("md-right-content").style.display = "block"
  el("right-title").textContent = classEmoji(c) + " " + c.className
  el("right-time").textContent = (CURRENT_DATE ? CURRENT_DATE.replace(/-/g, ".") + " " : "") + (c.timeRange || "")
  renderClassRightSub(c)
  el("right-page-link").href = c.url
  el("right-summary-toggle").style.display = "inline-flex"
  const stat = summarizeStudents(c.students)
  el("right-summary-body").innerHTML =
    '<div class="summary-two-col">' +
      '<div class="info-card half"><h3>✅ 출석 현황</h3>' +
        '<div class="stat-row stat-text green">등�� <b>' + stat.attend + '</b>명</div>' +
        '<div class="stat-row stat-text blue">보강 <b>' + stat.makeup + '</b>명</div>' +
        '<div class="stat-row stat-text red">결석 <b>' + stat.absent + '</b>명</div>' +
      '</div>' +
      '<div class="info-card half"><h3>📝 과제 현황</h3>' +
        '<div class="stat-row stat-text green">완료 <b>' + stat.done + '</b>명</div>' +
        '<div class="stat-row stat-text orange">일부완료 <b>' + stat.partial + '</b>명</div>' +
        '<div class="stat-row stat-text red">미완료 <b>' + stat.none + '</b>명</div>' +
      '</div>' +
    '</div>' +
    '<div class="info-card"><h3>📖 학습 내용</h3>' + formatSummaryBlock(c.studySummary) + '</div>' +
    '<div class="info-card"><h3>📝 과제 안내</h3><div class="info-content" id="summary-assignment-body">불러오는 중...</div></div>' +
    '<div class="info-card"><h3>📄 평가 결과</h3><div class="info-content" id="summary-evaluation-body">불러오는 중...</div></div>'
  loadSummaryRecordDetails(c)
  el("bulk-send-tab-btn").style.display = "inline-flex"
  el("bulk-send-tab-btn").disabled = false
  el("right-summary-body").classList.remove("show")
  el("right-summary-toggle").classList.remove("open")
  RIGHT_SUMMARY_CLOSED_LABEL = "더보기"
  RIGHT_SUMMARY_ON_OPEN = null
  el("right-summary-toggle-label").textContent = RIGHT_SUMMARY_CLOSED_LABEL
  el("bulk-send-tab-btn").textContent = "📩 보고서 일괄 전송"
  setRightTab(RIGHT_TAB, true)
  openMobileDetail()
}

function toggleRightSummary() {
  const body = el("right-summary-body")
  const btn = el("right-summary-toggle")
  const label = el("right-summary-toggle-label")
  const open = !body.classList.contains("show")
  body.classList.toggle("show", open)
  btn.classList.toggle("open", open)
  label.textContent = open ? "접기" : RIGHT_SUMMARY_CLOSED_LABEL
  if (open && typeof RIGHT_SUMMARY_ON_OPEN === "function") RIGHT_SUMMARY_ON_OPEN()
}

function setRightTab(tab, force) {
  if (RIGHT_TAB === tab && !force) return
  RIGHT_TAB = tab
  document.querySelectorAll(".right-tab").forEach(function (b) { b.classList.toggle("active", b.dataset.tab === tab) })
  renderRightTabBody()
}

function renderRightTabBody() {
  const c = findClass(SELECTED_CLASS_ID)
  const body = el("right-tab-body")
  if (!c) { body.innerHTML = ""; return }
  // 학습기록/과제/평가 탭은 "더보기" 요약에 통합된다. 오른쪽 리스트에는 학생 목록만 남습니다.
  renderStudentsTab(c, body)
}

// 학생 목록의 출결/과제 상태를 집계해서 출석 현황·과제 현황 두 박스에 표시할 인원수를 계산해요.
function summarizeStudents(students) {
  const stat = { attend: 0, makeup: 0, absent: 0, done: 0, partial: 0, none: 0 }
  ;(students || []).forEach(function (s) {
    if (s.status === "출��") stat.attend++
    else if (s.status === "보강") stat.makeup++
    else if (s.status === "결석") stat.absent++
    if (s.homework) {
      if (s.homework.status === "완료") stat.done++
      else if (s.homework.status === "부분완료") stat.partial++
      else if (s.homework.status === "미완료") stat.none++
    }
  })
  return stat
}

// 이름뿐 아니라 학교·학년으로도 검색할 수 있도록, 학생 하나당 검색용 문자열을 만들어요.
// 백엔드가 아직 학교/학년(school/grade) 값을 안 내려주는 학생은 이름만으로 매칭돼요.
function studentSearchHaystack(s) {
  return [s.name, s.school, s.grade].filter(Boolean).join(" ").toLowerCase()
}

function studentRowHtml(c, s) {
  const allStudents = c.students || []
  const i = allStudents.indexOf(s)
  const cls = statusBadgeClass[s.status] || "gray"
  const canSend = !!s.attendanceId
  const sentBadge = canSend ? (s.sentByMe ? ' <span class="badge tone-blue">전송완료</span>' : ' <span class="badge tone-gray">미전송</span>') : ""
  const homeworkCls = s.homework ? (homeworkBadgeClass[s.homework.status] || "tone-gray") : ""
  const homeworkBadge = s.homework ? ' <span class="badge ' + homeworkCls + '">과제 ' + s.homework.status + '</span>' : ""
  const evalCls = s.evaluation ? attendanceRateTone(s.evaluation.score) : ""
  const evalTotal = s.evaluation ? pickField(s.evaluation, ["totalCount", "totalQuestions", "total"]) : null
  const evalCorrect = s.evaluation ? pickField(s.evaluation, ["correctCount", "correctQuestions", "correct"]) : null
  const evalCountText = evalTotal ? " " + (evalCorrect !== null ? evalCorrect : "?") + "/" + evalTotal : ""
  const evalBadge = s.evaluation ? ' <span class="badge ' + evalCls + '">' + s.evaluation.score + '점' + evalCountText + '</span>' : ""
  const reportLink = s.reportUrl
    ? ' <a class="report-view-link" href="' + s.reportUrl + '" target="_blank" title="학습 보고서 페이지 보기">📋</a>'
    : ' <span class="report-view-link" style="opacity:0.35;cursor:default" title="이 학생의 등록에 토큰이 아직 없어요">📋</span>'
  const checkboxHtml = canSend
    ? '<input type="checkbox" class="stu-checkbox" ' + (SELECTED_STUDENT_IDS[s.attendanceId] ? "checked" : "") + ' onchange="toggleStudentSelected(' + attrSafe(s.attendanceId) + ', this.checked)">'
    : '<input type="checkbox" class="stu-checkbox" disabled>'
  const metaLine = [s.school, s.grade].filter(Boolean).join(" · ")
  const metaHtml = metaLine ? ' <span class="stu-meta">' + esc(metaLine) + '</span>' : ""
  return '<div class="student-row"><span class="stu-name">' + checkboxHtml + ' ' + esc(s.name) + metaHtml +
    (s.url ? ' <a class="stu-view" href="' + s.url + '" target="_blank" title="노션에서 보기">' + NOTION_ICON_SVG + '</a>' : "") + reportLink + ' ' +
    (s.status ? '<span class="badge ' + cls + '">' + s.status + '</span>' : "") + homeworkBadge + evalBadge + sentBadge + '</span>' +
    '<button class="send-btn" id="stu-send-' + i + '" onclick="sendStudentReport(' + i + ')" ' + (canSend ? "" : "disabled") + '>📩 ' + (s.sentByMe ? "재전송" : "전송") + '</button></div>'
}

// 검색/정렬된 학생 행 목록만 다시 그려요. 검색창을 다시 그리지 않아서, 검색어를 입력하는 도중에도
// 입력창의 포커스와 커서 위치가 유지돼요(한글 조합 중에도 끊기지 않아요).
function buildStudentRowsHtml(c) {
  const allStudents = c.students || []
  const term = STUDENT_SEARCH_TERM.trim().toLowerCase()
  let students = term ? allStudents.filter(function (s) { return studentSearchHaystack(s).indexOf(term) >= 0 }) : allStudents.slice()
  if (STUDENT_SORT_NAME_ASC) students = students.slice().sort(function (a, b) { return String(a.name || "").localeCompare(String(b.name || ""), "ko") })
  if (students.length === 0) return '<div class="empty">검색 결과가 없어요</div>'
  return students.map(function (s) { return studentRowHtml(c, s) }).join("")
}

function renderStudentRows(c) {
  const rowsBody = el("student-rows-body")
  if (rowsBody) rowsBody.innerHTML = buildStudentRowsHtml(c)
}

function renderStudentsTab(c, body) {
  // students가 null이면 아직 물어오는 중(로딩)이라는 뜻이고, 빈 배열([])이면 실제로 출석 기록이 없다는 뜻이에요.
  if (c.students == null) { body.innerHTML = '<div class="empty">학생 정보 불러오는 중...</div>'; return }
  const allStudents = c.students || []
  if (allStudents.length === 0) { body.innerHTML = '<div class="empty">출석 기록이 없어요</div>'; return }
  const eligibleIds = allStudents.filter(function (s) { return s.attendanceId }).map(function (s) { return s.attendanceId })
  const selectedCount = eligibleIds.filter(function (id) { return SELECTED_STUDENT_IDS[id] }).length
  const allSelected = eligibleIds.length > 0 && selectedCount === eligibleIds.length
  const controlsHtml = '<div class="student-list-controls">' +
      '<label class="student-select-all"><input type="checkbox" ' + (allSelected ? "checked" : "") + ' onchange="toggleSelectAllStudents(this.checked)" ' + (eligibleIds.length ? "" : "disabled") + '> 전체 선택</label>' +
      '<button class="student-sort-btn' + (STUDENT_SORT_NAME_ASC ? " active" : "") + '" onclick="toggleStudentNameSort()">이름 ' + (STUDENT_SORT_NAME_ASC ? "▲" : "↕") + '</button>' +
      '<input type="text" class="student-search-box" placeholder="🔍 이름·학교·학년 검색" value="' + esc(STUDENT_SEARCH_TERM) + '" oninput="onStudentSearchInputDebounced(this.value)">' +
    '</div>'
  body.innerHTML = controlsHtml + '<div id="student-rows-body">' + buildStudentRowsHtml(c) + '</div>'
}

function onStudentSearchInput(term) {
  STUDENT_SEARCH_TERM = term || ""
  const c = findClass(SELECTED_CLASS_ID)
  if (c) renderStudentRows(c)
}
const onStudentSearchInputDebounced = debounce(onStudentSearchInput, 150)

function toggleStudentNameSort() {
  STUDENT_SORT_NAME_ASC = !STUDENT_SORT_NAME_ASC
  const c = findClass(SELECTED_CLASS_ID)
  if (c) renderStudentsTab(c, el("right-tab-body"))
}

function toggleStudentSelected(attendanceId, checked) {
  if (checked) SELECTED_STUDENT_IDS[attendanceId] = true
  else delete SELECTED_STUDENT_IDS[attendanceId]
  const c = findClass(SELECTED_CLASS_ID)
  if (c) renderStudentsTab(c, el("right-tab-body"))
}

function toggleSelectAllStudents(checked) {
  const c = findClass(SELECTED_CLASS_ID)
  if (!c) return
  const eligible = (c.students || []).filter(function (s) { return s.attendanceId })
  eligible.forEach(function (s) { if (checked) SELECTED_STUDENT_IDS[s.attendanceId] = true; else delete SELECTED_STUDENT_IDS[s.attendanceId] })
  renderStudentsTab(c, el("right-tab-body"))
}

// 과제/평가 탭은 수업(학원) DB의 "과제 안내"/"평가 결과" 수식 값을 그대로 보여줍니다.
// 이 값은 클래스 목록을 불러올 때 이미 함께 계산되어 있으므로, 탭을 열 때마다
// 별도로 과제 상세 페이지를 다시 불러올 필요가 없습니다(더 빠르게 표시됨).
async function fetchClassDetail(classId) {
  if (CLASS_DETAIL_CACHE[classId]) return CLASS_DETAIL_CACHE[classId]
  const res = await fetch(GET_CLASS_DETAIL_URL, {
    method: "POST",
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY, "Content-Type": "application/json", "x-admin-key": getAdminKey() || "" },
    body: JSON.stringify({ classSessionId: classId }),
  })
  const data = await res.json()
  if (!res.ok) throw new Error(data.error || ("HTTP " + res.status))
  CLASS_DETAIL_CACHE[classId] = data
  return data
}

// 여러 후보 필드명 중 값이 있는 첫 번째 필드를 그대로 반환해요.
// 백엔드 응답 필드명이 바뀌거나 통일되지 않은 경우에도 값을 놓치지 않기 위한 방어적 처리예요.
function pickField(obj, keys) {
  if (!obj) return null
  for (let i = 0; i < keys.length; i++) {
    const v = obj[keys[i]]
    if (v !== undefined && v !== null && v !== "") return v
  }
  return null
}

// 평가 탭은 우선 get-class-detail의 학습기록(평가) 레코드를 조회해서 리포트 페이지처럼 "N점 (정답/전체)" 형태로 보여주고,
// 이 정보가 없으면 기존의 "평가 결과" 요약 텍스트로 대체해요(하위 호환).
// 과제 탭은 마감일을 반영하기 위해 get-class-detail을 통해 학습기록(과제) 목록을 따로 조회합니다.
// (조금 느리지만 마감일을 다시 보여줄 수 있습니다.) 결과는 CLASS_DETAIL_CACHE에 캐싱되어 재조회를 최소화합니다.
// 보고서 페이지와 동일하게, 부가 정보는 제목 아래에 "  · 라벨: 값" 형태로 한 줄씩 통일해서 보여줘요.
function bulletLine(label, value) {
  if (value === null || value === undefined || value === "") return ""
  return '<div class="meta" style="margin-top:4px">' + esc("  • " + label + ": " + value) + '</div>'
}

// 학습 내용 요약(서식 텍스트)의 첫 줄은 제목처럼, 나머지 줄은 학습기록 카드와 같은
// NBSP 불릿("  • ")으로 보여줘서 학습기록 페이지(log-row)와 톤을 맞춰요.
function formatSummaryBlock(text) {
  const lines2 = String(text || "").split(/\n+/).map(function (s) { return s.trim() }).filter(Boolean)
  if (lines2.length === 0) return '<div class="info-content empty">기록 없음</div>'
  const title = lines2[0]
  const rest = lines2.slice(1)
  return '<div class="info-content"><div style="font-weight:600;color:var(--text);margin-bottom:4px">' + esc(title) + '</div>' +
    rest.map(function (l) {
      var alreadyBulleted = /^•/.test(l)
      var prefix = alreadyBulleted ? "    " : "    • "
      return '<div style="margin-top:2px">' + esc(prefix + l) + '</div>'
    }).join("") +
  '</div>'
}

// 과제 안내/평가 결과 카드는 기존 과제·평가 탭에서 쓰던 구조화 레코드(제목 링크 + 교재·범위 + 마감/내용)를
// 그대로 재사용해요. 탭이 없어진 대신 더보기 안에서 바로 이 정보를 보여줍니다.
async function loadSummaryRecordDetails(c) {
  const assignEl = el("summary-assignment-body")
  const evalEl = el("summary-evaluation-body")
  try {
    const data = await fetchClassDetail(c.id)
    const aRecords = (data.assignments && data.assignments.records) || []
    const aActivities = (data.assignments && data.assignments.activities) || []
    const dueByRecordId = {}
    aActivities.forEach(function (a) { if (a.recordId && a.dueDate && !dueByRecordId[a.recordId]) dueByRecordId[a.recordId] = a.dueDate })
    if (assignEl) {
      assignEl.innerHTML = aRecords.length ? aRecords.map(function (r) {
        const due = pickField(r, ["dueDate", "due_iso", "due", "dueAt", "과제마감일", "과제 마감일"]) || dueByRecordId[r.id] || null
        return '<div class="record-card"><div class="title"><a href="' + r.url + '" target="_blank">' + esc(r.title || "과제") + '</a></div>' +
          '<div class="meta">교재: ' + esc(r.book || "-") + (r.range ? " · 범위: " + esc(r.range) : "") + '</div>' +
          (r.content ? '<div class="meta" style="margin-top:4px">' + esc(r.content) + '</div>' : "") +
          bulletLine("마감일", due ? formatDateLabel(due) : "미정") +
        '</div>'
      }).join("") : '<div class="info-content empty">기록 없음</div>'
    }
    const eRecords = (data.evaluations && data.evaluations.records) || (data.tests && data.tests.records) || []
    if (evalEl) {
      evalEl.innerHTML = eRecords.length ? eRecords.map(function (r) {
        return '<div class="record-card"><div class="title"><a href="' + r.url + '" target="_blank">' + esc(r.title || "평가") + '</a></div>' +
          '<div class="meta">교재: ' + esc(r.book || "-") + (r.range ? " · 범위: " + esc(r.range) : "") + '</div>' +
        '</div>'
      }).join("") : '<div class="info-content empty">기록 없음</div>'
    }
  } catch (err) {
    if (assignEl) assignEl.innerHTML = '<div class="info-content empty">불러오기 실패</div>'
    if (evalEl) evalEl.innerHTML = '<div class="info-content empty">불러오기 실패</div>'
  }
}

async function renderTaskTab(c, body, kind) {
  if (kind === "evaluation") {
    body.innerHTML = '<div class="loading">불러오는 중...</div>'
    try {
      const data = await fetchClassDetail(c.id)
      const records = (data.evaluations && data.evaluations.records) || (data.tests && data.tests.records) || []
      const activities = (data.evaluations && data.evaluations.activities) || []
      // 점수/정답/전체 문항은 반 전체 공통 설명인 records가 아니라, 학생별 인스턴스인 activities에만 있어요.
      // (레코드에는 title/book/range만 있고 점수 필드 자체가 없어서 예전 코드는 항상 점수가 비어 보였어요.)
      if (activities.length > 0) {
        const recordById = {}
        records.forEach(function (r) { recordById[r.id] = r })
        body.innerHTML = activities.map(function (a) {
          const rec = recordById[a.recordId] || {}
          const total = pickField(a, ["totalCount", "totalQuestions", "total", "전체문항", "전체 문항"])
          const correct = pickField(a, ["correctCount", "correctQuestions", "correct", "정답문항", "정답 문항"])
          const score = pickField(a, ["score", "점수"])
          const scoreText = (score !== null ? score + "점" : "") + (total ? " (" + (correct !== null ? correct : "?") + "/" + total + ")" : "")
          return '<div class="record-card"><div class="title"><a href="' + (a.url || rec.url || "#") + '" target="_blank">' + esc(rec.title || "제목 없음") + '</a></div>' +
            '<div class="meta">교재: ' + esc(rec.book || "-") + (rec.range ? " · 범위: " + esc(rec.range) : "") + '</div>' +
            bulletLine("학생", a.studentName) +
            (scoreText ? bulletLine("점수", scoreText) : "") +
            '</div>'
        }).join("")
        return
      }
      if (records.length > 0) {
        body.innerHTML = records.map(function (r) {
          return '<div class="record-card"><div class="title"><a href="' + r.url + '" target="_blank">' + esc(r.title || "평가") + '</a></div>' +
            '<div class="meta">교재: ' + esc(r.book || "-") + (r.range ? " · 범위: " + esc(r.range) : "") + '</div>' +
            '</div>'
        }).join("")
        return
      }
    } catch (err) {
      // 상세 조회가 실패하면 아래 요약 텍스트로 폴백해요.
    }
    const summary = c.evaluationSummary
    body.innerHTML = summary
      ? '<div class="record-card"><div class="meta">' + esc(summary) + '</div></div>'
      : '<div class="empty">등록된 평가 정보가 없어요</div>'
    return
  }
  body.innerHTML = '<div class="loading">불러오는 중...</div>'
  try {
    const data = await fetchClassDetail(c.id)
    const records = (data.assignments && data.assignments.records) || []
    const activities = (data.assignments && data.assignments.activities) || []
    // 마감일은 반 전체 공통 설명인 records가 아니라, 학생별 인스턴스인 activities에만 있어요(같은 과제면 공통 동일해요).
    // recordId로 매칭되는 첫 번째 activity의 마감일을 해당 기록의 마감일로 사용해요.
    const dueByRecordId = {}
    activities.forEach(function (a) {
      if (a.recordId && a.dueDate && !dueByRecordId[a.recordId]) dueByRecordId[a.recordId] = a.dueDate
    })
    let html = ""
    if (records.length === 0) {
      html = '<div class="empty">등록된 과제 설명이 없어요</div>'
    } else {
      html = records.map(function (r) {
        const due = pickField(r, ["dueDate", "due_iso", "due", "dueAt", "과제마감일", "과제 마감일"]) || dueByRecordId[r.id] || null
        // r.content는 이미 자체적인 서식(줄바꿈, 자체 불릿 등)을 포함하고 있을 수 있어서,
        // "내용:" 라벨로 감싸면 이중 불릿·줄바꿈 깨짐이 생겨요. 그래서 원문 그대로 별도 줄에 보여줘요.
        return '<div class="record-card"><div class="title"><a href="' + r.url + '" target="_blank">' + esc(r.title) + '</a></div>' +
          '<div class="meta">교재: ' + esc(r.book) + (r.range ? " · 범위: " + esc(r.range) : "") + '</div>' +
          (r.content ? '<div class="meta" style="margin-top:4px">' + esc(r.content) + '</div>' : "") +
          bulletLine("마감일", due ? formatDateLabel(due) : "미정") +
          '</div>'
      }).join("")
    }
    body.innerHTML = html
  } catch (err) {
    body.innerHTML = '<div class="empty">불러오기 실패: ' + esc(err.message) + '</div>'
  }
}

// ---------------- 일정 목록(중앙) ----------------
// 선택한 날짜(CURRENT_DATE)부터 다가오는 일주일(SCHEDULE_WINDOW_DAYS)치 일정을 한번에 모아서 보여줘요.
function upcomingDateRange(startStr, days) {
  const result = []
  const d = new Date(startStr + "T00:00:00+09:00")
  for (let i = 0; i < days; i++) {
    result.push(new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul" }).format(d))
    d.setDate(d.getDate() + 1)
  }
  return result
}

function updateScheduleDateNavLabel(dates) {
  const labelEl = el("date-nav-label")
  if (!labelEl || DOMAIN !== "schedule") return
  labelEl.textContent = formatWeekRangeLabel(dates[0], dates[dates.length - 1])
}

function mergeScheduleDates(dates) {
  const merged = []
  dates.forEach(function (d) { (SCHEDULE_LIST_CACHE[d] || []).forEach(function (s) { merged.push(s) }) })
  return merged
}

async function loadScheduleList(dateStr) {
  const dates = upcomingDateRange(dateStr, SCHEDULE_WINDOW_DAYS)
  updateScheduleDateNavLabel(dates)
  const allCached = dates.every(function (d) { return SCHEDULE_LIST_CACHE[d] })
  if (allCached) {
    SCHEDULES = mergeScheduleDates(dates)
    renderScheduleList()
    clearRightPanel()
    refreshScheduleWeek(dates, true)
    return
  }
  SCHEDULES = []
  el("schedule-list-area").innerHTML = '<div class="loading">불러오는 중...</div>'
  clearRightPanel()
  await refreshScheduleWeek(dates, false)
}

async function refreshScheduleWeek(dates, silent) {
  const anchor = dates[0]
  try {
    await Promise.all(dates.map(async function (dateStr) {
      const res = await fetch(GET_SCHEDULES_URL + "?date=" + dateStr, {
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY, "x-admin-key": getAdminKey() || "" },
      })
      const data = await res.json()
      if (!res.ok) throw new Error(data.error || ("HTTP " + res.status))
      SCHEDULE_LIST_CACHE[dateStr] = data.schedules || []
    }))
    if (anchor !== CURRENT_DATE || DOMAIN !== "schedule") return
    SCHEDULES = mergeScheduleDates(dates)
    renderScheduleList()
    // background prefetch: same as class tab, load students in background when no schedule is selected yet
    if (!SELECTED_SCHEDULE_ID) ensureAllStudentsLoaded()
  } catch (err) {
    if (!silent && anchor === CURRENT_DATE && DOMAIN === "schedule") {
      el("schedule-list-area").innerHTML = '<div class="empty">불러오기 실패: ' + esc(err.message) + '<br><button class="retry-btn" onclick="refreshScheduleWeek(upcomingDateRange(CURRENT_DATE, SCHEDULE_WINDOW_DAYS), false)">다시 시도</button></div>'
    }
  }
}

function filteredSchedules() {
  const activeCats = Object.keys(SCHEDULE_CATEGORY_FILTER).filter(function (c) { return SCHEDULE_CATEGORY_FILTER[c] })
  let list = SCHEDULES
  if (activeCats.length) list = list.filter(function (s) { return activeCats.indexOf(s.category) >= 0 })
  if (!SEARCH_TERM) return list
  return list.filter(function (s) {
    const hay = [s.name, s.category, s.status, s.memo, s.relatedText]
      .concat(s.teacherNames || [], s.classNames || [], s.tags || [])
      .filter(Boolean).join(" ").toLowerCase()
    return hay.indexOf(SEARCH_TERM) >= 0
  })
}

// 구분 필터 칩 목록을 그려요. 칩을 누르면 다중 선택되고(전체 클리어는 "전체" 칩), 목록만 다시 그려요(칩 자체는 활성 클래스만 토글).
function renderScheduleCategoryFilterRow() {
  const rowEl = el("schedule-category-filter-row")
  if (!rowEl) return
  const activeCats = Object.keys(SCHEDULE_CATEGORY_FILTER).filter(function (c) { return SCHEDULE_CATEGORY_FILTER[c] })
  const allActive = activeCats.length === 0
  rowEl.innerHTML =
    '<button class="filter-option' + (allActive ? " active" : "") + '" onclick="clearScheduleCategoryFilter()">전체</button>' +
    SCHEDULE_CATEGORY_ALL.map(function (cat) {
      const active = !!SCHEDULE_CATEGORY_FILTER[cat]
      return '<button class="filter-option' + (active ? " active" : "") + '" onclick="toggleScheduleCategoryFilter(' + attrSafe(cat) + ')">' + esc(cat) + '</button>'
    }).join("")
}

function toggleScheduleCategoryFilter(cat) {
  if (SCHEDULE_CATEGORY_FILTER[cat]) delete SCHEDULE_CATEGORY_FILTER[cat]
  else SCHEDULE_CATEGORY_FILTER[cat] = true
  renderScheduleCategoryFilterRow()
  renderScheduleList()
}

function clearScheduleCategoryFilter() {
  SCHEDULE_CATEGORY_FILTER = {}
  renderScheduleCategoryFilterRow()
  renderScheduleList()
}

function findSchedule(id) { return SCHEDULES.find(function (s) { return s.id === id }) }

// 같은 일정이 여러 반/강사��� 걸쳐 ��으면 API가 행을 나눠서 줄 수 있어요.
// 날짜+이름+구분+상태가 같으면 한 줄로 합치고 강사/반 이름만 모아줘요.
function dedupeSchedules(list) {
  const map = new Map()
  const order = []
  list.forEach(function (s) {
    const d = (s.date || "").slice(0, 10)
    const key = [d, s.name, s.category || "", s.status || ""].join("||")
    if (!map.has(key)) {
      map.set(key, Object.assign({}, s, { teacherNames: (s.teacherNames || []).slice(), classNames: (s.classNames || []).slice() }))
      order.push(key)
    } else {
      const merged = map.get(key)
      ;(s.teacherNames || []).forEach(function (n) { if (merged.teacherNames.indexOf(n) === -1) merged.teacherNames.push(n) })
      ;(s.classNames || []).forEach(function (n) { if (merged.classNames.indexOf(n) === -1) merged.classNames.push(n) })
    }
  })
  return order.map(function (k) { return map.get(k) })
}

// 구분(선택 속성)은 노션이 ���정한 색을 그대로 쓰고(s.categoryColor), 강사/반은 관계형이라 학원마다 값이 달라져서
// 이름을 해시해서 고정 ��레트에서 색을 고르는 teacherColorClass를 재사용해요(수업 탭의 강사 배지와 동일한 방식).
// 강사는 색이 칠해진 teacher-badge, 반은 테두리만 있는 class-badge로 구분해서 한눈에 종류를 알 수 있게 해요.
function renderScheduleTagBadges(s) {
  const teacherBadges = []
  const seenTeachers = {}
  ;(s.teacherNames || []).forEach(function (n) { if (!seenTeachers[n]) { seenTeachers[n] = true; teacherBadges.push('<span class="teacher-badge ' + teacherColorClass(n) + '">' + esc(n) + '</span>') } })
  const classBadges = []
  const seenClasses = {}
  ;(s.classNames || []).forEach(function (n) { if (!seenClasses[n]) { seenClasses[n] = true; classBadges.push('<span class="class-badge ' + teacherColorClass(n) + '">' + esc(n) + '</span>') } })
  const all = teacherBadges.concat(classBadges)
  if (all.length === 0) return ""
  const MAX_TAGS = 3
  const shown = all.slice(0, MAX_TAGS)
  const extra = all.length - shown.length
  return shown.join("") + (extra > 0 ? '<span class="badge gray sched-tag-more">+' + extra + '</span>' : "")
}

function renderScheduleList() {
  const listEl = el("schedule-list-area")
  const list = dedupeSchedules(filteredSchedules())
  if (list.length === 0) {
    listEl.innerHTML = '<div class="empty">다가오는 일주일에 일정이 없어요</div>'
    return
  }
  // 학습기록 타임라인과 동일한 규칙: 날짜는 카드 안이 아니라 그룹 바깥(.sched-date-label)에 표시하고, 같은 날짜끼리 묶어요.
  const sorted = list.slice().sort(function (a, b) {
    const da = (a.date || "").slice(0, 10), db = (b.date || "").slice(0, 10)
    return da < db ? -1 : da > db ? 1 : 0
  })
  const groups = []
  let currentGroup = null
  sorted.forEach(function (s) {
    const d = (s.date || "").slice(0, 10)
    if (!currentGroup || currentGroup.date !== d) {
      currentGroup = { date: d, items: [] }
      groups.push(currentGroup)
    }
    currentGroup.items.push(s)
  })
  listEl.innerHTML = groups.map(function (g) {
    return '<div class="sched-date-group">' +
      '<div class="sched-date-label">' + esc(g.date ? formatDateLabel(g.date) : "날짜 미정") + '</div>' +
      g.items.map(function (s) {
        const selected = SELECTED_SCHEDULE_ID === s.id
        return '<div class="schedule-item' + (selected ? " selected" : "") + '" data-id="' + s.id + '" onclick="selectSchedule(' + attrSafe(s.id) + ')">' +
          '<div class="schedule-item-title-row"><span class="schedule-item-title">' + esc(s.name) + '</span></div>' +
          '<div class="schedule-item-badges">' +
            (s.category ? '<span class="badge ' + s.categoryColor + '">' + esc(s.category) + '</span>' : "") +
            renderScheduleTagBadges(s) +
          '</div>' +
        '</div>'
      }).join("") +
    '</div>'
  }).join("")
}

function selectSchedule(id) {
  const prevId = SELECTED_SCHEDULE_ID
  SELECTED_SCHEDULE_ID = id
  const s = findSchedule(id)
  if (!s) return
  // 리스트 전체를 다시 그리는(renderScheduleList) 대신, 선택 상태만 DOM에서 바로 토글해요(단순 클릭도 연산을 절감하도록 적용).
  const listEl = el("schedule-list-area")
  if (listEl && prevId !== id) {
    if (prevId) { const prevEl = listEl.querySelector('.schedule-item[data-id="' + prevId + '"]'); if (prevEl) prevEl.classList.remove("selected") }
    const nextEl = listEl.querySelector('.schedule-item[data-id="' + id + '"]')
    if (nextEl) nextEl.classList.add("selected")
  }
  // 다른 탭(보고서/수강료/수업)에�� 남은 ���이 섞여 보이지 않도록, 공유 헤더 요소를 이 함수에서 매번 전부 새로 지정해요.
  el("md-right-empty").style.display = "none"
  el("md-right-content").style.display = "block"
  el("right-title").textContent = s.name
  el("right-time").textContent = s.date ? formatDateLabel(s.date.slice(0, 10)) : ""
  el("right-sub").textContent = [s.category, s.status].filter(Boolean).join(" · ")
  el("right-page-link").style.display = ""
  el("right-page-link").href = s.url
  el("right-summary-toggle").style.display = "inline-flex"
  el("right-summary-body").classList.remove("show")
  el("right-summary-toggle").classList.remove("open")
  RIGHT_SUMMARY_CLOSED_LABEL = "더보기"
  RIGHT_SUMMARY_ON_OPEN = null
  el("right-summary-toggle-label").textContent = RIGHT_SUMMARY_CLOSED_LABEL
  el("bulk-send-tab-btn").style.display = "inline-flex"
  el("bulk-send-tab-btn").textContent = "📩 안내문 일괄 전송"
  el("bulk-send-tab-btn").disabled = true
  SCHEDULE_MSG_SELECTED = {}
  SCHEDULE_MSG_SEARCH = ""
  SCHEDULE_MSG_STATUS_FILTER = ""
  // 상세 정보(관련 대상·메모·태그)는 수업 탭처럼 "더보기" 접기 안에 담아요.
  renderScheduleDetail(s)
  // 안내 대상 학생 목록은 접기와 무관하게 항상 보이는 영역(right-tab-body)에 그려요(수업 탭의 수강생 명단과 동일한 위치).
  if (STUDENTS_LOAD_STATE === "loaded") renderScheduleMsgBody()
  else ensureAllStudentsLoaded()
  openMobileDetail()
}

// 강사/반 이름은 이미 정���된 배열(teacherNames/classNames)을 그대로 써서, 원본 관련항목 텍스트에 섞여있을 수 있는 중복을 피해요.
function renderScheduleRelatedBadges(s) {
  const teacherBadges = []
  const seenTeachers = {}
  ;(s.teacherNames || []).forEach(function (n) { if (!seenTeachers[n]) { seenTeachers[n] = true; teacherBadges.push('<span class="teacher-badge ' + teacherColorClass(n) + '">' + esc(n) + '</span>') } })
  const classBadges = []
  const seenClasses = {}
  ;(s.classNames || []).forEach(function (n) { if (!seenClasses[n]) { seenClasses[n] = true; classBadges.push('<span class="class-badge ' + teacherColorClass(n) + '">' + esc(n) + '</span>') } })
  return teacherBadges.concat(classBadges).join(" ")
}

// "더보기" 접기 안에는 타이틀/카드 없이 메모 내용만 그대로 보여줘요.
function renderScheduleDetail(s) {
  const body = el("right-summary-body")
  body.innerHTML = s.memo
    ? '<div class="schedule-memo-text">' + esc(s.memo).replace(/\n/g, "<br>") + '</div>'
    : '<div class="empty">메모가 없어요</div>'
}

// ---------------- 일정 안내 메시지: 학생(학원) DB 전체 명단 + 필터 + 선택 발송 (발송 백엔드는 추후 연동) ----------------
// 수업 탭의 학생 선택 UI(student-row, student-select-all, bulk-send-btn)와 동일한 디자인을 재사용해요.
let SCHEDULE_MSG_SELECTED = {} // key: 학생 id
let ALL_STUDENTS_CACHE = null // 학생(학원) DB 전체 목록 캐시 (여러 일정에서 공유, 한번만 불러와요)
let STUDENTS_LOAD_STATE = "idle" // idle | loading | loaded | error
let STUDENTS_LOAD_ERROR = ""
let SCHEDULE_MSG_SEARCH = ""
let SCHEDULE_MSG_STATUS_FILTER = ""

// 안내 메시지 UI는 수업 탭과 동일한 상단 공통 "더보기" 토글(right-summary-toggle/right-summary-body)과
// 일괄 전송 버튼(bulk-send-tab-btn)을 그대로 재사용해요(관련 로직은 selectSchedule 참고).

// 학생(학원) DB 전체 목록을 한번 불러와서 캐시해요. 기대 응답 형태:
// { students: [{ id, name, grade, school, classNames: ["반 이름", ...], status: "🔵수강중", phone, parentPhone }, ...] }
// (학생이름→name, 학년→grade, 학교→school, 등록 클래스→classNames, 상태→status 프로퍼티와 매핑되어야 해요)
async function ensureAllStudentsLoaded() {
  if (STUDENTS_LOAD_STATE === "loaded" || STUDENTS_LOAD_STATE === "loading") return
  STUDENTS_LOAD_STATE = "loading"
  renderScheduleMsgBody()
  try {
    const res = await fetch(GET_STUDENTS_URL, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY, "x-admin-key": getAdminKey() || "" },
    })
    const data = await res.json()
    if (!res.ok) throw new Error(data.error || ("HTTP " + res.status))
    ALL_STUDENTS_CACHE = data.students || []
    STUDENTS_LOAD_STATE = "loaded"
  } catch (err) {
    STUDENTS_LOAD_ERROR = err.message
    STUDENTS_LOAD_STATE = "error"
  }
  renderScheduleMsgBody()
}

// Search across name/grade/school/class, and if a status is selected, only keep exact status matches too.
function filteredScheduleMsgStudents() {
  const q = (SCHEDULE_MSG_SEARCH || "").trim().toLowerCase()
  return (ALL_STUDENTS_CACHE || []).filter(function (st) {
    if (SCHEDULE_MSG_STATUS_FILTER && st.status !== SCHEDULE_MSG_STATUS_FILTER) return false
    if (!q) return true
    const haystack = [st.name, st.grade, st.school, st.status].concat(st.classNames || []).filter(Boolean).join(" ").toLowerCase()
    return haystack.indexOf(q) !== -1
  })
}

// Fixed list of the five statuses the student DB's status formula can produce.
const SCHEDULE_MSG_STATUS_ALL = ["🟡신규문의", "🔵수강중", "🟢수강전", "🔴종료", "⚪등록보류"]

// 이모지 없이 텍스트만 보여주되, 이모지와 같은 색으로 표기하기 위한 매핑이에요.
const SCHEDULE_MSG_STATUS_META = {
  "🟡���규문의": { label: "신규문의", tone: "tone-yellow" },
  "🔵수강중": { label: "수강중", tone: "tone-blue" },
  "🟢수강전": { label: "수강전", tone: "tone-green" },
  "🔴종료": { label: "종료", tone: "tone-red" },
  "⚪등록보류": { label: "등록보류", tone: "tone-gray" },
}

function scheduleMsgStatusMeta(status) {
  return SCHEDULE_MSG_STATUS_META[status] || { label: status || "", tone: "tone-gray" }
}

function scheduleMsgStatusOptions() {
  return SCHEDULE_MSG_STATUS_ALL
}

function setScheduleMsgStatusFilter(value) {
  SCHEDULE_MSG_STATUS_FILTER = value
  renderScheduleMsgList()
}

function scheduleMsgStatusOptionsHtml() {
  return '<option value="">수강상태 전체</option>' +
    scheduleMsgStatusOptions().map(function (o) { return '<option value="' + esc(o) + '"' + (SCHEDULE_MSG_STATUS_FILTER === o ? " selected" : "") + '>' + esc(scheduleMsgStatusMeta(o).label) + '</option>' }).join("")
}

function setScheduleMsgSearch(value) {
  SCHEDULE_MSG_SEARCH = value
  renderScheduleMsgBody()
}

// 검색창(input) 자체는 처음 한 번만 만들고, 검색어가 바뀜 때마다 아래 목록 부분만 갱신해요.
// input 요소를 매 키입력마다 통째로 교체하면 한글 조합(IME) 상태가 깨져서 자음·모음이 따로따로 나눠지는 문제가 생기므로 이를 피해요.
function renderScheduleMsgBody() {
  const bodyEl = el("right-tab-body")
  if (!bodyEl) return
  if (STUDENTS_LOAD_STATE === "loading") {
    bodyEl.innerHTML = '<div class="loading">학생 목록 불러오는 중...</div>'
    el("bulk-send-tab-btn").disabled = true
    return
  }
  if (STUDENTS_LOAD_STATE === "error") {
    bodyEl.innerHTML = '<div class="empty">불러오기 실패: ' + esc(STUDENTS_LOAD_ERROR) + '<br><button class="retry-btn" onclick="ensureAllStudentsLoaded()">다시 시도</button></div>'
    el("bulk-send-tab-btn").disabled = true
    return
  }
  // 이미 검색창 쉬샘(input 포함)이 그려져 있으면 input��� 건드리지 않고 목록만 갱신해요.
  if (!bodyEl.querySelector(".student-list-controls")) {
    bodyEl.innerHTML =
      '<div class="student-list-controls">' +
        '<label class="student-select-all"><input type="checkbox" onchange="toggleScheduleMsgSelectAll(this.checked)"> 전체 선택</label>' +
        '<button class="student-sort-btn' + (SCHEDULE_MSG_SORT_NAME_ASC ? " active" : "") + '" onclick="toggleScheduleMsgNameSort()">이름 ' + (SCHEDULE_MSG_SORT_NAME_ASC ? "▲" : "↕") + '</button>' +
        '<input type="text" class="student-search-box" placeholder="🔍 이로·학맄·학교·클땝스 검색" value="' + esc(SCHEDULE_MSG_SEARCH) + '" oninput="setScheduleMsgSearch(this.value)">' +
        '<select class="student-status-filter" onchange="setScheduleMsgStatusFilter(this.value)">' + scheduleMsgStatusOptionsHtml() + '</select>' +
      '</div>' +
      '<div class="sched-msg-count"></div>' +
      '<div id="sched-msg-student-rows"></div>'
  }
  renderScheduleMsgList()
}

// 검색어·체크박스 변화마다 이 함수만 불려서 검색창(input)은 손대지 않고 아래 목록/카운트/전체선택만 갱신해요.
function renderScheduleMsgList() {
  const bodyEl = el("right-tab-body")
  if (!bodyEl) return
  const list = filteredScheduleMsgStudents()
  const eligibleIds = list.map(function (s) { return s.id })
  const allSelected = eligibleIds.length > 0 && eligibleIds.every(function (id) { return SCHEDULE_MSG_SELECTED[id] })
  const selectedCount = Object.keys(SCHEDULE_MSG_SELECTED).length
  const rowsHtml = list.length
    ? list.map(function (s) {
        const meta = [s.grade, s.school].filter(Boolean).join(" · ")
        const statusMeta = s.status ? scheduleMsgStatusMeta(s.status) : null
        const statusBadge = statusMeta ? ' <span class="badge ' + statusMeta.tone + '">' + esc(statusMeta.label) + '</span>' : ""
        const sentBadge = ' <span class="badge ' + (s.sentByMe ? "tone-blue" : "tone-gray") + '">' + (s.sentByMe ? "전송완료" : "미전송") + '</span>'
        return '<div class="student-row"><span class="stu-name"><input type="checkbox" class="stu-checkbox" ' + (SCHEDULE_MSG_SELECTED[s.id] ? "checked" : "") + ' onchange="toggleScheduleMsgStudent(' + attrSafe(s.id) + ', this.checked)"> ' + esc(s.name) + (meta ? ' <span class="stu-meta">' + esc(meta) + '</span>' : "") + statusBadge + sentBadge + '</span>' +
          '<button class="send-btn" onclick="sendScheduleMsgToStudent(' + attrSafe(s.id) + ')">📩 ' + (s.sentByMe ? "재전송" : "전송") + '</button>' +
        '</div>'
      }).join("")
    : '<div class="empty" style="padding:8px 0">조건에 맞는 학생이 없어요</div>'
  const countEl = bodyEl.querySelector(".sched-msg-count")
  if (countEl) countEl.textContent = list.length + "명 · 선택 " + selectedCount + "명"
  const selectAllEl = bodyEl.querySelector(".student-select-all input")
  if (selectAllEl) { selectAllEl.checked = allSelected; selectAllEl.disabled = !eligibleIds.length }
  const rowsEl = bodyEl.querySelector("#sched-msg-student-rows")
  if (rowsEl) rowsEl.innerHTML = rowsHtml
  el("bulk-send-tab-btn").disabled = selectedCount === 0
}

function toggleScheduleMsgStudent(id, checked) {
  if (checked) SCHEDULE_MSG_SELECTED[id] = true
  else delete SCHEDULE_MSG_SELECTED[id]
  renderScheduleMsgBody()
}

function toggleScheduleMsgSelectAll(checked) {
  filteredScheduleMsgStudents().forEach(function (s) { if (checked) SCHEDULE_MSG_SELECTED[s.id] = true; else delete SCHEDULE_MSG_SELECTED[s.id] })
  renderScheduleMsgBody()
}

function toggleScheduleMsgNameSort() {
  SCHEDULE_MSG_SORT_NAME_ASC = !SCHEDULE_MSG_SORT_NAME_ASC
  const bodyEl = el("right-tab-body")
  if (bodyEl) bodyEl.innerHTML = ""
  renderScheduleMsgBody()
}

function handleScheduleMessageSend() {
  const targets = (ALL_STUDENTS_CACHE || []).filter(function (s) { return SCHEDULE_MSG_SELECTED[s.id] })
  if (!targets.length) { showToast("발송할 학생이 없어요"); return }
  showToast(targets.length + "명에게 보낼 준비가 됐어요 (발송 기능은 아직 준비 중이에요)")
}

// 학생 한 명에게 개별로 안내문을 보내는 버튼이에요. 수업 탭의 개별 전송 버튼과 같은 자리·같은 이모지를 사용해요.
// 백엔드 연동은 ���직이라, 수업 탭과 같은 전송완료/미전송 배지를 보여주기 위해 클릭 즉시 sentByMe만 켜요.
function sendScheduleMsgToStudent(id) {
  const s = (ALL_STUDENTS_CACHE || []).find(function (st) { return st.id === id })
  if (!s) return
  s.sentByMe = true
  showToast(esc(s.name) + "에게 안내문을 보낼 준비가 됐어요 (발송 기능은 아직 준비 중이에요)")
  renderScheduleMsgList()
}

// ---------------- 알림톡 발송 ----------------
async function callSendDailyReport(payload) {
  const res = await fetch(SEND_DAILY_REPORT_URL, {
    method: "POST",
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY, "Content-Type": "application/json", "x-admin-key": getAdminKey() || "" },
    body: JSON.stringify(payload),
  })
  const data = await res.json().catch(function () { return {} })
  if (!res.ok) throw new Error(data.error || ("HTTP " + res.status))
  return data
}

// 전송 버튼을 누르면 곧바로 발송하지 않고, HTML에 이미 있던 확인 모달(alimtalk-modal)을 먼저 보여줘요.
// 사용자가 "발송"을 누르면 confirmAlimtalkSend()가 실제 발송 로직을 실행해요.
let ALIMTALK_PENDING = null // { kind: "student", index } | { kind: "bulk", classId }

function openAlimtalkModal(kind, payload) {
  ALIMTALK_PENDING = { kind: kind, payload: payload }
  const textEl = el("alimtalk-modal-text")
  const textByKind = {
    student: payload.studentName + " 학생에게 오늘의 학습 리포트 알림톡을 발송하시겠습니까?",
    bulk: payload.count + "명의 학생에게 오늘의 학습 리포트 알림톡을 일괄 발송하시겠습니까?",
    "bulk-report": payload.count + "명의 학부모에게 " + payload.sendFnName + " 보고서 알림톡을 일괄 발송하시겠습니까?",
    "bulk-tuition": payload.count + "명의 학부모에게 수강료 안내 알림톡을 일괄 발송하시겠습니까?",
  }
  textEl.textContent = textByKind[kind] || textByKind.bulk
  el("alimtalk-modal").classList.add("show")
}

function closeAlimtalkModal() {
  el("alimtalk-modal").classList.remove("show")
  ALIMTALK_PENDING = null
}

async function confirmAlimtalkSend() {
  const pending = ALIMTALK_PENDING
  closeAlimtalkModal()
  if (!pending) return
  if (pending.kind === "student") {
    await doSendStudentReport(pending.payload.index)
  } else if (pending.kind === "bulk") {
    await doSendBulkForClass(pending.payload.classId)
  } else if (pending.kind === "bulk-report") {
    await doSendBulkReportsForClass(pending.payload.classId)
  } else if (pending.kind === "bulk-tuition") {
    await doSendBulkTuitionsForClass(pending.payload.classId)
  }
}

// 수업/보고서/수강료 탭이 같은 제목줄 고정 버튼(bulk-send-tab-btn)을 공유하므로, 현재 DOMAIN에 맞는 일괄 전송 흐름으로 나눠줘요.
function handleBulkSendClick() {
  if (DOMAIN === "class") {
    sendBulkForClass(SELECTED_CLASS_ID)
  } else if (DOMAIN === "report") {
    sendBulkReportsForClass()
  } else if (DOMAIN === "tuition") {
    sendBulkTuitionsForClass()
  } else if (DOMAIN === "schedule") {
    handleScheduleMessageSend()
  }
}

function sendBulkReportsForClass() {
  const list = SELECTED_REPORT_CLASS ? getFilteredReports().filter(function (r) { return (r.classId || "__unassigned__") === SELECTED_REPORT_CLASS }) : []
  const selectedInGroup = list.filter(function (r) { return SELECTED_REPORT_IDS[r.reportId] })
  const targets = selectedInGroup.length ? selectedInGroup : list.filter(function (r) { return !r.sentBy })
  if (!targets.length) { showToast("발송할 학생이 없어요"); return }
  const sendFnName = REPORT_TYPE === "monthly" ? "월간" : "주간"
  openAlimtalkModal("bulk-report", { classId: SELECTED_REPORT_CLASS, count: targets.length, sendFnName: sendFnName })
}

async function doSendBulkReportsForClass(classId) {
  const list = classId ? getFilteredReports().filter(function (r) { return (r.classId || "__unassigned__") === classId }) : []
  const selectedInGroup = list.filter(function (r) { return SELECTED_REPORT_IDS[r.reportId] })
  const targets = selectedInGroup.length ? selectedInGroup : list.filter(function (r) { return !r.sentBy })
  if (!targets.length) { showToast("발송할 학생이 없어요"); return }
  let success = 0, fail = 0
  for (const r of targets) {
    try {
      await sendPeriodReportSilently(r.reportId)
      success++
    } catch (_e) {
      fail++
    }
  }
  showToast(success + "건 발송 완료" + (fail ? ", " + fail + "건 실패" : ""))
  await loadReportList(CAL_PANEL_MONTH)
}

async function sendPeriodReportSilently(reportId) {
  const url = REPORT_TYPE === "monthly" ? SEND_MONTHLY_REPORT_URL : SEND_WEEKLY_REPORT_URL
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY, "x-admin-key": getAdminKey() || "" },
    body: JSON.stringify({ reportId: reportId }),
  })
  const data = await res.json()
  if (!res.ok) throw new Error(data.error || ("발송 실패: " + res.status))
}

function sendBulkTuitionsForClass() {
  const list = SELECTED_TUITION_CLASS ? getFilteredTuitions().filter(function (t) { return (t.classId || "__unassigned__") === SELECTED_TUITION_CLASS }) : []
  const selectedInGroup = list.filter(function (t) { return SELECTED_TUITION_IDS[t.tuitionId] })
  const targets = selectedInGroup.length ? selectedInGroup : list.filter(function (t) { return paymentStatusTone(t.paymentStatus) !== "tone-green" })
  if (!targets.length) { showToast("발송할 학생이 없어요"); return }
  openAlimtalkModal("bulk-tuition", { classId: SELECTED_TUITION_CLASS, count: targets.length })
}

async function doSendBulkTuitionsForClass(classId) {
  const list = classId ? getFilteredTuitions().filter(function (t) { return (t.classId || "__unassigned__") === classId }) : []
  const selectedInGroup = list.filter(function (t) { return SELECTED_TUITION_IDS[t.tuitionId] })
  const targets = selectedInGroup.length ? selectedInGroup : list.filter(function (t) { return paymentStatusTone(t.paymentStatus) !== "tone-green" })
  if (!targets.length) { showToast("발송할 학생이 없어요"); return }
  let success = 0, fail = 0
  for (const t of targets) {
    try {
      await sendTuitionNoticeSilently(t.tuitionId)
      success++
    } catch (_e) {
      fail++
    }
  }
  showToast(success + "건 발송 완료" + (fail ? ", " + fail + "건 실패" : ""))
  await loadTuitionList(CAL_PANEL_MONTH)
}

async function sendTuitionNoticeSilently(tuitionId) {
  const res = await fetch(SEND_TUITION_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY, "x-admin-key": getAdminKey() || "" },
    body: JSON.stringify({ tuitionId: tuitionId }),
  })
  const data = await res.json()
  if (!res.ok) throw new Error(data.error || ("발송 실패: " + res.status))
}

function sendStudentReport(i) {
  const c = findClass(SELECTED_CLASS_ID)
  if (!c) return
  const s = (c.students || [])[i]
  if (!s || !s.attendanceId) return
  openAlimtalkModal("student", { index: i, studentName: s.name })
}

async function doSendStudentReport(i) {
  const c = findClass(SELECTED_CLASS_ID)
  if (!c) return
  const s = (c.students || [])[i]
  if (!s || !s.attendanceId) return
  const btn = el("stu-send-" + i)
  if (btn) { btn.disabled = true; btn.textContent = "발송중..." }
  try {
    await callSendDailyReport({ registrationId: s.registrationId, attendanceId: s.attendanceId })
    s.sentByMe = true
    delete SELECTED_STUDENT_IDS[s.attendanceId]
    showToast(esc(s.name) + "에게 알림톡을 발송했어요")
    renderClassRightSub(c)
    renderStudentsTab(c, el("right-tab-body"))
  } catch (err) {
    showToast("발송 실패: " + err.message)
  } finally {
    if (btn) { btn.disabled = false }
  }
}

function sendBulkForClass(classId) {
  const c = findClass(classId)
  if (!c) return
  const targets = (c.students || []).filter(function (s) { return s.attendanceId && SELECTED_STUDENT_IDS[s.attendanceId] })
  if (targets.length === 0) { showToast("선택된 학생이 없어요"); return }
  openAlimtalkModal("bulk", { classId: classId, count: targets.length })
}

async function doSendBulkForClass(classId) {
  const c = findClass(classId)
  if (!c) return
  const targets = (c.students || []).filter(function (s) { return s.attendanceId && SELECTED_STUDENT_IDS[s.attendanceId] })
  if (targets.length === 0) { showToast("선택된 학생이 없어요"); return }
  let success = 0, fail = 0
  for (const s of targets) {
    try {
      await callSendDailyReport({ registrationId: s.registrationId, attendanceId: s.attendanceId })
      s.sentByMe = true
      delete SELECTED_STUDENT_IDS[s.attendanceId]
      success++
    } catch (_e) {
      fail++
    }
  }
  showToast(success + "건 발송 완료" + (fail ? ", " + fail + "건 실패" : ""))
  renderClassRightSub(c)
  renderStudentsTab(c, el("right-tab-body"))
}

function loadDashboard() {

if (getAdminKey()) {
  showAppScreen()
} else {
  showLoginScreen()
}
</script>
