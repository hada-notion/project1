<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%93%8A%3C/text%3E%3C/svg%3E" />
<title>하다 학원관리 대시보드</title>
<style>
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --border: #e5e5e3;
    --text: #37352f;
    --muted: #9b9a97;
    --accent: #2383e2;
    --green: #2e7d32;
    --blue: #1565c0;
    --red: #c62828;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  /* 상단 메뉴 */
  .topbar {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 52px;
    padding: 0 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .topbar .brand {
    font-weight: 700;
    margin-right: 20px;
    color: var(--text);
  }
  .topbar a, .topbar .nav-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 8px;
    text-decoration: none;
    color: var(--muted);
    font-size: 14px;
    font-weight: 500;
    border: none;
    background: none;
    font-family: inherit;
    cursor: pointer;
  }
  .topbar a.active, .topbar .nav-btn.active {
    background: #edf3fc;
    color: var(--accent);
  }
  .topbar a:hover:not(.active), .topbar .nav-btn:hover:not(.active) { background: #f0f0ee; }
  .topbar-actions {
    margin-left: auto;
    display: flex;
    gap: 8px;
  }
  .topbar-actions button {
    background: #333; color: #fff; border: none; padding: 8px 14px;
    border-radius: 8px; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .topbar-actions button.logout { background: #eee; color: #555; }

  /* 전체 레이아웃 */
  .layout {
    display: flex;
    min-height: calc(100vh - 52px);
  }
  /* 사이드 메뉴 */
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 16px 10px;
  }
  .sidebar .item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    border-radius: 8px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    margin-bottom: 2px;
  }
  .sidebar .item.active {
    background: #edf3fc;
    color: var(--accent);
  }
  .sidebar .item.disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .sidebar .item:hover:not(.active):not(.disabled) { background: #f0f0ee; }
  .sidebar .soon {
    margin-left: auto;
    font-size: 10px;
    color: var(--muted);
    background: #f0f0ee;
    padding: 2px 6px;
    border-radius: 999px;
  }

  /* 메인 콘텐츠 */
  .main {
    flex: 1;
    padding: 28px 32px;
    max-width: 1100px;
  }
  .page-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .page-header h1 {
    font-size: 22px;
    margin: 0;
  }
  .page-header .date {
    color: var(--muted);
    font-size: 14px;
  }
  .refresh-btn {
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
    color: var(--text);
  }
  .refresh-btn:hover { background: #f0f0ee; }

  .status-banner {
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 16px;
  }
  .status-banner.loading { background: #eef4fd; color: var(--accent); }
  .status-banner.error { background: #fdecec; color: var(--red); }

  .cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    min-height: 320px;
  }
  .card h2 {
    font-size: 15px;
    margin: 0 0 4px 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card .count {
    font-size: 28px;
    font-weight: 700;
    margin: 6px 0 14px 0;
  }
  .card .count small {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
  }
  .list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 220px;
    overflow-y: auto;
  }
  .list li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    background: #fbfbfa;
    font-size: 13px;
  }
  .list li a {
    color: var(--text);
    text-decoration: none;
    flex: 1;
  }
  a { color: inherit; }
  .list li a:hover { text-decoration: underline; }
  .badge {
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge.green { background: #e6f4ea; color: var(--green); }
  .badge.blue { background: #e8f0fe; color: var(--blue); }
  .badge.red { background: #fdecec; color: var(--red); }
  .badge.gray { background: #f0f0ee; color: var(--muted); }
  .badge.tone-red { background:#fdeaea; color:#e04b4b; }
  .badge.tone-orange { background:#fff1e0; color:#d9822b; }
  .badge.tone-yellow { background:#fff9db; color:#b9971d; }
  .badge.tone-green { background:#e6f7ee; color:#1e9e5c; }
  .badge.tone-blue { background:#eaf1fd; color:#2f6fd9; }
  .badge.tone-perfect { background:#eaf1fd; color:#2f6fd9; }
  .badge.tone-gray { background:#f0f0ee; color:var(--muted); }
  .empty {
    color: var(--muted);
    font-size: 13px;
    padding: 20px 0;
    text-align: center;
  }
  .summary-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .login-card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 32px 28px;
    width: 100%;
    max-width: 340px;
    text-align: center;
  }
  .login-card h1 { font-size: 18px; margin: 0 0 4px; }
  .login-card p { font-size: 12px; color: #888; margin: 0 0 20px; }
  .login-card input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 10px;
  }
  .login-card button {
    width: 100%;
    padding: 10px 12px;
    background: #6c5ce7;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .login-card button:disabled { background: #ccc; cursor: default; }
  .login-error { color: #e04b4b; font-size: 12px; margin-top: 10px; min-height: 14px; }

.attendance-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.attendance-item .left { display: flex; align-items: center; gap: 8px; }
.send-btn {
  padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border);
  background: #fff; cursor: pointer; font-size: 12px;
}
.send-btn:disabled { color: var(--muted); cursor: default; opacity: 0.5; }
.bulk-send-btn {
  margin-bottom: 8px; padding: 6px 12px; border-radius: 8px; border: none;
  background: var(--accent); color: #fff; font-size: 13px; cursor: pointer;
}
.bulk-send-btn:disabled { background: var(--muted); cursor: default; }
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
  align-items: center; justify-content: center; z-index: 100;
}
.modal-overlay.show { display: flex; }
.modal-box { background: #fff; border-radius: 12px; padding: 20px; width: 320px; max-width: 90vw; }
.modal-box h3 { margin: 0 0 8px; }
.modal-box p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
.modal-actions button { padding: 8px 14px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; }
.modal-actions .cancel { background: var(--bg); color: var(--text); }
.modal-actions .confirm { background: var(--accent); color: #fff; }
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: #37352f; color: #fff; padding: 10px 18px; border-radius: 8px;
  font-size: 13px; opacity: 0; transition: opacity 0.2s, transform 0.2s; z-index: 200; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.domain-tab-row { display:flex; gap:6px; padding:10px 16px; border-bottom:1px solid var(--border); background:var(--panel); }
.domain-tab { border:1px solid var(--border); background:#fff; padding:6px 14px; border-radius:8px; font-size:13px; cursor:pointer; color:var(--muted); font-family:inherit; }
.domain-tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.md-3col { flex:1; display:flex; min-height:0; }
.calendar-toggle-btn { border:1px solid var(--border); background:#fff; width:28px; height:28px; border-radius:6px; cursor:pointer; font-size:13px; flex-shrink:0; }
.calendar-panel { width:0; flex-shrink:0; overflow:hidden; background:var(--bg); border-right:1px solid var(--border); transition: width 0.18s ease; }
.calendar-panel.open { width: 20%; min-width: 240px; }
.calendar-panel-inner { width:100%; height:100%; padding:6%; display:flex; flex-direction:column; gap:10px; }
.calendar-panel-inner.mini-cal { background:#fff; border-radius:14px; box-shadow:0 1px 4px rgba(0,0,0,0.06); width:100%; }
.cal-panel-month-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:2px; }
.cal-panel-nav-btn { background:#f0eefc; border:none; width:30px; height:30px; border-radius:50%; color:#6c5ce7; font-size:15px; font-weight:700; cursor:pointer; flex-shrink:0; }
.cal-panel-nav-btn:hover { background:#ece9ff; }
.cal-panel-month-title { font-size:15px; font-weight:700; color:#333; }
.cal-panel-nav-right { display:flex; align-items:center; gap:6px; }
.cal-panel-today-btn { background:#f0eefc; border:none; color:#6c5ce7; font-size:11px; font-weight:700; padding:5px 10px; border-radius:999px; cursor:pointer; }
.cal-panel-today-btn:hover { background:#ece9ff; }
.cal-panel-hint { font-size:11px; color:#bbb; text-align:center; margin-top:6px; }
.cal-panel-report-toggle { display:flex; gap:6px; margin-top:8px; }
.report-type-btn { flex:1; border:1px solid var(--border); background:#fff; padding:7px 6px; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; color:var(--muted); font-family:inherit; }
.report-type-btn.active { background:#6c5ce7; color:#fff; border-color:#6c5ce7; }
#report-tuition-detail .right-tab-body p { margin:0 0 8px; font-size:13px; color:var(--text); line-height:1.5; }
#report-tuition-detail .right-tab-body strong { font-size:12px; color:var(--muted); }
.cat-dot-row { display:flex; gap:2px; flex-wrap:wrap; justify-content:center; margin-top:2px; }
.cat-dot { width:6px; height:6px; border-radius:50%; display:inline-block; }
.cat-dot.green { background:var(--green); }
.cat-dot.blue { background:var(--blue); }
.cat-dot.red { background:var(--red); }
.cat-dot.gray { background:var(--muted); }
.schedule-item { border:none; border-bottom:1px solid var(--border); border-radius:0; background:transparent; padding:10px 12px; cursor:pointer; display:flex; flex-direction:column; gap:4px; }
.schedule-item:hover { background:#f2f6fc; }
.schedule-item.selected { background:#eef4fd; }
.schedule-item-title-row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.schedule-item-title { font-size:13.5px; font-weight:600; }
.schedule-item-badges { display:flex; gap:6px; flex-wrap:wrap; }
.schedule-list-area { display:flex; flex-direction:column; gap:8px; }
.schedule-detail-field { margin: 12px 0; }
.schedule-detail-field b { color: var(--muted); font-weight:600; font-size:11px; display:block; margin-bottom:4px; text-transform:uppercase; letter-spacing:.02em; }
.schedule-detail-field .val { font-size:14px; color:var(--text); }
.md-left { width: 26%; flex-shrink:0; background:var(--panel); border-right:1px solid var(--border); padding:16px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
.filter-tab, .view-tab { border:1px solid var(--border); background:#fff; padding:6px 12px; border-radius:8px; font-size:13px; cursor:pointer; color:var(--muted); font-family:inherit; }
.filter-tab.active, .view-tab.active { background:#edf3fc; color:var(--accent); border-color:#c9e0fb; }
.md-filter-row, .md-view-row { display:flex; gap:6px; }
.md-filter-options { display:flex; flex-wrap:wrap; gap:6px; }
.filter-option { border:1px solid var(--border); background:#fbfbfa; padding:4px 10px; border-radius:999px; font-size:12px; cursor:pointer; color:var(--text); font-family:inherit; }
.filter-option.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.md-date-nav { display:flex; align-items:center; justify-content:center; gap:12px; font-size:14px; font-weight:600; }
.md-date-nav-clickable { cursor:pointer; gap:6px; padding:8px 10px; border-radius:8px; background:#fff; border:1px solid var(--border); }
.md-date-nav-clickable:hover { background:#f7f7f5; }
.cal-icon { font-size:14px; }
.date-nav-btn { border:none; background:#f0f0ee; width:28px; height:28px; border-radius:6px; cursor:pointer; font-size:14px; }
.class-list-area { display:flex; flex-direction:column; gap:8px; }
.class-item { border:none; border-bottom:1px solid var(--border); border-radius:0; background:transparent; overflow:hidden; }
.class-item.selected { background:#eef4fd; }
.class-item-head { padding:10px 12px; cursor:pointer; display:flex; flex-direction:column; gap:4px; }
.class-item-head:hover { background:#f2f6fc; }
.class-item-title-row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.class-item-title { font-size:13.5px; font-weight:600; }
.class-item-time { font-size:12px; color:var(--muted); }
.class-item-badges { display:flex; gap:6px; flex-wrap:wrap; }
.class-item-body { display:none; padding:0 12px 12px; border-top:1px dashed var(--border); font-size:12.5px; color:var(--text); }
.class-item-body.show { display:block; }
.class-item-body .row { margin: 8px 0; white-space: pre-wrap; }
.class-item-body .row b { color: var(--muted); font-weight:600; font-size:11px; display:block; margin-bottom:2px; }
.calendar-area { display:flex; flex-direction:column; gap:6px; }
.calendar-grid { display:grid; grid-template-columns: repeat(7, 1fr); gap:4px; }
.calendar-day { border:1px solid var(--border); border-radius:8px; min-height:56px; padding:4px 6px; font-size:11px; cursor:pointer; background:#fff; }
.calendar-day.empty { visibility:hidden; }
.calendar-day.today { border-color: var(--accent); }
.calendar-day .num { font-weight:600; margin-bottom:2px; }
.calendar-day .cnt { color: var(--accent); font-size:11px; }
.calendar-day:hover { background:#f2f6fc; }
.md-right { flex:1; padding:24px 28px; overflow-y:auto; }
.md-right-empty { color:var(--muted); font-size:14px; text-align:center; margin-top:80px; }
.md-right-header { margin-bottom:16px; min-height:78px; }
.md-right-title-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.md-right-title { font-size:18px; font-weight:700; }
.md-right-time { font-size:13px; color:var(--muted); margin-top:4px; }
.md-right-sub { font-size:13px; color:var(--muted); margin-top:2px; }
.md-right-link { font-size:12px; color:var(--accent); text-decoration:none; }
.right-tabs-row { display:flex; align-items:center; justify-content:space-between; gap:10px; border-bottom:1px solid var(--border); margin-bottom:16px; min-height:44px; }
.right-tabs { display:flex; gap:6px; }
.right-tabs-row .bulk-send-btn { margin:0; flex-shrink:0; }
.right-tab { border:none; background:none; padding:8px 12px; font-size:13px; cursor:pointer; color:var(--muted); font-family:inherit; border-bottom:2px solid transparent; }
.right-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight:600; }
.record-card { border:none; border-bottom:1px solid var(--border); border-radius:0; padding:12px 14px; margin-bottom:0; background:transparent; }
.record-card a, .activity-row a { color: var(--text); text-decoration:none; }
.record-card a:hover, .activity-row a:hover { text-decoration:underline; }
.record-card .title { font-weight:600; font-size:13.5px; margin-bottom:4px; }
.record-card .meta { font-size:12px; color:var(--muted); white-space: pre-wrap; }
.activity-row { display:flex; align-items:center; justify-content:space-between; padding:8px 10px; border-radius:0; background:transparent; border:none; border-bottom:1px solid var(--border); margin-bottom:0; font-size:13px; }
.student-item { border-bottom:1px solid var(--border); }
.student-row { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-radius:0; background:transparent; border:none; border-bottom:none; margin-bottom:0; font-size:13px; cursor:pointer; }
.student-row .stu-name { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.student-detail { display:none; padding:0 0 10px 24px; font-size:12.5px; color:var(--text); }
.student-detail.show { display:block; }
.student-detail .row { margin:6px 0; }
.student-detail .row b { color:var(--muted); font-weight:600; font-size:11px; display:block; margin-bottom:2px; }
.student-row .stu-view { font-size:11px; color:var(--muted); text-decoration:none; margin-left:6px; }
.student-row .stu-view:hover { text-decoration:underline; }
.search-row { display:flex; }
.search-box { flex:1; border:1px solid var(--border); border-radius:8px; padding:9px 12px; font-size:13px; font-family:inherit; background:#fff; }
.search-box:focus { outline:none; border-color:var(--accent); }
.teacher-badge { font-size:11px; padding:2px 7px; border-radius:999px; white-space:nowrap; }
.teacher-badge.tb-gray { background:#f1f1ef; color:#5a5a57; }
.teacher-badge.tb-brown { background:#efe4dd; color:#8c5b3f; }
.teacher-badge.tb-orange { background:#faebdd; color:#a86227; }
.teacher-badge.tb-yellow { background:#fbf3db; color:#9b7d1f; }
.teacher-badge.tb-green { background:#ddedea; color:#3a7566; }
.teacher-badge.tb-blue { background:#ddebf1; color:#3072a3; }
.teacher-badge.tb-purple { background:#eae4f2; color:#6b4d99; }
.teacher-badge.tb-pink { background:#f4dfeb; color:#a3467c; }
.teacher-badge.tb-red { background:#fbe4e4; color:#af4141; }
.rate-badge { font-size:11px; padding:2px 7px; border-radius:999px; white-space:nowrap; font-weight:600; }
.rate-badge.tone-red { background:#fdeaea; color:#e04b4b; }
.rate-badge.tone-orange { background:#fff1e0; color:#d9822b; }
.rate-badge.tone-yellow { background:#fff9db; color:#b9971d; }
.rate-badge.tone-green { background:#e6f7ee; color:#1e9e5c; }
.rate-badge.tone-blue { background:#eaf1fd; color:#2f6fd9; }
#report-tuition-detail { padding:0; }
#report-tuition-detail .detail-meta-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
#report-tuition-detail .info-card { background:#fff; border-radius:14px; padding:14px 16px; margin-bottom:10px; box-shadow:0 1px 4px rgba(0,0,0,0.06); border:1px solid var(--border); }
#report-tuition-detail .info-card:last-of-type { margin-bottom:0; }
#report-tuition-detail .info-card h3 { font-size:13px; margin:0 0 8px; display:flex; align-items:center; gap:6px; color:var(--text); font-weight:700; }
#report-tuition-detail .info-card .info-content { font-size:12.5px; color:#6b6b68; line-height:1.6; white-space:pre-wrap; }
#report-tuition-detail .info-card .info-content.empty { color:#bbb; }
.mini-cal .mc-grid { display:grid; grid-template-columns: repeat(7, 1fr); gap:4px; margin-bottom:2px; }
.mini-cal .mc-dow { text-align:center; font-size:12px; color:#999; font-weight:600; padding-bottom:2px; }
.mini-cal .mc-day { aspect-ratio:1; display:flex; align-items:center; justify-content:center; position:relative; font-size:13px; border-radius:8px; cursor:pointer; background:#f7f7f9; color:#bbb; transition:transform 0.1s; }
.mini-cal .mc-day:active { transform:scale(0.92); }
.mini-cal .mc-day:hover { background:#efeefc; }
.mini-cal .mc-day.empty { visibility:hidden; cursor:default; background:transparent; }

async function submitLogin() {
  const input = document.getElementById("login-input")
  const key = input.value.trim()
  const btn = document.getElementById("login-btn")
  const errEl = document.getElementById("login-error")
  if (!key) { errEl.textContent = "비밀번호를 입��하세요."; return }
  btn.disabled = true
  btn.textContent = "확인 중..."
  errEl.textContent = ""

    const res = await fetch(`${SUPABASE_URL}/functions/v1/list-students`, {

    btn.disabled = false

function shiftCalendarMonth(delta) {

  const d = new Date(y, m - 1 + delta, 1)

async function loadCalendarPanel() {
  const parts = CAL_PANEL_MONTH.split("-").map(Number)
  el("cal-panel-month-label").textContent = parts[0] + "년 " + parts[1] + "월"
  renderCalPanel()

// 캘린더에 표시된 달의 날짜별로 수업/일정이 있는지 조회해서 점을 표시해요.
async function loadCalPanelDots() {
  if (DOMAIN === "report" || DOMAIN === "tuition") { CAL_PANEL_ITEMS = {}; renderCalPanel(); return }
  const month = CAL_PANEL_MONTH
  const parts = month.split("-").map(Number)
  const y = parts[0], m = parts[1]
  const daysInMonth = new Date(y, m, 0).getDate()
  const url = DOMAIN === "class" ? GET_CLASSES_URL : GET_SCHEDULES_URL
  const items = {}
  await Promise.all(Array.from({ length: daysInMonth }, function (_, i) { return i + 1 }).map(async function (d) {
    const dateStr = month + "-" + String(d).padStart(2, "0")
    try {
      const res = await fetch(url + "?date=" + dateStr, {
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY, "x-admin-key": getAdminKey() || "" },
      })
      const data = await res.json()
      const list = DOMAIN === "class" ? data.classes : data.schedules
      if (res.ok && list && list.length) items[dateStr] = true
    } catch (err) {}
  }))
  if (month !== CAL_PANEL_MONTH) return
  CAL_PANEL_ITEMS = items
  renderCalPanel()
}

function weekStartOf(dateStr) {
  const d = new Date(dateStr + "T00:00:00+09:00")
  d.setDate(d.getDate() - d.getDay())
  return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul" }).format(d)
}
function weekEndOf(weekStartStr) {
  const d = new Date(weekStartStr + "T00:00:00+09:00")
  d.setDate(d.getDate() + 6)
  return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul" }).format(d)
}
function initDefaultWeek() {
  const today = kstToday()
  const base = today.slice(0, 7) === CAL_PANEL_MONTH ? today : (CAL_PANEL_MONTH + "-01")
  SELECTED_WEEK_START = weekStartOf(base)
  SELECTED_WEEK_END = weekEndOf(SELECTED_WEEK_START)
}
function selectCalWeek(weekStartStr) {
  SELECTED_WEEK_START = weekStartStr
  SELECTED_WEEK_END = weekEndOf(weekStartStr)
  renderCalPanel()
  renderReportList()
}

function renderCalPanel() {
  const parts = CAL_PANEL_MONTH.split("-").map(Number)
  const y = parts[0], m = parts[1]
  const first = new Date(y, m - 1, 1)
  const startWeekday = first.getDay()
  const daysInMonth = new Date(y, m, 0).getDate()
  const today = kstToday()
  const dows = ["일", "월", "화", "수", "목", "금", "토"]
  const isWeeklyReport = DOMAIN === "report" && REPORT_TYPE === "weekly"
  const isMonthOnly = DOMAIN === "tuition" || (DOMAIN === "report" && REPORT_TYPE === "monthly")
  let cells = dows.map(function (d) { return '<div class="mc-dow">' + d + '</div>' }).join("")
  for (let i = 0; i < startWeekday; i++) cells += '<div class="mc-day empty"></div>'
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = CAL_PANEL_MONTH + "-" + String(d).padStart(2, "0")
    let cls = "mc-day"
    if (dateStr === today) cls += " today"
    if (isWeeklyReport) {
      if (SELECTED_WEEK_START && dateStr >= SELECTED_WEEK_START && dateStr <= SELECTED_WEEK_END) cls += " week-selected"
      cells += '<div class="' + cls + '" onclick="selectCalWeek(' + attrSafe(weekStartOf(dateStr)) + ')">' + d + '</div>'
    } else if (isMonthOnly) {
      cells += '<div class="' + cls + ' no-select">' + d + '</div>'
    } else {
      if (dateStr === CURRENT_DATE) cls += " selected"
      const dot = CAL_PANEL_ITEMS[dateStr] ? '<span class="mc-day-dot"></span>' : ""
      cells += '<div class="' + cls + '" onclick="goToDateFromCalendarPanel(' + attrSafe(dateStr) + ')">' + d + dot + '</div>'
    }
  }
  el("cal-panel-area").innerHTML = '<div class="mc-grid">' + cells + '</div>'
}

function goToDateFromCalendarPanel(dateStr) {
  CURRENT_DATE = dateStr
  if (isMobileLayout()) {
    CALENDAR_OPEN = false
    el("calendar-panel").classList.remove("open")
  } else if (CALENDAR_OPEN) {
    renderCalPanel()
  }
  loadCenterList()
}

async function refreshClassList(dateStr, silent) {
  try {
    const res = await fetch(GET_CLASSES_URL + "?date=" + dateStr, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY, "x-admin-key": getAdminKey() || "" },
    })
    const data = await res.json()
    if (!res.ok) throw new Error(data.error || ("HTTP " + res.status))
    const classes = data.classes || []
    CLASS_LIST_CACHE[dateStr] = classes
    if (dateStr !== CURRENT_DATE || DOMAIN !== "class") return
    CLASSES = classes
    renderClassList()
    setStatus(null)
  } catch (err) {
    if (!silent) setStatus("error", "불러오기 실패: " + err.message)
  }
}

function filteredClasses() {
  if (!SEARCH_TERM) return CLASSES
  return CLASSES.filter(function (c) {
    const hay = [c.className, c.teacherName, c.method, c.studySummary, c.assignmentSummary, c.evaluationSummary]
      .concat((c.students || []).map(function (s) { return s.name }))
      .filter(Boolean).join(" ").toLowerCase()
    return hay.indexOf(SEARCH_TERM) >= 0
  })
}

function classEmoji(c) {
  // 노션 클래스(학원) DB의 "이모지" 속성 값을 그대로 사용해요. 백엔드가 emoji 필드를 안 내려주는 동안만 학년별 기본값으로 대체해요.
  if (c && c.emoji) return c.emoji
  const n = String((c && c.className) || "")
  if (n.indexOf("고") >= 0) return "🎓"
  if (n.indexOf("중") >= 0) return "📘"
  if (n.indexOf("초") >= 0) return "🐣"
  return "📚"
}

function teacherColorClass(name) {
  const palette = ["tb-gray", "tb-brown", "tb-orange", "tb-yellow", "tb-green", "tb-blue", "tb-purple", "tb-pink", "tb-red"]
  const s = String(name || "")
  let hash = 0
  for (let i = 0; i < s.length; i++) hash = (hash * 31 + s.charCodeAt(i)) >>> 0
  return palette[hash % palette.length]
}

function parseAttendanceRate(raw) {
  if (!raw) return null
  const m = String(raw).match(/(\d+)\s*%\s*(\([^)]*\))?/)
  if (!m) return null
  return { pct: Number(m[1]), text: "출석률 " + m[1] + "%" + (m[2] ? " " + m[2] : "") }
}

function attendanceRateTone(pct) {
  if (pct >= 100) return "tone-blue"
  if (pct >= 90) return "tone-green"
  if (pct >= 70) return "tone-yellow"
  if (pct >= 50) return "tone-orange"
  return "tone-red"
}

function renderClassList() {
  const listEl = el("class-list-area")
  const list = filteredClasses()
  if (list.length === 0) {
    listEl.innerHTML = '<div class="empty">해당 날짜에 수업이 없어요</div>'
    return
  }
  listEl.innerHTML = list.map(function (c) {
    const expanded = EXPANDED_CLASS_ID === c.id
    const selected = SELECTED_CLASS_ID === c.id
    const rate = parseAttendanceRate(c.attendanceRate)
    return '<div class="class-item' + (selected ? " selected" : "") + '" data-id="' + c.id + '">' +
      '<div class="class-item-head" onclick="onClassClick(' + attrSafe(c.id) + ')">' +
        '<div class="class-item-title-row"><span class="class-item-title">' + classEmoji(c) + ' ' + esc(c.className) + '</span><span class="class-item-time">' + esc(c.timeRange || "") + '</span></div>' +
        '<div class="class-item-badges">' +

    '<div class="info-card"><h3>📄 평가 결과</h3><div class="info-content' + (c.evaluationSummary ? '' : ' empty') + '">' + esc(c.evaluationSummary || "기록 없음") + '</div></div>'

function toggleRightSummary() {
  const body = el("right-summary-body")

  const label = el("right-summary-toggle-label")

function setRightTab(tab, force) {
  if (RIGHT_TAB === tab && !force) return
  RIGHT_TAB = tab
  document.querySelectorAll(".right-tab").forEach(function (b) { b.classList.toggle("active", b.dataset.tab === tab) })

}

function renderRightTabBody() {

// 학생 목록의 출결/과제 상태를 집계해서 출석 현황·과제 현황 두 박스에 표시할 인원수를 계산해요.
function summarizeStudents(students) {
  const stat = { attend: 0, makeup: 0, absent: 0, done: 0, partial: 0, none: 0 }
  ;(students || []).forEach(function (s) {
    if (s.status === "출석") stat.attend++
    else if (s.status === "보강") stat.makeup++
    else if (s.status === "결석") stat.absent++
    if (s.homework) {
      if (s.homework.status === "완료") stat.done++
      else if (s.homework.status === "부분완료") stat.partial++
      else if (s.homework.status === "미완료") stat.none++
    }
  })
  return stat
}

function renderStudentsTab(c, body) {
  const students = c.students || []
  if (students.length === 0) { body.innerHTML = '<div class="empty">출석 기록이 없어요</div>'; return }
  body.innerHTML = students.map(function (s, i) {
    const cls = statusBadgeClass[s.status] || "gray"
    const canSend = !!s.attendanceId
    const homeworkCls = s.homework ? (homeworkBadgeClass[s.homework.status] || "tone-gray") : ""
    const homeworkBadge = s.homework ? ' <span class="badge ' + homeworkCls + '">과제 ' + s.homework.status + '</span>' : ""
    const evalCls = s.evaluation ? attendanceRateTone(s.evaluation.score) : ""
    const evalBadge = s.evaluation ? ' <span class="badge ' + evalCls + '">' + s.evaluation.score + '점</span>' : ""
    return '<div class="student-row"><span class="stu-name">🧑‍🎓 ' + esc(s.name) +
      (s.url ? ' <a class="stu-view" href="' + s.url + '" target="_blank">노션에서 보기 ↗</a>' : "") + ' ' +
      (s.status ? '<span class="badge ' + cls + '">' + s.status + '</span>' : "") + homeworkBadge + evalBadge + '</span>' +
      '<button class="send-btn" id="stu-send-' + i + '" onclick="sendStudentReport(' + i + ')" ' + (canSend ? "" : "disabled") + '>📩 전송</button></div>'
  }).join("")
}

// 과제/평가 탭은 수업(학원) DB의 "과제 안내"/"평가 결과" 수식 값을 그대로 보여줍니다.
// 이 값은 클래스 목록을 불러올 때 이미 함께 계산되어 있으므로, 탭을 열 때마다
// 별도로 과제 상세 페이지를 다시 불러올 필요가 없습니다(더 빠르게 표시됨).
async function fetchClassDetail(classId) {
  if (CLASS_DETAIL_CACHE[classId]) return CLASS_DETAIL_CACHE[classId]
  const res = await fetch(GET_CLASS_DETAIL_URL, {
    method: "POST",
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY, "Content-Type": "application/json", "x-admin-key": getAdminKey() || "" },
    body: JSON.stringify({ classSessionId: classId }),
  })
  const data = await res.json()
  if (!res.ok) throw new Error(data.error || ("HTTP " + res.status))
  CLASS_DETAIL_CACHE[classId] = data
  return data
}

// 여러 후보 필드명 중 값이 있는 첫 번째 필드를 그대로 반환해요.
// 백엔드 응답 필드명이 바뀌거나 통일되지 않은 경우에도 값을 놓치지 않기 위한 방어적 처리예요.
function pickField(obj, keys) {
  if (!obj) return null
  for (let i = 0; i < keys.length; i++) {
    const v = obj[keys[i]]
    if (v !== undefined && v !== null && v !== "") return v
  }
  return null
}

// 평가 탭은 우선 get-class-detail의 학습기록(평가) 레코드를 조회해서 리포트 페이지처럼 "N점 (정답/전체)" 형태로 보여주고,
// 이 정보가 없으면 기존의 "평가 결과" 요약 텍스트로 대체해요(하위 호환).
// 과제 탭은 마감일을 반영하기 위해 get-class-detail을 통해 학습기록(과제) 목록을 따로 조회합니다.
// (조금 느리지만 마감일을 다시 보여줄 수 있습니다.) 결과는 CLASS_DETAIL_CACHE에 캐싱되어 재조회를 최소화합니다.
// 보고서 페이지와 동일하게, 부가 정보는 제목 아래에 "  • 라벨: 값" 형태로 한 줄씩 통일해서 보여줘요.
function bulletLine(label, value) {
  if (value === null || value === undefined || value === "") return ""
  return '<div class="meta" style="margin-top:4px">' + esc("  • " + label + ": " + value) + '</div>'
}

async function renderTaskTab(c, body, kind) {
  if (kind === "evaluation") {
    body.innerHTML = '<div class="empty">불러오는 중...</div>'
    try {
      const data = await fetchClassDetail(c.id)
      const records = (data.evaluations && data.evaluations.records) || (data.tests && data.tests.records) || []
      const activities = (data.evaluations && data.evaluations.activities) || []
      // 점수/정답/전체 문항은 반 전체 공통 설명인 records가 아니라, 학생별 인스턴스인 activities에만 있어요.
      // (레코드에는 title/book/range만 있고 점수 필드 자체가 없어서 예전 코드는 항상 점수가 비어 보였어요.)
      if (activities.length > 0) {
        const recordById = {}
        records.forEach(function (r) { recordById[r.id] = r })
        body.innerHTML = activities.map(function (a) {
          const rec = recordById[a.recordId] || {}
          const total = pickField(a, ["totalCount", "totalQuestions", "total", "전체문항", "전체 문항"])
          const correct = pickField(a, ["correctCount", "correctQuestions", "correct", "정답문항", "정답 문항"])
          const score = pickField(a, ["score", "점수"])
          const scoreText = (score !== null ? score + "점" : "") + (total ? " (" + (correct !== null ? correct : "?") + "/" + total + ")" : "")
          return '<div class="record-card"><div class="title"><a href="' + (a.url || rec.url || "#") + '" target="_blank">' + esc(rec.title || "평가") + '</a></div>' +
            '<div class="meta">교재: ' + esc(rec.book || "-") + (rec.range ? " · 범위: " + esc(rec.range) : "") + '</div>' +
            bulletLine("학생", a.studentName) +
            (scoreText ? bulletLine("점수", scoreText) : "") +
            '</div>'
        }).join("")
        return
      }
      if (records.length > 0) {
        body.innerHTML = records.map(function (r) {
          return '<div class="record-card"><div class="title"><a href="' + r.url + '" target="_blank">' + esc(r.title || "평가") + '</a></div>' +
            '<div class="meta">교재: ' + esc(r.book || "-") + (r.range ? " · 범위: " + esc(r.range) : "") + '</div>' +
            '</div>'
        }).join("")
        return
      }
    } catch (err) {
      // 상세 조회가 실패하면 아래 요약 텍스트로 폴백해요.
    }
    const summary = c.evaluationSummary
    body.innerHTML = summary
      ? '<div class="record-card"><div class="meta">' + esc(summary) + '</div></div>'
      : '<div class="empty">등록된 평가 정보가 없어요</div>'
    return
  }
  body.innerHTML = '<div class="empty">불러오는 중...</div>'
  try {
    const data = await fetchClassDetail(c.id)
    const records = (data.assignments && data.assignments.records) || []
    const activities = (data.assignments && data.assignments.activities) || []
    // 마감일은 반 전체 공통 설명인 records가 아니라, 학생별 인스턴스인 activities에만 있어요(같은 과제면 보통 동일해요).
    // recordId로 매칭되는 첫 번째 activity의 마감일을 해당 기록의 마감일로 사용해요.
    const dueByRecordId = {}
    activities.forEach(function (a) {
      if (a.recordId && a.dueDate && !dueByRecordId[a.recordId]) dueByRecordId[a.recordId] = a.dueDate
    })
    let html = ""
    if (records.length === 0) {
      html = '<div class="empty">등록된 과제 설명이 없어요</div>'
    } else {
      html = records.map(function (r) {
        const due = pickField(r, ["dueDate", "due_iso", "due", "dueAt", "과제마감일", "과제 마감일"]) || dueByRecordId[r.id] || null
        // r.content는 이미 자체적인 서식(줄바꿈, 자체 불릿 등)을 포함하고 있을 수 있어서,
        // "내용:" 라벨로 감싸면 이중 불릿·줄바꿈 깨짐이 생겨요. 그래서 원본 그대로 별도 줄에 보여줘요.
        return '<div class="record-card"><div class="title"><a href="' + r.url + '" target="_blank">' + esc(r.title) + '</a></div>' +
          '<div class="meta">교재: ' + esc(r.book) + (r.range ? " · 범위: " + esc(r.range) : "") + '</div>' +
          (r.content ? '<div class="meta" style="margin-top:4px">' + esc(r.content) + '</div>' : "") +
          bulletLine("마감일", due ? formatDateLabel(due) : "미정") +
          '</div>'
      }).join("")
    }
    body.innerHTML = html
  } catch (err) {
    body.innerHTML = '<div class="empty">불러오기 실패: ' + esc(err.message) + '</div>'
  }
}

// ---------------- 일정 목록(중앙) ----------------
async function loadScheduleList(dateStr) {
  el("date-nav-label").textContent = formatDateLabel(dateStr)
  const cached = SCHEDULE_LIST_CACHE[dateStr]
  if (cached) {
    SCHEDULES = cached
    renderScheduleList()
    clearRightPanel()
    setStatus(null)
    refreshScheduleList(dateStr, true)
    return
  }
  setStatus("loading", "일정 목록을 불러오는 중이에요...")
  SCHEDULES = []
  renderScheduleList()
  clearRightPanel()
  await refreshScheduleList(dateStr, false)
}

async function refreshScheduleList(dateStr, silent) {
  try {
    const res = await fetch(GET_SCHEDULES_URL + "?date=" + dateStr, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY, "x-admin-key": getAdminKey() || "" },
    })
    const data = await res.json()
    if (!res.ok) throw new Error(data.error || ("HTTP " + res.status))
    const schedules = data.schedules || []
    SCHEDULE_LIST_CACHE[dateStr] = schedules
    if (dateStr !== CURRENT_DATE || DOMAIN !== "schedule") return
    SCHEDULES = schedules
    renderScheduleList()
    setStatus(null)
  } catch (err) {
    if (!silent) setStatus("error", "불러오기 실패: " + err.message)
  }
}

function filteredSchedules() {
  if (!SEARCH_TERM) return SCHEDULES
  return SCHEDULES.filter(function (s) {
    const hay = [s.name, s.category, s.status, s.memo, s.relatedText]
      .concat(s.teacherNames || [], s.classNames || [], s.tags || [])
      .filter(Boolean).join(" ").toLowerCase()
    return hay.indexOf(SEARCH_TERM) >= 0
  })
}

function findSchedule(id) { return SCHEDULES.find(function (s) { return s.id === id }) }

function renderScheduleList() {
  const listEl = el("schedule-list-area")
  const list = filteredSchedules()
  if (list.length === 0) {
    listEl.innerHTML = '<div class="empty">해당 날짜에 일정이 없어요</div>'
    return
  }
  listEl.innerHTML = list.map(function (s) {
    const selected = SELECTED_SCHEDULE_ID === s.id
    return '<div class="schedule-item' + (selected ? " selected" : "") + '" onclick="selectSchedule(' + attrSafe(s.id) + ')">' +
      '<div class="schedule-item-title-row"><span class="schedule-item-title">' + esc(s.name) + '</span></div>' +
      '<div class="schedule-item-badges">' +
        (s.category ? '<span class="badge ' + s.categoryColor + '">' + esc(s.category) + '</span>' : "") +
        (s.status ? '<span class="badge gray">' + esc(s.status) + '</span>' : "") +
        (s.teacherNames || []).map(function (n) { return '<span class="badge blue">' + esc(n) + '</span>' }).join("") +
        (s.classNames || []).map(function (n) { return '<span class="badge gray">' + esc(n) + '</span>' }).join("") +
      '</div>' +
    '</div>'
  }).join("")
}

function selectSchedule(id) {
  SELECTED_SCHEDULE_ID = id
  const s = findSchedule(id)
  if (!s) return
  renderScheduleList()
  el("md-right-empty").style.display = "none"
  el("md-right-content").style.display = "block"
  el("right-title").textContent = s.name
  el("right-sub").textContent = [s.category, s.status].filter(Boolean).join(" · ")
  el("right-page-link").href = s.url
  renderScheduleDetail(s)
  openMobileDetail()
}

function renderScheduleDetail(s) {
  const body = el("right-tab-body")
  function field(label, valueHtml) {
    return '<div class="schedule-detail-field"><b>' + esc(label) + '</b><div class="val">' + valueHtml + '</div></div>'
  }
  let html = ""
  html += field("날짜", esc(s.date ? formatDateLabel(s.date.slice(0, 10)) : "-"))
  html += field("구분", s.category ? '<span class="badge ' + s.categoryColor + '">' + esc(s.category) + '</span>' : "-")
  html += field("진행상태", s.status ? '<span class="badge gray">' + esc(s.status) + '</span>' : "-")
  if (s.relatedText) html += field("관련 대상", esc(s.relatedText))
  if (s.memo) html += field("메모", esc(s.memo).replace(/\n/g, "<br>"))
  if ((s.tags || []).length) html += field("태그", s.tags.map(function (t) { return '<span class="badge gray">' + esc(t) + '</span>' }).join(" "))
  html += '<div class="schedule-detail-hint" style="margin-top:16px;color:var(--muted);font-size:12px">✏️ 수정은 노션에서 해주세요 (대시보드는 보기 전용이에요)</div>'
  body.innerHTML = html
}

// ---------------- 알림톡 발송 ----------------
async function callSendDailyReport(payload) {

    method: "POST",

    body: JSON.stringify(payload),
  })
  const data = await res.json().catch(function () { return {} })
  if (!res.ok) throw new Error(data.error || ("HTTP " + res.status))

// 전송 버튼을 누르면 곰바로 발송하지 않고, HTML에 이미 있던 확인 모달(alimtalk-modal)을 먼저 보여줘요.
// 사용자가 "발송"을 누르면 confirmAlimtalkSend()가 실제 발송 로직을 실행해요.
let ALIMTALK_PENDING = null // { kind: "student", index } | { kind: "bulk", classId }

function openAlimtalkModal(kind, payload) {
  ALIMTALK_PENDING = { kind: kind, payload: payload }
  const textEl = el("alimtalk-modal-text")
  textEl.textContent = kind === "student"
    ? payload.studentName + " 학생에게 오늘의 학습 리포트 알림톡을 발송하시겠습니까?"
    : payload.count + "명의 학생에게 오늘의 학습 리포트 알림톡을 일괄 발송하시겠습니까?"
  el("alimtalk-modal").classList.add("show")
}

function closeAlimtalkModal() {
  el("alimtalk-modal").classList.remove("show")
  ALIMTALK_PENDING = null
}

async function confirmAlimtalkSend() {
  const pending = ALIMTALK_PENDING
  closeAlimtalkModal()
  if (!pending) return
  if (pending.kind === "student") {
    await doSendStudentReport(pending.payload.index)
  } else if (pending.kind === "bulk") {
    await doSendBulkForClass(pending.payload.classId)
  }
}

function sendStudentReport(i) {
  const c = findClass(SELECTED_CLASS_ID)
  if (!c) return
  const s = (c.students || [])[i]
  if (!s || !s.attendanceId) return
  openAlimtalkModal("student", { index: i, studentName: s.name })
}

async function doSendStudentReport(i) {
  const c = findClass(SELECTED_CLASS_ID)
  if (!c) return
  const s = (c.students || [])[i]
  if (!s || !s.attendanceId) return
  const btn = el("stu-send-" + i)
  if (btn) { btn.disabled = true; btn.textContent = "발송중..." }
  try {
    await callSendDailyReport({ registrationId: s.registrationId, attendanceId: s.attendanceId })
    showToast(esc(s.name) + "에게 알림톡을 발송했어요")
  } catch (err) {
    showToast("발송 실패: " + err.message)
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "📩 전송" }
  }
}

function sendBulkForClass(classId) {
  const c = findClass(classId)
  if (!c) return
  const targets = (c.students || []).filter(function (s) { return s.attendanceId })
  if (targets.length === 0) { showToast("전송할 학생이 없어요"); return }
  openAlimtalkModal("bulk", { classId: classId, count: targets.length })
}

async function doSendBulkForClass(classId) {
  const c = findClass(classId)
  if (!c) return
  const targets = (c.students || []).filter(function (s) { return s.attendanceId })
  if (targets.length === 0) { showToast("전송할 학생이 없어요"); return }
  let success = 0, fail = 0
  for (const s of targets) {
    try {
      await callSendDailyReport({ registrationId: s.registrationId, attendanceId: s.attendanceId })
      success++
    } catch (_e) {
      fail++
    }
  }
  showToast(success + "건 발송 완료" + (fail ? ", " + fail + "건 실패" : ""))
}

// ---------------- 초기 로딩 ----------------
function loadDashboard() {
  loadCenterList()
  if (CALENDAR_OPEN) loadCalendarPanel()
}

if (getAdminKey()) {
  showAppScreen()
} else {
  showLoginScreen()
}
</script>
