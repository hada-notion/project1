name: Class room copy sync (manual)

# 수업 관리 복사본(v2.5.113) 수동 동기화. 처음 채우기는 mode=reconcile. Notion은 읽기만 하고 Supabase cr_* 표에만 쓴다.
# 함수 한 번 실행 시간 한도(150초) 안에 끝나도록 표 하나씩 따로 부른다. 정기 실행은 다음 단계(pg_cron)에서 정한다.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "reconcile(기간 전체 대조) 또는 incremental(바뀐 것만)"
        required: true
        default: reconcile
        type: choice
        options: [reconcile, incremental]
      from_days:
        description: "reconcile: 며칠 전부터(기본 120)"
        required: false
        default: "120"
      to_days:
        description: "reconcile: 며칠 뒤까지(기본 60)"
        required: false
        default: "60"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync-class-room-copy for each table
        run: |
          set -e
          case "$FROM_DAYS$TO_DAYS" in (*[!0-9]*|'') echo "from_days/to_days must be numbers"; exit 1;; esac
          for t in cr_sessions cr_attendance cr_records cr_activities; do
            if [ "$MODE" = "reconcile" ]; then
              body="{\"mode\":\"reconcile\",\"table\":\"$t\",\"fromDays\":$FROM_DAYS,\"toDays\":$TO_DAYS}"
            else
              body="{\"mode\":\"incremental\",\"table\":\"$t\"}"
            fi
            echo "== $t =="
            # --fail-with-body: HTTP 오류를 job 실패로 표시한다(응답 본문은 로그에 남김).
            curl -sS --fail-with-body --max-time 160 -X POST "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/sync-class-room-copy" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              -H "x-admin-key: ${{ secrets.ADMIN_SECRET }}" \
              -H "Content-Type: application/json" \
              -d "$body"
            echo
          done
        env:
          MODE: ${{ inputs.mode }}
          FROM_DAYS: ${{ inputs.from_days }}
          TO_DAYS: ${{ inputs.to_days }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
