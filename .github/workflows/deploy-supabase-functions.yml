name: Deploy Supabase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'tests/admin-security-sql.cjs'
      - 'tests/class-room-copy-sql.cjs'
      - 'tests/class-room-copy-cron-sql.cjs'
  workflow_dispatch: {}

# 저장소 읽기만 한다. 배포·호출에 쓰는 값은 Secrets에서 읽는다(v2.7.19).
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Type-check all functions (deno check)
        run: |
          set -e
          for f in supabase/functions/*/index.ts; do
            echo "== deno check $f =="
            deno check "$f"
          done

      - name: Test kiosk identity and directory guards
        run: deno test --allow-env supabase/functions/_shared/kioskIdentity_test.ts supabase/functions/_shared/kioskSendLog_test.ts supabase/functions/_shared/academyName_test.ts supabase/functions/_shared/stepTiming_test.ts supabase/functions/_shared/kioskToday_test.ts supabase/functions/_shared/kioskPolicy_test.ts

      - name: Test assignment deadlines and chronological bulk order
        run: deno test --allow-env supabase/functions/_shared/assignmentDeadline_test.ts supabase/functions/_shared/bulkClassOrder_test.ts supabase/functions/generate-classes/index_test.ts

      - name: Test individual textbook ownership and class lookup
        run: deno test --allow-env supabase/functions/_shared/registrationTextbookTarget_test.ts supabase/functions/_shared/learningRecordShare_test.ts supabase/functions/_shared/fixAttendanceTarget_test.ts supabase/functions/_shared/createLearningRecordBlock_test.ts supabase/functions/_shared/sessionDateMove_test.ts supabase/functions/_shared/dailyReportQueue_test.ts supabase/functions/_shared/assignmentPlan_test.ts supabase/functions/_shared/noticeQueue_test.ts supabase/functions/_shared/cartPlan_test.ts supabase/functions/_shared/routineCheck_test.ts supabase/functions/_shared/createLearningRecordPlan_test.ts supabase/functions/_shared/reportCacheBuilder_test.ts supabase/functions/_shared/classReportPlan_test.ts supabase/functions/_shared/evaluationPlan_test.ts supabase/functions/_shared/lessonNotice_test.ts supabase/functions/_shared/scheduleNotice_test.ts supabase/functions/_shared/monthlyNotice_test.ts supabase/functions/_shared/noticeBlocks_test.ts supabase/functions/_shared/alimtalkConfig_test.ts supabase/functions/_shared/cascadeDeleteLean_test.ts supabase/functions/_shared/relationFull_test.ts supabase/functions/_shared/propAliases_test.ts supabase/functions/_shared/menuDataSource_test.ts

      - name: Test class room reads, saves, records and makeup sessions
        run: deno test --allow-env supabase/functions/_shared/classRoom_test.ts supabase/functions/_shared/classRoomCopy_test.ts supabase/functions/_shared/classRoomRead_test.ts

      - name: Test attendance scheduled-only modes
        run: deno test --allow-env supabase/functions/sync-attendance/index_test.ts supabase/functions/_shared/attendanceSyncShared_test.ts

      - name: Test textbook search and table-of-contents units
        run: deno test --allow-env supabase/functions/_shared/textbookToc_test.ts supabase/functions/_shared/textbookSearch_test.ts supabase/functions/_shared/libraryProp_test.ts supabase/functions/_shared/libraryCopy_test.ts supabase/functions/_shared/selectedUnits_test.ts

      - name: Test schedule visibility and NEIS defaults
        run: deno test --allow-env supabase/functions/_shared/neisSchool_test.ts supabase/functions/_shared/neisManual_test.ts supabase/functions/_shared/scheduleVisibility_test.ts

      - name: Test administrator authentication and key scopes
        run: deno test --allow-env --allow-read=admin_settings.js supabase/functions/_shared/adminSecurity_test.ts

      - name: Test security migration and transactional Vault rollback
        run: |
          npm install --prefix "$RUNNER_TEMP/hada-security-tests" @electric-sql/pglite@0.5.8 --no-audit --no-fund
          PGLITE_MODULE="$RUNNER_TEMP/hada-security-tests/node_modules/@electric-sql/pglite" node tests/admin-security-sql.cjs
          PGLITE_MODULE="$RUNNER_TEMP/hada-security-tests/node_modules/@electric-sql/pglite" node tests/class-room-copy-sql.cjs
          PGLITE_MODULE="$RUNNER_TEMP/hada-security-tests/node_modules/@electric-sql/pglite" node tests/class-room-copy-cron-sql.cjs

      - name: Run regression guard checks
        run: bash scripts/check-known-regressions.sh

      # 버전을 고정한다. "latest"는 최신 버전을 GitHub에 묻는데, 그 조회가 사용 한도에 걸리면
      # 배포 전체가 멈춘다(2026-10-13 실제로 발생). 올릴 때는 이 값만 바꾼다.
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Push database migrations
        run: |
          set -e
          # 비밀번호에 특수문자(@, :, / 등)가 있으면 접속 URL이 깨지므로 percent-encode 해서 넣는다.
          # 복사/붙여넣기 과정에서 섞여 들어갈 수 있는 앞뒤 공백/개행 문자도 제거한다.
          ENCODED_DB_PASSWORD=$(python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['SUPABASE_DB_PASSWORD'].strip(), safe=''))")
          supabase db push --db-url "postgresql://postgres.${SUPABASE_PROJECT_ID}:${ENCODED_DB_PASSWORD}@aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres"
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Deploy all Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Verify deployed function list matches repository
        run: |
          set -e
          LIST_OUTPUT=$(supabase functions list --project-ref "$SUPABASE_PROJECT_ID")
          echo "$LIST_OUTPUT"
          MISSING=""
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            [ "$name" = "_shared" ] && continue
            if ! echo "$LIST_OUTPUT" | grep -qF "$name"; then
              MISSING="$MISSING $name"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::배포 목록에서 확인되지 않은 함수:$MISSING"
            exit 1
          fi
          echo "저장소의 모든 함수가 배포 목록에서 확인되었습니다."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Verify baseline required Secrets are present
        run: |
          set -e
          SECRETS_OUTPUT=$(supabase secrets list --project-ref "$SUPABASE_PROJECT_ID")
          echo "$SECRETS_OUTPUT"
          # 여기 나열된 4개는 코드에서 확인 가능한 최소 기본값이며, 실제 필요한 Secrets 전체 목록은 아니다.
          MISSING=""
          for name in SB_URL SB_SERVICE_ROLE_KEY NOTION_TOKEN ADMIN_SECRET; do
            if ! echo "$SECRETS_OUTPUT" | grep -qF "$name"; then
              MISSING="$MISSING $name"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::warning::기본 필수 Secret 중 이름을 찾을 수 없는 항목이 있습니다 (다른 이름으로 설정되어 있을 수도 있음):$MISSING"
          else
            echo "기본 필수 Secret(SB_URL, SB_SERVICE_ROLE_KEY, NOTION_TOKEN, ADMIN_SECRET)이 모두 확인되었습니다."
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Show migration status
        run: |
          set -e
          ENCODED_DB_PASSWORD=$(python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['SUPABASE_DB_PASSWORD'].strip(), safe=''))")
          supabase migration list --db-url "postgresql://postgres.${SUPABASE_PROJECT_ID}:${ENCODED_DB_PASSWORD}@aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres"
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
