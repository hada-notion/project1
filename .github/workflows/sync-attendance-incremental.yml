name: Sync Attendance (incremental)

on:
  # v2.5.13: 정기 실행(매시간 15분)은 해제했다. 학부모 리포트는 보고서 발송 직전과
  # "학생 페이지 동기화" 버튼에서 등록 단위로 최신화하므로, 정리되지 않은 중간 상태를
  # 학부모 화면에 자동으로 내보내지 않는다. 필요할 때만 Actions 탭에서 수동 실행한다.
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync-attendance (mode=incremental)
        run: |
          set -e
          # --fail-with-body: 401 등 HTTP 오류를 job 실패로 표시한다(응답 본문은 로그에 남김).
          curl -sS --fail-with-body -X POST "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/sync-attendance" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "x-admin-key: ${{ secrets.ADMIN_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"mode":"incremental"}'
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
