name: Nightly Dashboard Link Audit

on:
  schedule:
    # 매일 16:35 UTC = 한국시간(KST, UTC+9) 새벽 1시 35분. 보고서 동기화 점검(1시 30분) 직후,
    # 오늘 수업/출석/일정 중 대시보드 연결이 빠진 건이 있으면 다시 연결합니다.
    - cron: '35 16 * * *'
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Call nightly-dashboard-link-audit
        run: |
          set -e
          curl -sS -X POST "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/nightly-dashboard-link-audit" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "x-admin-key: ${{ secrets.ADMIN_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{}'
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
