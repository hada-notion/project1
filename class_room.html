.center-tabs .tabs{position:relative;background:transparent;padding:0 var(--space-1);gap:0}

/* 수업 한 줄(v2.5.70): [클래스 이모지] [클래스명] [등원 n/전체] [수업 시간]. 등원은 0명 회색, 일부 노랑, 모두 초록 */
.srow{min-height:calc(var(--hit-min) + var(--space-4))}
.emo{flex:none;width:var(--hit-area);height:var(--hit-area);border-radius:var(--radius-md);background:var(--brand-tint);display:inline-flex;align-items:center;justify-content:center;font-size:var(--text-title)}
.emo .pill{font-size:var(--text-caption);padding:var(--space-1)}
.emo.ico{background:var(--brand-soft);color:var(--brand-deep)}
.emo.ico svg.line{width:var(--icon-md);height:var(--icon-md)}
.cnt-pill{flex:none;font-size:var(--text-caption);font-weight:700;padding:var(--space-1) var(--space-2);border-radius:var(--radius-pill);background:var(--brand-soft);color:var(--text-muted);font-variant-numeric:tabular-nums}
.cnt-pill.part{background:var(--warning-soft);color:var(--warning-ink)}
.cnt-pill.ok{background:var(--success-soft);color:var(--success-ink)}
.time{flex:none;width:calc(var(--hit-area) + var(--space-12));text-align:right;color:var(--text-muted);font-size:var(--text-label);font-variant-numeric:tabular-nums}
.time.chev{width:auto;font-size:var(--text-title);color:var(--text-subtle)}
.list.wait{margin-top:var(--space-3)}
/* 강사 이름 경로 버튼: 리포트 경로 글자 그대로, 누르는 영역 44px */
.crumb-btn{min-height:var(--hit-min);padding:0;border:0;background:transparent;font:inherit;font-weight:700;color:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--brand-mid);white-space:nowrap}
/* 넓은 화면은 아래에서 올라오는 창 대신 가운데 대화상자 */
@media(min-width:1081px){
 dialog.sheet{width:min(100%,var(--dialog-md));margin:auto;border-bottom-left-radius:var(--radius-lg);border-bottom-right-radius:var(--radius-lg)}
}
</style>
</head>
