<style>
/* 수업 관리(v2.5.67, v2.5.82에 이름 변경): 선생님이 쓰는 화면. v2.5.70부터 리포트처럼 모든 폭에서 640 한 줄. 모양은 학부모 리포트(상단 베이지 바, 하단 탭, 카드)를 따르고
   값은 공용 토큰만 쓴다(docs/DESIGN.md). 분류 색: 학습 --info, 과제 --warning, 평가 --success.
   소제목은 1부 4장 4단계(탭 제목 17px·아이콘 18 / 섹션 제목 15px·아이콘 16 / 묶음 라벨 13px 옅은색 / 카드 안 라벨)를 따른다. */
body{background:var(--canvas)}
/* 상단 바·하단 탭의 내용은 본문과 같은 폭(--feed-w, 리포트와 같음) 안에 두고 왼쪽 선을 맞춘다. */
.cr-bar{position:sticky;top:0;z-index:20;margin:0;background:var(--brand-primary);color:var(--brand-on-primary)}
/* 상단 바(v2.5.80): 학부모 리포트 상단 바(.reg-header-bar)처럼 화면 폭 전체, 양끝 버튼은 화면 가장자리에서 8px. 본문은 640 한 줄 그대로. */
.bar-in{min-height:var(--header-h);display:flex;align-items:center;gap:var(--space-1);padding:0 var(--space-2)}
/* 상단 바 간격 규칙(v2.5.83): 바 안쪽 여백 8px에 아이콘 버튼(44px)은 그대로 붙이고, 글자(제목·경로)가 바 끝에 오면 12px 더 들여
   아이콘 그림과 같은 선(화면 끝에서 20px)에서 시작·끝나게 한다. 로그인·강사 선택처럼 아이콘 없이 글자만 있어도 끝에 붙지 않는다. */
.bar-in>:not(.icon-btn):first-child{margin-left:var(--space-3)}
.bar-in>:not(.icon-btn):last-child{margin-right:var(--space-3)}
.cr-bar .crumbs{flex:1;min-width:0;display:flex;align-items:center;gap:var(--space-1);font-weight:700;font-size:var(--text-small);white-space:nowrap;overflow:hidden}
.cr-bar .crumbs span:last-child{overflow:hidden;text-overflow:ellipsis}
.cr-bar .crumbs .sep{opacity:.6}
/* 누르는 경로 글자(v2.5.98): 리포트 경로처럼 글자 그대로, 누르는 영역 44px, 마우스를 올리면 밑줄 */
.crumb-link{flex:none;min-height:var(--hit-min);padding:0;border:0;background:transparent;font:inherit;color:inherit;cursor:pointer;white-space:nowrap}
.crumb-link:hover,.crumb-link:focus-visible{text-decoration:underline;text-underline-offset:3px}
.cr-bar h1{flex:1;margin:0;font-size:var(--text-title)}
.icon-btn{width:var(--hit-area);height:var(--hit-area);min-width:var(--hit-min);border:0;background:transparent;color:inherit;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-md);cursor:pointer;text-decoration:none;padding:0}
.cr-bar .ghost{min-height:var(--hit-min);max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 본문 카드 안쪽 여백은 목록 줄과 같은 --space-4(리포트 18px에 가장 가까운 4px 단위 값) */
.cr-main .card{padding:var(--space-4)}
.cr-main .card .help:last-child{margin-bottom:0}
.cr-main .card>label:first-child{margin-top:0}
.cr-main .card .actions:last-child{margin-bottom:0}
.cr-main .ghost,dialog.sheet .ghost{min-height:var(--hit-min)}
.icon-btn svg{width:var(--icon-md);height:var(--icon-md)}
.cr-main{max-width:calc(var(--feed-w) + 2*var(--space-4));margin:0 auto;padding:var(--space-4) var(--space-4) var(--space-12)}
.cr-main.with-tabs{padding-bottom:calc(3*var(--space-12))}
.page-title{display:flex;align-items:center;gap:var(--space-2);min-height:var(--space-8);font-size:var(--text-lead);font-weight:700;margin:var(--space-2) 0 var(--space-1)}
.page-title .nl{margin:calc(-1*var(--space-2)) calc(-1*var(--space-3)) calc(-1*var(--space-2)) 0}
.page-title svg.line{width:var(--icon-title);height:var(--icon-title);flex:none}
.sec-title svg.line{width:var(--icon-section);height:var(--icon-section);flex:none}

.sec-title:first-child{margin-top:var(--space-1)}
/* 3단계 묶음 라벨(리포트 .rep-sub) */

.row{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);min-height:calc(var(--hit-min) + var(--space-4));width:100%;border:0;background:transparent;text-align:left;font:inherit;color:inherit}
.row+.row{border-top:1px solid var(--divider)}

.row.changed{box-shadow:inset 3px 0 0 var(--brand-deep)}
.av{flex:none;width:var(--hit-area);height:var(--hit-area);border-radius:50%;background:var(--brand-light);color:var(--brand-on-primary);display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.av.sq{border-radius:var(--radius-md);background:var(--brand-primary)}
.card-btn{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:0;border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:var(--space-4);margin-bottom:var(--space-3);cursor:pointer}
.card-btn .top{display:flex;align-items:center;gap:var(--space-3)}
.card-btn .meta{flex:1;min-width:0;display:block}
.card-btn .t{display:flex;align-items:center;gap:var(--space-1);flex-wrap:wrap;font-weight:700}
.card-btn .d{display:block;color:var(--text-muted);font-size:var(--text-label);margin-top:var(--space-1)}
.row .meta>span{display:block}
.row .meta>.t{display:flex}
.card-btn .facts{display:flex;gap:var(--space-2);flex-wrap:wrap;margin-top:var(--space-3)}
.fact{font-size:var(--text-caption);font-weight:700;padding:var(--space-1) var(--space-2);border-radius:var(--radius-sm);background:var(--brand-soft);color:var(--brand-deep)}
.fact.warn{background:var(--danger-soft);color:var(--danger-ink)}

.fact.info{background:var(--info-soft);color:var(--info-ink)}
.pill{display:inline-flex;align-items:center;font-size:var(--text-caption);font-weight:600;line-height:var(--space-4);padding:2px var(--space-3);border-radius:var(--radius-pill);background:var(--brand-soft);color:var(--text-muted)}
.pill.s-출석,.pill.k-평가,.pill.done{background:var(--success-soft);color:var(--success-ink)}
.pill.s-결석,.pill.miss{background:var(--danger-soft);color:var(--danger-ink)}
.pill.s-보강,.pill.k-학습,.pill.sub{background:var(--info-soft);color:var(--info-ink)}
.pill.k-과제,.pill.mid{background:var(--warning-soft);color:var(--warning-ink)}
.seg{display:inline-flex;background:var(--brand-soft);border-radius:var(--radius-md);padding:var(--space-1);gap:var(--space-1);flex:none}
.seg button{min-height:var(--hit-min);min-width:var(--hit-min);padding:0 var(--space-2);border:0;border-radius:var(--radius-sm);background:transparent;color:var(--text-muted);font-weight:700;font-size:var(--text-label);cursor:pointer}
.seg button.on{background:var(--surface);box-shadow:var(--shadow-card)}
.seg button.on.v-출석{color:var(--success-ink)}.seg button.on.v-결석,.seg button.on.v-미제출{color:var(--danger-ink)}.seg button.on.v-보강,.seg button.on.v-제출{color:var(--info-ink)}
.toolrow{display:flex;align-items:center;gap:var(--space-2);margin:0 0 var(--space-3)}
.toolrow .sum{flex:1;color:var(--text-muted);font-size:var(--text-label)}
.center-tabs{display:flex;justify-content:center;margin:0 0 var(--space-4)}
/* 전환 탭: 리포트 seg-toggle 모양(12px 알약, 3px 트랙)을 그리되, 버튼은 위아래 투명 여백으로 44px 클릭 영역을 채운다 */
.center-tabs .tabs{position:relative;background:var(--brand-soft);padding:var(--space-1);gap:0}
.center-tabs .tabs button{position:relative;padding:0;background:transparent;box-shadow:none;font-size:var(--text-caption)}
.center-tabs .tabs button::after{content:'';position:absolute;left:0;right:0;top:calc(-1.5*var(--space-1));bottom:calc(-1.5*var(--space-1))}
.center-tabs .tabs button span{display:block;padding:var(--space-2) var(--space-4);line-height:var(--space-4);border-radius:var(--radius-pill)}
.center-tabs .tabs button.active{background:transparent;box-shadow:none}
.center-tabs .tabs button.active span{background:var(--surface);color:var(--brand-deep);box-shadow:var(--shadow-card)}
.rec{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);margin-bottom:var(--space-3);overflow:hidden}
/* 분류 아이콘 칸(리포트 학습기록 .log-icon): 색은 분류색 -soft 바탕 + -ink 선 */
.kind-icon{flex:none;width:var(--hit-area);height:var(--hit-area);border-radius:var(--radius-md);display:inline-flex;align-items:center;justify-content:center}
.kind-icon svg.line{width:var(--icon-section);height:var(--icon-section)}
.kind-icon.k-학습,.page-title .k-학습{background:var(--info-soft);color:var(--info-ink)}
.kind-icon.k-과제,.page-title .k-과제{background:var(--warning-soft);color:var(--warning-ink)}
.kind-icon.k-평가,.page-title .k-평가{background:var(--success-soft);color:var(--success-ink)}
.page-title .kind-icon{width:var(--space-8);height:var(--space-8)}
/* 기록 카드(v2.5.89): 학부모 리포트 학습기록 카드(student_report.html .log-card·.log-icon·.log-title·.log-context·.log-extra-chevron·.log-extra)와 같은 규칙.
   아이콘 칸 44px에 아이콘과 구분 글자, 제목 14px 굵게, 아래 "• " 줄 12px 옅은 글자, 내용은 접어 두고 ⌄(테두리 원, 누르는 영역 44px)로 펼친다. */
.log-head{position:relative}
.log-main{display:block;width:100%;padding:var(--space-4);border:0;background:transparent;font:inherit;color:inherit;text-align:left;cursor:pointer}
.log-card.has-extra .log-main{padding-right:var(--space-12)}
.log-top{display:flex;align-items:center;gap:var(--space-3);min-height:var(--hit-min)}
.log-icon{flex:none;width:var(--hit-area);height:var(--hit-area);border-radius:var(--radius-md);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.log-icon svg.line{width:var(--icon-section);height:var(--icon-section)}
.log-icon small{font-size:var(--text-micro);font-weight:700;line-height:1}
.log-icon.k-학습{background:var(--info-soft);color:var(--info-ink)}
.log-icon.k-과제{background:var(--warning-soft);color:var(--warning-ink)}
.log-icon.k-평가{background:var(--success-soft);color:var(--success-ink)}
.log-title{flex:0 1 auto;min-width:0;font-weight:700;font-size:var(--text-small);line-height:1.4}
.log-meta{display:block;margin-top:var(--space-2)}
.log-context{display:block;font-size:var(--text-caption);color:var(--text-muted);white-space:pre-wrap;margin-bottom:var(--space-1)}
.log-chev{position:absolute;right:var(--space-1);bottom:0;width:var(--hit-min);height:var(--hit-min);padding:0;border:0;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer}
.log-chev span{width:var(--space-6);height:var(--space-6);border-radius:50%;border:1px solid var(--brand-border);background:var(--surface);color:var(--brand-deep);display:flex;align-items:center;justify-content:center}
.log-chev svg.line{width:var(--icon-sm);height:var(--icon-sm)}
.log-chev[aria-expanded="true"] span{transform:rotate(180deg)}
/* v2.5.95: 아래 줄은 리포트처럼 단원 "• " 줄 → 내용(.log-note, 줄바꿈 그대로) → 출제·마감. 펼침 칸에는 페이지 본문만 */

.form label{margin-top:var(--space-4)}
/* 범위 아래 단원 안내(v2.5.125): 고른 교재의 단원 시작쪽으로 범위에 걸친 단원 */

dialog.sheet{width:min(100%,var(--form-max));max-width:100%;margin:auto auto 0;border-radius:var(--radius-lg);border-bottom-left-radius:0;border-bottom-right-radius:0;max-height:85vh;overflow:auto}
.choose{display:flex;flex-direction:column;gap:var(--space-2)}
.choose button{display:flex;align-items:center;gap:var(--space-3);text-align:left;min-height:calc(var(--hit-min) + var(--space-4));padding:var(--space-3) var(--space-4);border:1px solid var(--brand-border);border-radius:var(--radius-md);background:var(--surface);font:inherit;color:inherit;cursor:pointer}
.choose small{display:block;color:var(--text-muted);font-size:var(--text-label);font-weight:400}
.empty{margin:0;color:var(--text-subtle);font-size:var(--text-label);text-align:center;padding:var(--space-3) var(--space-4)} /* 문단 기본 아래 여백을 빼서 빈 칸 가운데에 */
.empty.tall{padding:var(--space-8) var(--space-4);line-height:1.7}
svg.line.check,.row svg.line,.choose svg.line,.pill svg.line{width:var(--icon-md);height:var(--icon-md);flex:none}
.nl{flex:none}
/* 칸 머리(v2.5.69): 제목 / 안내(집계 숫자 포함) / 가운데 탭 + 오른쪽 버튼. 리포트처럼 본문이 상단 바 가까이에서 시작한다. */
.ph{min-width:0}
.ph .page-title{margin:0 0 var(--space-1)}
.page-hint.ph{margin:0 0 var(--space-4)}
.page-hint b{color:var(--text-ink)}
.page-title .grow{flex:1}
.tab-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:var(--space-2);margin-bottom:var(--space-4)}
.tab-row .center-tabs{margin:0}
.tab-row .acts{display:flex;justify-content:flex-end;align-items:center;gap:var(--space-1)}
/* 칸 머리 버튼(.act): 전환 탭과 같은 32px 알약·12px 글자로 보이고, 위아래 투명 여백으로 누르는 영역은 44px */
.act{min-height:var(--hit-min);min-width:var(--hit-min);padding:0;border:0;background:transparent;font:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}
.act span{display:inline-flex;align-items:center;gap:var(--space-1);height:calc(var(--hit-min) - var(--space-3));padding:0 var(--space-3);border-radius:var(--radius-pill);background:var(--brand-soft);color:var(--brand-deep);font-size:var(--text-caption);font-weight:700;white-space:nowrap}
.act svg.line{width:var(--icon-sm);height:var(--icon-sm)}
.pick-row .grow{flex:1;min-width:0}
.pick-row .chips{padding-bottom:0}
.pick{flex:none;width:var(--hit-area);display:inline-flex;justify-content:center}
/* 설명 줄이 빈 학생도 줄 높이가 같게 */
.row .d:empty::before{content:"\a0"}
.note-hint{color:var(--text-subtle);font-size:var(--text-caption);margin:var(--space-2) 0 0}
.pbody>.sec-title:first-child{margin-top:var(--space-3)}
/* 모든 화면의 첫 제목은 상단 바 아래 같은 높이(본문 위 여백 16 + 4) */
.cr-main>.ph:first-child .page-title,.cr-main>.page-title:first-child{margin-top:var(--space-1)}
/* 캘린더(v2.5.70): 학부모 리포트 캘린더(student_report.html .attendance-calendar·.cal-month-nav·.cal-day·.cal-collapse-btn·.cal-day-head)와
   같은 구조·모양이고 크기 값도 리포트 끝의 "캘린더 공통 모양"과 같다. 날짜 칸은 월 전체·주 한 줄 모두 가로 4 : 세로 5(칸 높이 최대 72px, 달력 폭 기준)로 고정(v2.5.79), 이동·오늘 버튼은 44px 클릭 영역 안에 리포트 크기로 그린다. */
.attendance-calendar{background:var(--surface);border-radius:var(--radius-lg);padding:var(--space-3);box-shadow:var(--shadow-card)}
.cal-month-nav{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;margin-bottom:var(--space-1)}
.cal-month-nav>.cal-nav-btn:first-child{justify-self:start}
.cal-month-title{justify-self:center;text-align:center;font-size:var(--text-body);font-weight:700;white-space:nowrap}
.cal-nav-right{justify-self:end;display:flex;align-items:center}
.cal-nav-left{justify-self:start;display:flex;align-items:center}
.cal-week-btn span{white-space:nowrap}
.cal-nav-btn,.cal-today-btn{min-width:var(--hit-min);min-height:var(--hit-min);padding:0;border:0;background:transparent;font:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.cal-nav-btn span{width:calc(var(--hit-min) - var(--space-3));height:calc(var(--hit-min) - var(--space-3));border-radius:var(--radius-pill);background:var(--brand-soft);color:var(--brand-deep);font-size:var(--text-body);font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.cal-today-btn span{padding:var(--space-1) var(--space-3);border-radius:var(--radius-pill);background:var(--brand-soft);color:var(--brand-deep);font-size:var(--text-caption);font-weight:700}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--space-1);container-type:inline-size}
.cal-dow{font-size:var(--text-caption);font-weight:600;color:var(--text-subtle);text-align:center;padding-bottom:var(--space-1)}
.cal-dow.sat{color:var(--info-ink)}.cal-dow.sun{color:var(--danger-ink)}
.cal-day{height:min(calc((100cqw - 6*var(--space-1))/7*5/4),4.5rem);min-width:0;padding:0;border:0;border-radius:var(--radius-md);background:transparent;color:var(--text-subtle);font:inherit;font-size:var(--text-body);cursor:pointer;display:flex;align-items:center;justify-content:center}
.cal-day.empty{cursor:default}
/* 날짜 이동 캘린더(v2.5.79): 수업 있는 날은 칸을 칠하고(has) 보고 있는 날은 진하게(picked), 오늘은 빨간 테두리. 수업 없는 날은 흐리게·누를 수 없음. 출석 숫자·색은 넣지 않는다. */
/* 수업 없는 날(v2.5.100): 리포트처럼 흐리게 하지 않고 옅은 글자색만(누를 수 없음) — 한 달 달력으로 보인다 */
.cal-day.off{color:var(--text-subtle);cursor:default}
.cal-day.has{background:var(--brand-light);color:var(--brand-on-primary);font-weight:700}
.cal-day.has.today{box-shadow:inset 0 0 0 2px var(--danger)}
.cal-nav-btn:disabled{opacity:.3;cursor:default}
.row.cur{box-shadow:inset 3px 0 0 var(--brand-deep);background:var(--brand-tint)}
.cr-bar .icon-btn:disabled{opacity:.3;cursor:default}
.ph.title-row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2)}
.center-tabs.left{justify-content:flex-start;margin:0}
/* 서랍(v2.5.80, v2.5.87부터 첫 화면 ☰ 사이드바): 오른쪽에서 열림. 화면 높이 전체, 폭은 폰 86%·최대 360, 바깥은 어둡게. */
dialog.drawer{position:fixed;inset:0 auto 0 0;margin:0;width:min(86vw,22.5rem);max-width:none;height:100%;max-height:none;padding:0;border:0;background:var(--surface);color:inherit;box-shadow:var(--shadow-md);overflow:auto}
dialog.drawer.left{border-radius:0;border-top-right-radius:var(--radius-lg);border-bottom-right-radius:var(--radius-lg);animation:dr-left .18s ease-out}
dialog.drawer.right{inset:0 0 0 auto;border-radius:0;border-top-left-radius:var(--radius-lg);border-bottom-left-radius:var(--radius-lg);animation:dr-right .18s ease-out}
@keyframes dr-left{from{transform:translateX(-100%)}}
@keyframes dr-right{from{transform:translateX(100%)}}
@media(prefers-reduced-motion:reduce){dialog.drawer{animation:none!important}}
.dr-in{min-height:100%;box-sizing:border-box;padding:0 var(--space-4) var(--space-4);display:flex;flex-direction:column}
/* 서랍 머리는 상단 바와 같은 높이(56)·같은 가운데 선, ✕는 상단 바 버튼처럼 서랍 가장자리에서 8px */
.dr-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);min-height:var(--header-h);margin:0 calc(-1*var(--space-2)) var(--space-2) 0}
.dr-head h2{margin:0;min-width:0;font-size:var(--text-title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drawer .attendance-calendar.flat{box-shadow:none;padding:0}
.dr-foot{margin-top:auto;padding-top:var(--space-4)}
/* 학생 목록 한 줄(v2.5.80): [이름] [출석] [등원] [하원] [메모]. 머리 줄과 같은 칸·같은 안쪽 여백으로 열을 맞춘다. */
.stu{--stu-cols:minmax(0,1fr) 3.5rem 3rem 3rem var(--hit-min)}
.stu .srow-h,.stu .s1{display:grid;grid-template-columns:var(--stu-cols);align-items:center;column-gap:var(--space-2);padding:0 var(--space-2) 0 var(--space-4)}
.stu.editing{--stu-cols:minmax(0,1fr) auto}
.stu .srow-h{min-height:var(--space-8);font-size:var(--text-caption);font-weight:600;color:var(--text-subtle);border-bottom:1px solid var(--divider)}
.stu .s1{min-height:calc(var(--hit-min) + var(--space-2))}
.stu .s1+.s1{border-top:1px solid var(--divider)}
.stu .c{justify-self:center;text-align:center}
.stu .tm{font-size:var(--text-label);color:var(--text-muted);font-variant-numeric:tabular-nums}
.stu .nm{min-width:0;min-height:var(--hit-min);padding:0;border:0;background:transparent;font:inherit;font-weight:700;color:inherit;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center}
.stu .seg{justify-self:end}
.memo-btn{width:var(--hit-min);height:var(--hit-min);padding:0;border:0;border-radius:var(--radius-md);background:transparent;color:var(--text-subtle);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.memo-btn svg.line{width:var(--icon-md);height:var(--icon-md)}
.memo-btn.has{background:var(--brand-soft);color:var(--brand-deep)}
.chips.quick{flex-wrap:wrap;overflow:visible;margin-top:var(--space-2)}
/* 교재 카드(v2.5.80): 학부모 리포트 교재 카드(.book-row)처럼 [표지 3:4] [교재명 / 설명 / 진도 막대 / 최근 범위]. 기록 만들기의 교재 칸과 교재 고르기 목록에 쓴다.
   표지(72×96)가 카드 안에서 가장 높고 가운데에 오게 해(교재명은 한 줄) 표지와 카드 테두리 사이 위·왼쪽·아래 여백이 모두 12px로 같다. */
.book-row{position:relative;display:flex;gap:var(--space-3);align-items:center;width:100%;padding:var(--space-3);border:1px solid var(--control-border);border-radius:var(--radius-md);background:var(--surface);font:inherit;color:inherit;text-align:left;cursor:pointer}
.book-row.empty{border:2px dashed var(--brand-border);background:var(--brand-tint)}
.book-row.on{border:2px solid var(--brand-deep)}
.br-cover{position:relative;flex:none;width:calc(var(--space-12) + var(--space-6));aspect-ratio:3/4;border-radius:var(--radius-sm);overflow:hidden;background:var(--brand-soft);color:var(--text-subtle);display:flex;align-items:center;justify-content:center}
.book-row.empty .br-cover{background:var(--surface);border:1px solid var(--brand-border)}
.br-cover svg.line{width:var(--icon-lg);height:var(--icon-lg)}
.br-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.br-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--space-1)}
.br-title{font-weight:800;font-size:var(--text-body);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book-row.on .br-title{padding-right:var(--space-8)}
.br-sub{font-size:var(--text-caption);color:var(--text-subtle)}
.progress-line{display:flex;align-items:center;gap:var(--space-2);margin-top:var(--space-1)}
.progress-line .track{flex:1;height:var(--space-2);border-radius:var(--radius-pill);background:var(--brand-soft);overflow:hidden}
.progress-line .fill{display:block;height:100%;border-radius:var(--radius-pill);background:var(--brand-deep)}
.progress-line b{font-size:var(--text-caption)}
.br-recent{display:flex;align-items:center;gap:var(--space-1);min-width:0;font-size:var(--text-caption);color:var(--text-muted)}
.br-recent span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br-recent svg.line{flex:none;width:var(--icon-sm);height:var(--icon-sm)}
.br-chev{flex:none;align-self:center;font-size:var(--text-title);color:var(--text-subtle)}
.br-check{position:absolute;top:var(--space-3);right:var(--space-3);width:var(--space-6);height:var(--space-6);border-radius:var(--radius-pill);background:var(--brand-deep);color:var(--surface);display:flex;align-items:center;justify-content:center}
.br-check svg.line{width:var(--icon-sm);height:var(--icon-sm)}
.br-list{display:flex;flex-direction:column;gap:var(--space-2)}
/* 교재 탭·교재 상세 카드(v2.5.102): 학부모 리포트 교재 카드(student_report.html .book-row)와 같은 결 —
   테두리 없는 흰 그림자 카드(모서리 14, 안쪽 12/16), 위로 맞춤, 표지 64×86(모서리 6)·표지가 없으면 갈색 그라데이션에 교재명, 제목은 줄바꿈, 카드 사이 10 */
.br-list.feed{gap:calc(2.5*var(--space-1))}
.book-row.feed{align-items:flex-start;gap:var(--space-4);border:0;border-radius:var(--radius-lg);padding:var(--space-4);background:var(--surface);box-shadow:var(--shadow-card)}
.book-row.feed .br-cover{width:calc(var(--space-12) + var(--space-4));background:linear-gradient(160deg,var(--brand-mid),var(--brand-deep));color:var(--surface);align-items:flex-end;justify-content:flex-start;padding:var(--space-2)}
.book-row.feed .br-fallback{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:var(--text-caption);font-weight:700;line-height:1.3;word-break:keep-all}
.book-row.feed .br-title{white-space:normal;word-break:keep-all}
.book-row.feed .progress-line{margin-top:var(--space-2)}
.book-row.feed .br-recent{margin-top:var(--space-1)}
/* 구분 탭은 가로 전체 3등분 */
.kind-tabs{display:block}
.kind-tabs .tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%}
.kind-tabs .tabs button span{padding-left:0;padding-right:0;display:flex;align-items:center;justify-content:center;gap:var(--space-1)}
/* 구분 탭 아이콘(v2.5.81): 기록 박스 분류 아이콘과 같은 그림·색(학습 edit-2 --info-ink, 과제 clipboard --warning-ink, 평가 file-text --success-ink) */
.kind-tabs svg.kind-ic{flex:none;width:var(--icon-sm);height:var(--icon-sm)}
.kind-tabs [data-ck="학습"] svg.kind-ic{color:var(--info-ink)}
.kind-tabs [data-ck="과제"] svg.kind-ic{color:var(--warning-ink)}
.kind-tabs [data-ck="평가"] svg.kind-ic{color:var(--success-ink)}
.cal-day.plan{box-shadow:inset 0 0 0 1.5px var(--brand-border);color:var(--text-muted)}
.cal-day.picked{box-shadow:inset 0 0 0 2px var(--brand-deep)}
.cal-day.today,.cal-day.today.picked{box-shadow:inset 0 0 0 2px var(--danger)}
.cal-day.today span{font-weight:800}
.cal-collapse-btn{width:100%;min-height:var(--hit-min);border:0;background:transparent;font:inherit;font-size:var(--text-caption);font-weight:600;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:var(--space-1)}
.cal-collapse-btn svg.line{width:var(--icon-sm);height:var(--icon-sm)}
.cal-day-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);margin:var(--space-4) var(--space-1) var(--space-2)}
.cal-day-head b{font-size:var(--text-label);font-weight:600;color:var(--text-subtle)}
/* 수업 한 줄(v2.5.70): [클래스 이모지] [클래스명] [등원 n/전체] [수업 시간]. 등원은 0명 회색, 일부 노랑, 모두 초록 */
.srow{min-height:calc(var(--hit-min) + var(--space-4))}
/* 클래스 이모지·보강 대기실 아이콘은 바탕 도형 없이 24px 칸에(v2.5.80). 카드 왼쪽 여백에 붙고 이름과 8px — 상단 바 "🟡 중1 B"와 같은 간격. */
.srow{column-gap:var(--space-2)}
.emo{flex:none;width:var(--space-6);display:inline-flex;align-items:center;justify-content:center;font-size:var(--text-title);line-height:1}
.emo.ico{color:var(--brand-deep)}
.emo.ico svg.line{width:var(--icon-md);height:var(--icon-md)}
.cnt-pill{flex:none;font-size:var(--text-caption);font-weight:700;padding:var(--space-1) var(--space-2);border-radius:var(--radius-pill);background:var(--brand-soft);color:var(--text-muted);font-variant-numeric:tabular-nums}
.cnt-pill.part{background:var(--warning-soft);color:var(--warning-ink)}
.cnt-pill.ok{background:var(--success-soft);color:var(--success-ink)}
.time{flex:none;width:calc(var(--hit-area) + var(--space-12));text-align:right;color:var(--text-muted);font-size:var(--text-label);font-variant-numeric:tabular-nums}
.time.none{color:var(--text-subtle)}
.time.chev{width:auto;font-size:var(--text-title);color:var(--text-subtle)}
.list.wait{margin-top:var(--space-3)}
/* ===== v2.5.87 학부모 리포트와 같은 구조 =====
   첫 화면: 리포트 첫 화면(.intro-section·.class-btn)처럼 배경 그대로, 가운데에 강사 이름·담당 클래스 카드·보강 대기실, 오른쪽 위 새로고침·☰.
   아래로 넘기면 주간 시간표(리포트 통합 시간표 .week-grid 모양). */
/* 첫 화면 넘김(v2.5.90): 학부모 리포트 첫 화면(student_report.html .scroll-container·.snap-section·.swipe-hint·.up-hint)과 같은 구조.
   화면 높이 칸 두 개(① 강사·클래스 ② 통합 시간표)를 위아래로 넘기면 칸 단위로 멈춘다. 클래스가 많아 칸보다 길면 그 칸 안에서 이어서 내려간다.
   v2.5.91: 내용은 위아래 여백(margin auto)으로 가운데에 두어, 칸보다 길어도 위가 잘리지 않고 위에서부터 보인다. 바깥 문서는 움직이지 않는다. */
html:has(body.snap-on),body.snap-on{height:100%;overflow:hidden}
body.snap-on .cr-main{max-width:none;padding:0}
.scroll-container{height:100svh;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior-y:none}
.snap-section{position:relative;min-height:100svh;box-sizing:border-box;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:var(--space-12) var(--space-4)}
.intro-tools{position:absolute;top:var(--space-2);right:var(--space-2);display:flex;gap:var(--space-1)}
.intro-in{width:100%;max-width:var(--feed-w);display:flex;flex-direction:column;align-items:center;margin:auto 0}
.snap-section.intro{justify-content:flex-start;padding-bottom:var(--space-2)}
.intro-greeting{margin:0 0 var(--space-1);font-size:var(--text-small);color:var(--brand-deep)}
.intro-name{margin:0 0 var(--space-2);font-size:var(--text-display);font-weight:800;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.intro-sub{margin:0 0 var(--space-8);font-size:var(--text-small);color:var(--text-muted)}
/* 클래스 카드 크기(v2.5.92): 리포트 첫 화면 .class-btn(높이 약 52, 간격 10)과 같게. 카드 5개까지 일반 폰 한 화면에 들어온다 */
.class-group{width:100%;max-width:var(--dialog-sm);display:flex;flex-direction:column;gap:calc(2.5*var(--space-1));margin-bottom:var(--space-6)}
.class-card{display:flex;align-items:center;gap:var(--space-3);width:100%;min-height:calc(var(--hit-min) + var(--space-2));padding:var(--space-3) var(--space-5);border:1px solid var(--brand-border);border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow-card);font:inherit;color:var(--brand-deep);text-align:left;cursor:pointer}
.class-card .cc-name{flex:1;min-width:0;font-weight:700;font-size:var(--text-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb-badge{flex:none;padding:var(--space-1) var(--space-3);border-radius:var(--radius-pill);background:var(--brand-soft);color:var(--text-muted);font-size:var(--text-caption);font-weight:700;font-variant-numeric:tabular-nums}
.cb-badge.on{background:var(--success-soft);color:var(--success-ink)}
.cb-badge.none{color:var(--text-subtle)}
.wait-card{display:inline-flex;align-items:center;gap:var(--space-2);min-height:calc(var(--hit-min) + var(--space-4));padding:var(--space-2) var(--space-5);border:2px dashed var(--brand-border);border-radius:var(--radius-lg);background:transparent;font:inherit;font-weight:700;color:var(--text-ink);cursor:pointer}
.wait-card svg.line{width:var(--icon-md);height:var(--icon-md);color:var(--brand-deep)}
/* 넘김 안내(리포트 .swipe-hint·.up-hint): 12px 글자 + 겹화살표, 아래 안내는 통통 튄다. 누르는 영역 44px */
.swipe-hint,.up-hint{position:absolute;left:50%;transform:translateX(-50%);min-height:var(--hit-min);min-width:calc(4*var(--hit-min));padding:0 var(--space-3);border:0;background:transparent;font:inherit;font-size:var(--text-caption);color:var(--text-muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
/* 첫 칸의 [통합 시간표 보기]는 내용 아래에 붙는다(v2.5.91): 칸이 넉넉하면 칸 맨 아래, 내용이 길면 보강 대기실 아래로 밀려 겹치지 않는다. */
.swipe-hint{position:static;transform:none;flex:none;margin-top:var(--space-5);padding-bottom:var(--space-3)} /* 아래 여백: 겹화살표가 6px 튀어도 잘리지 않게(v2.5.92) */
/* 다른 클래스 접기(v2.5.91): 카드와 같은 폭의 점선 없는 옅은 줄, 펼치면 ⌄가 뒤집힌다 */
.more-card{display:flex;align-items:center;justify-content:center;gap:var(--space-1);width:100%;min-height:var(--hit-min);border:0;border-radius:var(--radius-lg);background:var(--brand-soft);font:inherit;font-size:var(--text-label);font-weight:700;color:var(--text-muted);cursor:pointer}
.more-card svg.line{width:var(--icon-sm);height:var(--icon-sm);transition:transform .15s ease}
.more-card.open svg.line{transform:rotate(180deg)}
.class-more{display:flex;flex-direction:column;gap:calc(2.5*var(--space-1))}
.class-more[hidden]{display:none}
.up-hint{top:var(--space-3);color:var(--text-subtle)}
.swipe-hint .chevron,.up-hint .chevron{display:block;width:var(--icon-md);height:var(--icon-md)}
.swipe-hint .chevron svg.line,.up-hint .chevron svg.line{width:100%;height:100%;display:block}
.swipe-hint .chevron{margin-top:var(--space-1);animation:hint-bounce 1.6s infinite}
.up-hint .chevron{margin-bottom:var(--space-1)}
@keyframes hint-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
@media(prefers-reduced-motion:reduce){.swipe-hint .chevron{animation:none}}
/* 통합 시간표(리포트 .timetable-section·.tt-card·.week-grid·.week-slot와 같은 크기): 제목 17px·아이콘 18, 안내 12px, 카드 폭은 리포트 --content-w,
   칸 간격 6, 요일 12px, 수업 칸 글자 11px·안쪽 6/4·모서리 8, 반마다 다른 색(--class-n-bg/fg). 수업 칸은 버튼이라 높이만 44px. */
:root{--tt-w:clamp(300px,96vw,620px);--tt-pad-y:clamp(8px,min(4vw,3.6vh),24px);--tt-pad-x:clamp(6px,min(3vw,2.4vh),14px);--tt-gap:6px}
@media(min-width:700px){:root{--tt-w:clamp(480px,82vw,760px)}}
@media(min-width:1100px){:root{--tt-w:clamp(560px,55vw,820px)}}
.tt-title{display:flex;align-items:center;gap:var(--space-2);margin:0 0 var(--space-1);font-size:var(--text-lead);font-weight:700}
.tt-icon{display:inline-flex;width:var(--icon-title);height:var(--icon-title)}
.tt-icon svg.line{width:100%;height:100%}
.tt-hint{margin:0 0 var(--space-5);font-size:var(--text-caption);color:var(--text-subtle)}
.wk-card{width:100%;max-width:var(--tt-w);box-sizing:border-box;background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:var(--tt-pad-y) var(--tt-pad-x)}
.wk-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--tt-gap)}
.wk-col{min-width:0;display:flex;flex-direction:column;gap:var(--space-1)}
.wk-day{text-align:center;font-size:var(--text-caption);font-weight:600;color:var(--text-muted);margin-bottom:var(--space-1)}
.wk-col.today .wk-day{color:var(--danger)}
.wk-slot{min-width:0;min-height:var(--hit-min);padding:var(--tt-gap) var(--space-1);border:0;border-radius:var(--radius-sm);background:var(--brand-tint);color:var(--brand-deep);font:inherit;font-size:var(--text-micro);line-height:1.3;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;word-break:keep-all}
.wk-slot b{font-weight:700}
.wk-slot.c1{background:var(--class-1-bg);color:var(--class-1-fg)}.wk-slot.c2{background:var(--class-2-bg);color:var(--class-2-fg)}
.wk-slot.c3{background:var(--class-3-bg);color:var(--class-3-fg)}.wk-slot.c4{background:var(--class-4-bg);color:var(--class-4-fg)}
.wk-slot.c5{background:var(--class-5-bg);color:var(--class-5-fg)}.wk-slot.c6{background:var(--class-6-bg);color:var(--class-6-fg)}
.wk-slot.c7{background:var(--class-7-bg);color:var(--class-7-fg)}.wk-slot.c8{background:var(--class-8-bg);color:var(--class-8-fg)}
.wk-slot span{max-width:100%;overflow:hidden;text-overflow:ellipsis}
/* 사이드바 강사 정보 */
.who-card{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-4)}
.who-card .meta{min-width:0}
.who-card b{display:block;font-size:var(--text-lead)}
.who-card small{display:block;color:var(--text-muted);font-size:var(--text-label)}
.menu-list{margin-top:var(--space-4)}
/* 요약 숫자 칸(리포트 .home-stats): 3칸, 연한 베이지 바탕 */
.home-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-2)}
.home-stat{min-width:0;background:var(--brand-tint);border-radius:var(--radius-md);padding:var(--space-3) var(--space-1);text-align:center}
/* 누르는 요약 칸(v2.5.93): 홈 등원·과제 제출 → 캘린더 출석 체크·과제 점검. 모양은 같고 라벨 끝에 ›, 누르는 영역 44px 이상 */
.home-stat.go{border:0;font:inherit;color:inherit;cursor:pointer;min-height:var(--hit-min);width:100%}
/* 캘린더 접힌 날 아래 탭(v2.5.93): [출석 체크 | 과제 점검 | 학습 기록]은 가운데 전환 탭, 아래 한 줄에 집계와 [편집]·↗ */
.check-tabs{margin:var(--space-2) 0 var(--space-1)}
.check-row{margin:0 0 var(--space-2);min-height:var(--hit-min)}
.check-row .sum{margin:0}
.check-row .sum b{color:var(--text-ink)}
/* 메모 창 [메모 | 선생님 한마디]: 전환 탭 기준 아래 16(.center-tabs.left의 margin:0보다 우선) */
.center-tabs.note-tabs{margin:0 0 var(--space-4)}
/* 학생 명부(v2.5.93): [이름 학교 · 학년] / 연락처(누르면 전화, 44px) / ↗ 학생 보고서 */
.icon-btn.rep{flex:none;margin-left:auto;color:var(--brand-deep)} /* ⌄ 칸(오른쪽 여백) 바로 왼쪽: 알약 없는 짧은 줄에서 ⌄와 겹치지 않게 */
/* 반 요약(v2.5.94, v2.5.96): 요약 3칸(리포트 .home-stats: 출석률·과제이행률·최근 평가 평균) + 리포트 "최근 평가 추이"와 같은 꺾은선 그래프
   (student_report.html .chart-wrap: 폭 최대 480, 400:220, 선·점 --brand-deep, 눈금선 --divider, 눈금 숫자 --text-subtle) */
.cls-sum{margin-bottom:var(--space-4)}
.cls-sum .group-label{margin-top:var(--space-4)}
.trend{width:100%;max-width:calc(10*var(--space-12));margin:0 auto;aspect-ratio:400/220;max-height:min(34vh,300px)}
.trend svg{width:100%;height:100%;display:block}
.trend .tg{stroke:var(--divider);stroke-width:1}
.trend .tt{fill:var(--text-subtle)}
.trend .tl{fill:none;stroke:var(--brand-deep);stroke-width:2}
.trend .td{fill:var(--brand-deep)}
.trend .tv{fill:var(--brand-deep);font-weight:700}
.trend .tx{fill:var(--text-muted)}
/* 학생 줄(v2.5.96): [이름 학교·학년 … ↗(이름과 같은 높이)] / 알약 / ⌄ 펼치면 연락처·보고서 상태(기록 카드 펼치기와 같은 모양) */
.roster .r1+.r1{border-top:1px solid var(--divider)}
.r-body{padding:var(--space-2) var(--space-12) var(--space-3) var(--space-4);min-height:calc(var(--hit-min) + var(--space-4))}
.r-top{display:flex;align-items:center;gap:var(--space-2);min-height:var(--hit-min)}
.r-name{flex:0 1 auto;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-name small{font-weight:400;font-size:var(--text-label);color:var(--text-subtle);margin-left:var(--space-1)}
.r-stats{display:flex;flex-wrap:wrap;gap:var(--space-1)}
.r-extra .phones{display:flex;flex-wrap:wrap;column-gap:var(--space-4)}
.r-extra .tel{display:inline-flex;align-items:center;min-height:var(--hit-min);color:var(--brand-deep);font-size:var(--text-label);font-weight:600;text-decoration:none;font-variant-numeric:tabular-nums}
.r-extra .no-tel{display:inline-flex;align-items:center;min-height:var(--hit-min);font-size:var(--text-label);color:var(--text-subtle)}
.r-extra .no-rep{margin:0;font-size:var(--text-caption);color:var(--text-subtle)}
.home-stat b{display:block;line-height:var(--space-5);font-size:var(--text-section);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home-stat small{display:block;margin-top:var(--space-1);line-height:var(--space-4);font-size:var(--text-micro);color:var(--text-muted)}
.home-stat.good b{color:var(--success-ink)}
.home-stat.bad b{color:var(--danger-ink)}
/* 비율·점수 4구간(DESIGN.md 1부 3장): good 90 이상 · fair 70 이상 · low 50 이상 · bad 50 미만 */
.home-stat.fair b{color:var(--warning-ink)}.home-stat.low b{color:var(--orange-ink)}
.pill.b-good{background:var(--success-soft);color:var(--success-ink)}.pill.b-fair{background:var(--warning-soft);color:var(--warning-ink)}.pill.b-low{background:var(--orange-soft);color:var(--orange-ink)}.pill.b-poor{background:var(--danger-soft);color:var(--danger-ink)}
.card .home-stats+.actions{margin-top:var(--space-3)}
/* 반 상세 머리(리포트 등록 상세 큰 머리): 상단 바 아래 베이지 띠에 [이모지 반 이름] / [선생님 · 요일 시각]. 홈 탭에서만. */
.cr-hero{background:var(--brand-primary);color:var(--brand-on-primary)}
.hero-in{max-width:calc(var(--feed-w) + 2*var(--space-4));margin:0 auto;padding:var(--space-1) var(--space-5) var(--space-5)}
.hero-title{display:flex;align-items:center;gap:var(--space-3);margin:0;font-size:var(--text-title);font-weight:800;min-width:0}
.hero-title .nm{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-title .nl{color:inherit;margin-left:auto}
.hero-sub{margin:var(--space-1) 0 0;font-size:var(--text-small);opacity:.8}
/* 홈 "보고 있는 수업" 카드: 왼쪽 날짜·시간, 오른쪽 ‹ › */
.now-card{display:flex;align-items:center;gap:var(--space-2)}
.now-card .meta{flex:1;min-width:0}
.now-card small{display:block;color:var(--text-muted);font-size:var(--text-caption)}
.now-card b{display:block;font-size:var(--text-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now-nav{flex:none;display:flex}
/* 캘린더 출석 색 */
/* 캘린더 칸(v2.5.100, 학부모 리포트 .attendance-calendar와 같은 결): 모두 출석 초록·결석 있음 빨강(-soft 바탕, 글자는 대비 위해 -ink),
   출석 미입력인 지난 수업은 리포트와 같은 빗금, 앞으로의 수업·오늘 진행 중은 테두리만, 보고 있는 수업은 채우지 않고 갈색 테두리, 오늘은 빨간 테두리 */
.cal-day.has.ok{background:var(--success-soft);color:var(--success-ink)}
.cal-day.has.bad{background:var(--danger-soft);color:var(--danger-ink)}
.cal-day.has.miss{background:repeating-linear-gradient(135deg,transparent 0 4px,var(--brand-soft) 4px 8px);color:var(--text-subtle)}
.cal-day.has.plan,.cal-day.has.open{background:transparent;color:var(--text-muted);box-shadow:inset 0 0 0 1.5px var(--brand-border)}
.cal-day.has.picked{box-shadow:inset 0 0 0 2px var(--brand-deep)}
.cal-day.has.today,.cal-day.has.today.picked{box-shadow:inset 0 0 0 2px var(--danger)}
/* 범례(v2.5.100): 리포트처럼 진한 점 두 개만(모두 출석·결석 있음). 빗금·테두리는 범례 없이도 알아볼 수 있다 */
.cal-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--space-2) var(--space-4);margin-top:var(--space-3);font-size:var(--text-micro);color:var(--text-muted)}
.cal-legend span{display:inline-flex;align-items:center;gap:var(--space-1)}
.cal-legend i{width:var(--space-2);height:var(--space-2);border-radius:50%}
.cal-legend i.ok{background:var(--success)}.cal-legend i.mid{background:var(--warning-graphic)}.cal-legend i.bad{background:var(--danger)}
/* 현황 색(v2.5.103): 100% 초록 · 50% 이상 노랑 · 50% 미만 빨강 */
.cal-day.has.mid{background:var(--warning-soft);color:var(--warning-ink)}
/* 달 보기 위 막대 카드(v2.5.103, 리포트 .session-bar B안): 첫 줄 "n월 수업 ··· 지난/전체회", 둘째 줄 막대 한 줄, 아래 칩 4개(누르면 그날로) */
.cal-sum{margin-bottom:var(--space-3)}
.sum-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2);line-height:var(--space-5)}
.sum-bar .lbl{font-size:var(--text-label);font-weight:600;color:var(--text-muted)}
.sum-bar b{margin-left:auto;font-size:var(--text-section);color:var(--brand-deep)}
.sum-bar .cells{order:3;flex-basis:100%;display:flex;gap:var(--space-1);min-width:0}
.sum-bar .cells i{flex:1;height:var(--space-2);border-radius:var(--radius-xs);box-shadow:inset 0 0 0 1px var(--brand-border)}
.sum-bar .cells i.ok{background:var(--success);box-shadow:none}.sum-bar .cells i.mid{background:var(--warning-graphic);box-shadow:none}.sum-bar .cells i.bad{background:var(--danger);box-shadow:none}
.sum-bar .cells i.miss{background:repeating-linear-gradient(135deg,transparent 0 3px,var(--brand-soft) 3px 6px)}
.sum-chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-2);margin-top:var(--space-3)}
.sum-chip{min-height:var(--hit-min);border:0;border-radius:var(--radius-md);background:var(--brand-tint);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--space-2) var(--space-1);min-width:0}
.sum-chip b{line-height:var(--space-6);font-size:var(--text-body);font-weight:800;color:var(--text-ink)}
.sum-chip small{line-height:var(--space-4);font-size:var(--text-micro);font-weight:600;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sum-chip.ok b{color:var(--success-ink)}.sum-chip.mid b{color:var(--warning-ink)}.sum-chip.bad b{color:var(--danger-ink)}
.sum-chip:disabled{cursor:default;opacity:.55}
/* 학습기록 타임라인 오늘 묶음(v2.5.103): 오늘 기록 카드는 테두리 */
/* 속도 측정 칸(?timing=1, v2.5.108): 화면 오른쪽 아래, 누르기를 막지 않음 */
.timing{position:fixed;right:var(--space-2);bottom:calc(var(--hit-min) + var(--space-8));z-index:50;margin:0;max-width:calc(100% - 2*var(--space-2));padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);background:var(--surface);box-shadow:var(--shadow-md);font:var(--text-micro)/1.5 var(--font-mono);color:var(--text-ink);white-space:pre-wrap;pointer-events:none}
.rec-day.today .log-card{box-shadow:inset 0 0 0 1.5px var(--brand-border),var(--shadow-card)}
/* 학습기록 탭 + 기록 만들기(떠 있는 버튼): 본문 오른쪽 끝, 하단 탭 위 */
.fab{position:fixed;z-index:19;right:max(var(--space-4),calc((100vw - var(--feed-w))/2));bottom:calc(var(--hit-min) + var(--space-8) + var(--space-2));min-height:calc(var(--hit-min) + var(--space-1));padding:0 var(--space-5) 0 var(--space-4);border:0;border-radius:var(--radius-pill);background:var(--brand-deep);color:var(--surface);font:inherit;font-weight:700;box-shadow:var(--shadow-float);display:inline-flex;align-items:center;gap:var(--space-2);cursor:pointer}
.fab svg.line{width:var(--icon-md);height:var(--icon-md)}
/* v2.5.89 홈 "교재 진도"(리포트 홈 교재 진도처럼 한 카드에 [교재명 / 진도 막대]), 교재 상세, 학습기록 날짜 묶음 */
.bp-row{display:block;width:100%;padding:var(--space-3) var(--space-4);border:0;background:transparent;font:inherit;color:inherit;text-align:left;cursor:pointer}
.bp-row+.bp-row{border-top:1px solid var(--divider)}
.bp-t{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
